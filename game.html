<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockrot: two-player zombie survival</title>
<style>
  :root { --bg:#16140f; --ink:#e6dfc8; --muted:#8f8870; }
  * { box-sizing:border-box; margin:0; padding:0; }

    font-family:"Trebuchet MS", "Segoe UI", sans-serif; overflow:hidden; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  canvas { display:block; border:3px solid #000; outline:2px solid #3a362a; }
  #bar { font-size:13px; color:var(--muted); display:flex; gap:18px; }
  #bar a { color:var(--ink); }
  #bar a:focus-visible { outline:2px solid #f2b134; outline-offset:2px; }
  #stage { position:relative; }
  #menu { position:absolute; left:50%; bottom:5%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    background:rgba(18,17,12,.92); border:2px solid #3a362a; padding:14px 18px; width:min(560px, 92%); }
  #menu .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; width:100%; }
  #menu button, #menu input { font:bold 15px "Trebuchet MS", sans-serif; padding:9px 14px;
    border:2px solid #000; background:#3a362a; color:var(--ink); cursor:pointer; }
  #menu button:hover { background:#4e493a; }
  #menu button.main { background:#5f8a45; }
  #menu button.main:hover { background:#6f9c53; }
  #menu input { background:#0e0d09; cursor:text; width:130px; text-transform:uppercase; letter-spacing:3px; }
  #menu button:focus-visible, #menu input:focus-visible { outline:2px solid #f2b134; outline-offset:2px; }
  #net { font-size:14px; color:#f2d27a; min-height:1.3em; text-align:center; }
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>

};

const BOSSES = [
  { key:'brood',  name:'The Broodmother', hp:2600, speed:42, r:40, dmg:30, body:'#5a4a2e', head:'#c7a86b' },
  { key:'pyre',   name:'The Pyre King',   hp:2300, speed:55, r:34, dmg:26, body:'#7a1c12', head:'#ff7a2f' },

];

/* ---------------- CONFIG: map ---------------- */
// [x, y, width, height] in grid cells (1 cell = 40px). Map is 60 x 40 cells.
const OB_GRID = [
  [10,8,4,1],[46,8,4,1],[10,31,4,1],[46,31,4,1],
  [28,17,1,6],[31,17,1,6],
  [20,12,1,4],[39,12,1,4],[20,24,1,4],[39,24,1,4],
  [6,18,2,4],[52,18,2,4],
  [24,4,3,1],[33,4,3,1],[24,35,3,1],[33,35,3,1],
  [4,4,1,4],[5,4,3,1],[55,4,1,4],[52,4,3,1],
  [4,32,1,4],[5,35,3,1],[55,32,1,4],[52,35,3,1],
  [14,19,3,2],[43,19,3,2],
  [25,27,2,2],[33,27,2,2],[25,11,2,2],[33,11,2,2]
];
const BARREL_SPOTS = [[700,500],[1700,500],[700,1100],[1700,1100],[1200,300],
                      [1200,1350],[420,640],[1980,640],[960,800],[1440,800]];
const GATES = [
  {x:600,y:-40,jx:1},{x:1800,y:-40,jx:1},{x:600,y:WH+40,jx:1},{x:1800,y:WH+40,jx:1},
  {x:-40,y:400,jy:1},{x:-40,y:1200,jy:1},{x:WW+40,y:400,jy:1},{x:WW+40,y:1200,jy:1}
];
const OBST = OB_GRID.map(([x,y,w,h]) => ({ x:x*CELL, y:y*CELL, w:w*CELL, h:h*CELL }));

/* ---------------- setup ---------------- */
function fit() {
  const s = Math.min((innerWidth - 16) / W, (innerHeight - 40) / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

const keys = {}, pressed = {};
const CTRL = [
  { up:['KeyW'], down:['KeyS'], left:['KeyA'], right:['KeyD'],
    fire:['Space'], swap:['KeyQ'], build:['KeyE'], med:['KeyF'], strike:['KeyG'] },
  { up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight'],
    fire:['Enter','NumpadEnter','Numpad0'], swap:['ShiftRight','Period'], build:['Slash','Numpad1'],
    med:['Semicolon','Numpad2'], strike:['Quote','Numpad3'] }
];
const BLOCK = new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Slash','Enter','Period','Quote','Semicolon']);
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') {
    if (e.code === 'Enter' || e.code === 'NumpadEnter') { e.preventDefault(); joinOnline(); }
    return;
  }
  if (BLOCK.has(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') state = 'paused'; });
const held = l => l.some(k => keys[k]);
const tap  = l => l.some(k => pressed[k]);

/* ---------------- online state + input routing ---------------- */
// mode: 'local' = both players on this keyboard
//       'host'  = this browser runs the game and plays P1
//       'guest' = this browser sends inputs and draws what the host sends, plays P2
let mode = 'local', myIndex = 0, lobby = 'none';
let peer = null, conn = null, snapAcc = 0, lastHeldSent = '';
const ACTIONS = ['up', 'down', 'left', 'right', 'fire', 'swap', 'build', 'med', 'strike'];
let netHeld = {}, netTaps = {};
const decalQueue = [];
// Online, you can use either key layout.
const anyKeys = a => CTRL[0][a].concat(CTRL[1][a]);
function inHeld(i, a) {
  if (mode === 'local') return held(CTRL[i][a]);
  if (i === myIndex) return held(anyKeys(a));
  return !!netHeld[a];
}
function inTap(i, a) {
  if (mode === 'local') return tap(CTRL[i][a]);
  if (i === myIndex) return tap(anyKeys(a));
  return !!netTaps[a];
}

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const pick = arr => arr[Math.random() * arr.length | 0];
const inRect = (p, o) => p.x > o.x && p.x < o.x + o.w && p.y > o.y && p.y < o.y + o.h;
function norm(x, y) { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; }

/* ---------------- grid + flow field ---------------- */
const blocked = new Uint8Array(GW * GH);
for (const [x, y, w, h] of OB_GRID)
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) blocked[j * GW + i] = 1;
const isBlockedAt = (px, py) => {
  const cx = Math.floor(px / CELL), cy = Math.floor(py / CELL);
  return cx < 0 || cy < 0 || cx >= GW || cy >= GH || blocked[cy * GW + cx] === 1;
};
const field = new Float32Array(GW * GH);
const queue = new Int32Array(GW * GH);
let fieldT = 0;
function computeField() {
  field.fill(1e9);
  let h = 0, t = 0;
  for (const p of players) {
    if (!p.alive) continue;
    const i = clamp(Math.floor(p.y / CELL), 0, GH - 1) * GW + clamp(Math.floor(p.x / CELL), 0, GW - 1);
    if (field[i] !== 0) { field[i] = 0; queue[t++] = i; }
  }
  while (h < t) {
    const i = queue[h++], x = i % GW, y = (i / GW) | 0, d = field[i] + 1;
    if (x > 0)      { const j = i - 1;  if (!blocked[j] && field[j] > d) { field[j] = d; queue[t++] = j; } }
    if (x < GW - 1) { const j = i + 1;  if (!blocked[j] && field[j] > d) { field[j] = d; queue[t++] = j; } }
    if (y > 0)      { const j = i - GW; if (!blocked[j] && field[j] > d) { field[j] = d; queue[t++] = j; } }
    if (y < GH - 1) { const j = i + GW; if (!blocked[j] && field[j] > d) { field[j] = d; queue[t++] = j; } }
  }
}
function flowDir(z, t) {
  const cx = Math.floor(z.x / CELL), cy = Math.floor(z.y / CELL);
  if (cx < 0 || cy < 0 || cx >= GW || cy >= GH)
    return norm(clamp(z.x, CELL * 2, WW - CELL * 2) - z.x, clamp(z.y, CELL * 2, WH - CELL * 2) - z.y);
  const here = field[cy * GW + cx];
  if (here <= 1 || here >= 1e9) return norm(t.x - z.x, t.y - z.y);
  let best = here, bx = 0, by = 0;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
    if (!ox && !oy) continue;
    const nx = cx + ox, ny = cy + oy;
    if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
    if (ox && oy && (blocked[cy * GW + nx] || blocked[ny * GW + cx])) continue;
    const v = field[ny * GW + nx];
    if (v < best) { best = v; bx = ox; by = oy; }
  }
  if (best === here) return norm(t.x - z.x, t.y - z.y);
  return norm((cx + bx + .5) * CELL - z.x, (cy + by + .5) * CELL - z.y);
}

/* ---------------- ground + minimap layers ---------------- */
const gnd = document.createElement('canvas'); gnd.width = WW; gnd.height = WH;
const g = gnd.getContext('2d');
function resetGround() {
  g.fillStyle = '#2b2a22'; g.fillRect(0, 0, WW, WH);
  for (let y = 0; y < WH; y += CELL) for (let x = 0; x < WW; x += CELL) {
    const v = Math.random() * 9 | 0;
    g.fillStyle = `rgb(${58 + v},${57 + v},${46 + v})`;
    g.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
  }
  for (let i = 0; i < 14; i++) {           // dirt patches
    g.fillStyle = 'rgba(70,52,30,.25)';
    const px = rand(0, WW), py = rand(0, WH);
    for (let k = 0; k < 18; k++) g.fillRect(px + rand(-120, 120), py + rand(-80, 80), CELL, CELL);
  }
  g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 1.5;
  for (let i = 0; i < 160; i++) {
    let x = rand(0, WW), y = rand(0, WH);
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 4; k++) { x += rand(-22, 22); y += rand(-22, 22); g.lineTo(x, y); }
    g.stroke();
  }
  for (const gt of GATES) {
    for (let k = -3; k < 3; k++) {
      g.fillStyle = k % 2 ? '#c9a227' : '#1a1a14';
      if (gt.jx) g.fillRect(gt.x + k * 20, gt.y < 0 ? 0 : WH - 10, 20, 10);
      else g.fillRect(gt.x < 0 ? 0 : WW - 10, gt.y + k * 20, 10, 20);
    }
  }
}
function splat(x, y, size, color) {
  if (mode === 'host' && conn && decalQueue.length < 200) decalQueue.push([0, Math.round(x), Math.round(y), size, color]);
  g.fillStyle = color;
  for (let i = 0; i < 7; i++) {
    const s = rand(size * 0.2, size * 0.6);
    g.fillRect(x + rand(-size, size) - s / 2, y + rand(-size, size) - s / 2, s, s);
  }
}
const MMW = 180, MMH = 120, MMS = MMW / WW;
const mm = document.createElement('canvas'); mm.width = MMW; mm.height = MMH;
(() => {
  const m = mm.getContext('2d');
  m.fillStyle = 'rgba(20,19,14,.85)'; m.fillRect(0, 0, MMW, MMH);
  m.fillStyle = '#77745f';
  for (const o of OBST) m.fillRect(o.x * MMS, o.y * MMS, Math.max(1, o.w * MMS), Math.max(1, o.h * MMS));
})();

/* ---------------- state ---------------- */
let state = 'title', wave = 0, time = 0, shake = 0;
let players = [], zombies = [], bullets = [], eshots = [], barricades = [], puddles = [];
let barrels = [], particles = [], pickups = [], loot = [], texts = [], banners = [], beams = [], bolts = [];
let toSpawn = 0, spawnT = 0, intermission = 0, bossPending = false, bossDelay = 0;
let clearT = 0, activeMods = new Set(), nextMods = [], teamEnergy = 0, strikes = [], meds = [];
let eliteAt = -1, boomDepth = 0;
let camX = WW / 2, camY = WH / 2, zoom = ZMIN;

let best = 0;
try { best = +localStorage.getItem('blockrot-best') || 0; } catch (e) {}

function newPlayer(i) {
  return { i, x: i ? 1280 : 1120, y: 1100, r: 14, hp: 100, dx: 0, dy: -1, speed: 200,
    slots: [], cur: 0, cd: 0, alive: true, build: 2, score: 0, combo: 0, comboT: 0,
    hurt: 0, rev: 0, walk: 0, chain: {}, chainT: {},
    cash: 0, up: { armor:0, speed:0, medic:0, kit:0, fort:0, cool:0, magnet:0 },

  spawnT = 1.2; intermission = 0;

function pushOut(e, rx, ry, rw, rh) {

      bullets.push({ kind: 'flame', x, y, vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp, dmg: st.dmg,

    if (d < rad + z.r) damage(z, dmg * (1 - .5 * Math.min(1, d / rad)), owner, slot, z.x - x, z.y - y, true);

  for (const b of barrels) if (b.alive && Math.hypot(b.x - x, b.y - y) < rad) blowBarrel(b, owner, slot);
}
function blowBarrel(b, owner, slot) {
  if (!b.alive) return;
  b.alive = false;
  explode(b.x, b.y, 120, 150, owner, slot);
}
function bloatBoom(z) {
  shake = Math.max(shake, 8);
  burst(z.x, z.y, '#b6e04a', 26, 240, 7);
  puddles.push({ x: z.x, y: z.y, r: 50, life: 5 });
  for (const p of players) if (p.alive && dist(p, z) < 95) hurt(p, 28);
  for (const o of zombies) if (o !== z && !o.dead && dist(o, z) < 95) damage(o, 60, null, null, o.x - z.x, o.y - z.y, true);
}

function rollRare() {
  const ids = Object.keys(W_DEFS).filter(k => k !== 'pistol');
  return { kind: 'weapon', id: pick(ids), rarity: 'rare' };
}
function rollLegendary() {
  const taken = new Set([...players.flatMap(p => p.slots.filter(s => s.rarity === 'legendary').map(s => s.id)),
                         ...loot.filter(l => l.item.rarity === 'legendary').map(l => l.item.id)]);
  const free = Object.keys(LEGENDARY).filter(k => !taken.has(k));
  return { kind: 'weapon', id: pick(free.length ? free : Object.keys(LEGENDARY)), rarity: 'legendary' };
}
function rollMod() { return { kind: 'mod', id: pick(Object.keys(MODS)) }; }
function bossDeath(z) {
  shake = 20;
  banner(z.name + ' defeated. Grab the loot: whoever touches an item keeps it', '#ff9f1a', true);
  const idx = wave / BOSS_EVERY - 1;
  const items = [rollRare(), Math.random() < .35 + idx * .2 ? rollLegendary() : rollRare()];
  if (idx === 1 && !items.some(i => i.rarity === 'legendary')) items[1] = rollLegendary();
  items.push(rollMod());
  items.forEach((it, k) => {
    const l = { x: z.x + (k - 1) * 60, y: z.y + (k === 2 ? 40 : 0), r: 12, item: it, bob: rand(0, 6) };
    l.x = clamp(l.x, 30, WW - 30); l.y = clamp(l.y, 30, WH - 30);
    solid(l);
    loot.push(l);
  });
}

function gameOver() {
  state = 'over';
  if (wave > best) { best = wave; try { localStorage.setItem('blockrot-best', best); } catch (e) {} }
}

/* ---------------- enemy projectiles ---------------- */
function eShot(x, y, a, speed, kind) {
  const spec = { fire: [6, 14], acid: [7, 10], orb: [8, 16] }[kind];
  eshots.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: spec[0], dmg: spec[1], kind, life: 2.6 });
}

/* ---------------- team abilities ---------------- */
function throwMedkit(p) {
  const mate = players[1 - p.i];
  if (p.medCd > 0) { floatText(p.x, p.y - 34, `Medkit in ${Math.ceil(p.medCd)}s`, '#8f8870'); return; }
  if (mate.alive && mate.hp >= maxHp(mate)) { floatText(p.x, p.y - 34, 'Partner is at full health', '#8f8870'); return; }
  p.medCd = MEDKIT_CD * (1 - .15 * p.up.cool);
  meds.push({ from: p, to: mate, x: p.x, y: p.y, sx: p.x, sy: p.y, t: 0, dur: .55 });
}
function tryStrike(p) {
  const mate = players[1 - p.i];
  p.strikeT = time;
  if (teamEnergy < ENERGY_MAX) { floatText(p.x, p.y - 34, `Airstrike ${Math.floor(teamEnergy / ENERGY_MAX * 100)}% charged`, '#8f8870'); return; }
  if (!mate.alive) { floatText(p.x, p.y - 34, 'Needs both players standing', '#e2735f'); return; }
  if (time - mate.strikeT > STRIKE_WINDOW) { floatText(p.x, p.y - 34, 'Waiting for partner...', '#f2d27a'); return; }
  teamEnergy = 0; p.strikeT = mate.strikeT = -9;
  banner('Airstrike inbound', '#ff9a3c', true);
  const vw = W / zoom / 2, vh = (H - AY) / zoom / 2;
  const inView = zombies.filter(z => Math.abs(z.x - camX) < vw && Math.abs(z.y - camY) < vh);
  inView.sort((a, b) => b.max - a.max);
  for (let k = 0; k < 16; k++) {
    const tg = inView.length ? inView[k % inView.length] : null;
    const x = tg ? tg.x + rand(-40, 40) : camX + rand(-vw, vw) * .8;
    const y = tg ? tg.y + rand(-40, 40) : camY + rand(-vh, vh) * .8;
    strikes.push({ x, y, t: .6 + k * .1, max: .6 + k * .1, owner: players[k % 2] });
  }
}

/* ---------------- shop ---------------- */
function openShop() {
  state = 'shop';
  const upcoming = wave + 1, pool = Object.keys(MODIFIERS);
  nextMods = [];
  if (upcoming % BOSS_EVERY !== 0 && upcoming >= MODIFIERS_FROM) {
    const n = upcoming >= TWO_MODIFIERS_FROM ? 2 : 1;
    while (nextMods.length < n) { const m = pick(pool); if (!nextMods.includes(m)) nextMods.push(m); }
  }
  for (const p of players) {
    p.ready = false; p.msg = ''; p.sel = 0;
    if (!p.alive) { p.alive = true; p.hp = Math.round(maxHp(p) / 2); p.hurt = 1; }
  }
  eshots = []; puddles = [];
}
function buy(p, item) {
  if (item.id === 'ready') { p.ready = true; return; }
  const lv = p.up[item.id] || 0;
  const say = m => { p.msg = m; p.msgT = 2; };
  if (!item.repeat && lv >= item.max) return say('Already maxed');
  if (item.id === 'heal' && p.hp >= maxHp(p)) return say('Already at full health');
  const cost = item.cost(lv);
  if (p.cash < cost) return say(`Need $${cost - p.cash} more`);
  p.cash -= cost;
  if (item.id === 'heal') p.hp = maxHp(p);
  else if (item.id === 'ammo') for (const sl of p.slots) sl.ammo = sl.max;
  else {
    p.up[item.id]++;
    if (item.id === 'armor') p.hp += 20;
    if (item.id === 'kit') p.build = Math.min(buildCap(p), p.build + 2);
  }
  say('Bought ' + item.name);
}
function shopInput(dt) {
  for (const p of players) {
    if (p.msgT > 0) p.msgT -= dt;
    if (p.ready) { if (inTap(p.i, 'build') || inTap(p.i, 'fire')) p.ready = false; continue; }
    if (inTap(p.i, 'up')) p.sel = (p.sel + SHOP.length - 1) % SHOP.length;
    if (inTap(p.i, 'down')) p.sel = (p.sel + 1) % SHOP.length;
    if (inTap(p.i, 'fire')) buy(p, SHOP[p.sel]);
    else if (inTap(p.i, 'build')) p.ready = true;
  }
  if (players.every(p => p.ready)) {
    state = 'play'; intermission = 3;
    banner('Get ready', '#e6dfc8');
  }
}

/* ---------------- camera ---------------- */
function updateCam(dt, snap) {
  const [a, b] = players;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const need = Math.max(Math.abs(a.x - b.x) / (W - 240), Math.abs(a.y - b.y) / (H - AY - 200), 1e-6);
  const tz = clamp(1 / need, ZMIN, 1);
  zoom = snap ? tz : zoom + (tz - zoom) * Math.min(1, dt * 4);
  const vw = W / zoom, vh = (H - AY) / zoom;
  const tx = clamp(mx, vw / 2, WW - vw / 2), ty = clamp(my, vh / 2, WH - vh / 2);
  camX = snap ? tx : camX + (tx - camX) * Math.min(1, dt * 8);
  camY = snap ? ty : camY + (ty - camY) * Math.min(1, dt * 8);
}
const MAXDX = W / ZMIN - 220, MAXDY = (H - AY) / ZMIN - 180;

/* ---------------- update ---------------- */
function update(dt) {
  time += dt;
  newZ = [];

  fieldT -= dt;
  if (fieldT <= 0) { computeField(); fieldT = .25; }

  for (const p of players) for (const id in p.chainT) {
    if (p.chainT[id] > 0) { p.chainT[id] -= dt; if (p.chainT[id] <= 0) p.chain[id] = 0; }
  }

  // players
  for (const p of players) {
    if (!p.alive) {
      const mate = players[1 - p.i];
      if (mate.alive && dist(p, mate) < 50) {
        p.rev += dt;
        if (p.rev >= 3 - .6 * mate.up.medic) { p.alive = true; p.hp = 40; p.rev = 0; p.hurt = 1; banner(p.name + ' is back up', '#8fd67a'); }
      } else p.rev = Math.max(0, p.rev - dt);
      continue;
    }
    let mx = (inHeld(p.i, 'right') ? 1 : 0) - (inHeld(p.i, 'left') ? 1 : 0);
    let my = (inHeld(p.i, 'down') ? 1 : 0) - (inHeld(p.i, 'up') ? 1 : 0);
    if (mx || my) {
      const l = Math.hypot(mx, my); mx /= l; my /= l;
      p.dx = mx; p.dy = my; p.walk += dt * 12;
    }
    const spd = p.speed * (1 + .08 * p.up.speed);
    p.x += mx * spd * dt; p.y += my * spd * dt;
    const mate = players[1 - p.i];
    p.x = clamp(p.x, mate.x - MAXDX, mate.x + MAXDX);
    p.y = clamp(p.y, mate.y - MAXDY, mate.y + MAXDY);
    solid(p);
    if (inTap(p.i, 'swap')) switchNext(p);
    p.cd -= dt;
    if (inHeld(p.i, 'fire') && p.cd <= 0) fire(p);
    if (inTap(p.i, 'build')) build(p);
    if (p.medCd > 0) p.medCd -= dt;
    if (inTap(p.i, 'med')) throwMedkit(p);
    if (inTap(p.i, 'strike')) tryStrike(p);
    if (p.comboT > 0) { p.comboT -= dt; if (p.comboT <= 0) p.combo = 0; }
    if (p.hurt > 0) p.hurt -= dt;

    for (const k of pickups) {
      if (k.life > 0 && dist(p, k) < 26 + 40 * p.up.magnet) {
        k.life = 0;
        if (k.type === 'ammo') {
          for (const s of p.slots) if (s.ammo !== Infinity) s.ammo = Math.min(s.max, s.ammo + Math.ceil(s.max / 2));
          p.build = Math.min(buildCap(p), p.build + 1);
          floatText(p.x, p.y - 34, 'Ammo + barricade', '#f2d27a');
        } else {
          p.hp = Math.min(maxHp(p), p.hp + 30);
          floatText(p.x, p.y - 34, '+30 health', '#8fd67a');
        }
      }
    }
    for (const l of loot) {
      if (l.taken || dist(p, l) > 28) continue;
      l.taken = true;
      if (l.item.kind === 'mod') {
        const sl = p.slots[p.cur], M = MODS[l.item.id];
        const old = sl.mod ? ` (replaced ${MODS[sl.mod].name})` : '';
        sl.mod = l.item.id;
        banner(`${p.name} fitted ${M.name} to ${sl.name}${old}`, M.color);
        burst(l.x, l.y, M.color, 24, 200, 5);
        continue;
      }
      const same = p.slots.find(s => s.id === l.item.id && s.rarity === l.item.rarity);
      if (same) { same.ammo = same.max; floatText(p.x, p.y - 34, same.name + ' refilled', RARITY_COLOR[same.rarity]); }
      else {
        const s = makeSlot(l.item.id, l.item.rarity);
        p.slots.push(s); p.cur = p.slots.length - 1;
        banner(`${p.name} claimed ${s.name}`, RARITY_COLOR[s.rarity]);
      }
      burst(l.x, l.y, RARITY_COLOR[l.item.rarity], 24, 200, 5);
    }
    for (const q of puddles) if (dist(p, q) < q.r) hurtDot(p, 14 * dt);
  }
  loot = loot.filter(l => !l.taken);

  // zombies
  for (const z of zombies) {
    z.flash -= dt;
    if (z.burn > 0) {
      z.burn -= dt;
      z.hp -= z.burnDps * dt;
      if (Math.random() < .3) particles.push({ x: z.x + rand(-z.r, z.r), y: z.y - z.r, vx: 0, vy: -40, life: .35, max: .35, size: 5, color: '#ff8a2a' });
      if (z.hp <= 0) kill(z, z.burnOwner, z.burnSlot);
    }
    if (z.dead) continue;

    let t = null, bd = 1e9;
    for (const p of players) if (p.alive) { const d = dist(z, p); if (d < bd) { bd = d; t = p; } }
    if (!t) continue;
    const tdx = (t.x - z.x) / (bd || 1), tdy = (t.y - z.y) / (bd || 1);
    let [fx, fy] = flowDir(z, t);
    let sp = z.speed;
    if (z.slow > 0) { z.slow -= dt; sp *= z.boss ? .75 : .5; }

    if (z.ranged && bd < 340) sp *= .35;
    if (z.necro && z.inside && bd < 320) { fx = -tdx; fy = -tdy; sp *= .6; }
    if (!z.inside) {
      z.outT = (z.outT || 0) + dt;
      if (z.outT > 10) { z.x = clamp(z.x, z.r + 40, WW - z.r - 40); z.y = clamp(z.y, z.r + 40, WH - z.r - 40); z.inside = true; }
    }
    if (z.dash) {
      z.dcd -= dt;
      if (z.dashT > 0) { z.dashT -= dt; fx = z.ddx; fy = z.ddy; sp = 430; }
      else if (z.dcd <= 0 && bd < 280) { z.dashT = .4; z.dcd = rand(3, 4.5); z.ddx = tdx; z.ddy = tdy; burst(z.x, z.y, '#9fb3c2', 6, 100); }
    }

    if (z.boss) {
      const rage = z.hp < z.max * .4 ? .65 : 1;
      z.t1 -= dt; z.t2 -= dt;
      if (z.key === 'brood') {
        if (z.t1 <= 0) {
          z.t1 = 4.5 * rage;
          if (zombies.length + newZ.length < 50)
            for (let k = 0; k < 3; k++) newZ.push(makeZombie('crawler', z.x + rand(-50, 50), z.y + rand(-50, 50), true));
          burst(z.x, z.y, '#a08660', 16, 160, 6);
        }
        if (z.t2 <= 0) {
          z.t2 = 2.2 * rage;
          const a = Math.atan2(tdy, tdx);
          for (let k = -1; k <= 1; k++) eShot(z.x, z.y, a + k * .25, 230, 'acid');
        }
      } else if (z.key === 'pyre') {
        if (z.t1 <= 0) { z.t1 = 3.4 * rage; for (let k = 0; k < 14; k++) eShot(z.x, z.y, k / 14 * 6.283 + time, 200, 'fire'); }
        if (z.t2 <= 0) {
          z.t2 = 1.2 * rage;
          const a = Math.atan2(tdy, tdx);
          for (let k = -1; k <= 1; k++) eShot(z.x, z.y, a + k * .18, 280, 'fire');
        }
        if (Math.random() < .5) particles.push({ x: z.x + rand(-z.r, z.r), y: z.y - z.r * 1.4, vx: 0, vy: -60, life: .4, max: .4, size: 7, color: '#ff7a2f' });
      } else if (z.key === 'wraith') {
        if (z.blinkT > 0) {
          z.blinkT -= dt; sp = 0;
          if (z.blinkT <= 0) {
            burst(z.x, z.y, '#9ad7ff', 20, 200, 6);
            z.x = z.bx; z.y = z.by;
            for (let k = 0; k < 10; k++) eShot(z.x, z.y, k / 10 * 6.283, 210, 'orb');
            burst(z.x, z.y, '#9ad7ff', 20, 200, 6);
            shake = Math.max(shake, 8);
          }
        } else if (z.t1 <= 0) {
          z.t1 = 5.5 * rage;
          const a = rand(0, 6.283), bx = t.x + Math.cos(a) * 170, by = t.y + Math.sin(a) * 170;
          if (bx > 50 && by > 50 && bx < WW - 50 && by < WH - 50 && !isBlockedAt(bx, by)) { z.bx = bx; z.by = by; z.blinkT = .9; }
        }
        if (z.t2 <= 0) {
          z.t2 = 8 * rage;
          if (zombies.length + newZ.length < 50)
            for (let k = 0; k < 2; k++) newZ.push(makeZombie('ghoul', z.x + rand(-40, 40), z.y + rand(-40, 40), true));
        }
      }
    }

    const wob = z.boss || z.dashT > 0 ? 0 : Math.sin(time * 2 + z.wob) * .3;
    z.x += (fx - fy * wob) * sp * dt; z.y += (fy + fx * wob) * sp * dt;
    z.dx = tdx; z.dy = tdy; z.walk += dt * Math.abs(sp) * .12;
    if (!z.inside && z.x > z.r && z.x < WW - z.r && z.y > z.r && z.y < WH - z.r) z.inside = true;
    const bar = solid(z);
    // unstick: if a zombie barely moved for 3 seconds, shove it sideways
    z.stuckT = (z.stuckT || 0) + dt;
    if (z.stuckT > 3) {
      if (z.inside && !z.boss && Math.hypot(z.x - (z.lx ?? z.x + 99), z.y - (z.ly ?? 0)) < 25 && bd > 60 && !bar) {
        const a = rand(0, 6.283); z.x += Math.cos(a) * 30; z.y += Math.sin(a) * 30; solid(z);
      }
      z.stuckT = 0; z.lx = z.x; z.ly = z.y;
    }
    if (bar) { bar.hp -= (z.dmg || 10) * 2.5 * dt; if (Math.random() < .1) burst(bar.x + 20, bar.y + 20, '#a07a45', 1, 60); }

    z.atk -= dt;
    if (bd < z.r + t.r + 5) {
      if (z.bloat) { z.hp = 0; kill(z, null, null); continue; }
      if (z.atk <= 0) { hurt(t, z.dmg); z.atk = .7; }
    }
    if (z.ranged && z.inside) {
      z.shoot -= dt;
      if (z.shoot <= 0 && bd < 450) {
        z.shoot = rand(2, 3.2) * (activeMods.has('bloodmoon') ? .6 : 1);
        eShot(z.x, z.y - 6, Math.atan2(tdy, tdx), z.ranged === 'acid' ? 230 : 260, z.ranged);
      }
    }
    if (z.necro) {
      z.heal -= dt;
      if (z.heal <= 0) {
        z.heal = 3;
        let any = false;
        for (const o of zombies) if (o !== z && !o.dead && !o.boss && dist(o, z) < 200 && o.hp < o.max) {
          o.hp = Math.min(o.max, o.hp + o.max * .25); any = true;
          burst(o.x, o.y, '#a9f0c8', 4, 60, 4);
        }
        if (any) beams.push({ ring: true, x1: z.x, y1: z.y, r: 200, color: '#a9f0c8', life: .4, max: .4 });
      }
    }
  }
  zombies = zombies.filter(z => !z.dead);
  for (let i = 0; i < zombies.length; i++) for (let j = i + 1; j < zombies.length; j++) {
    const a = zombies[i], b = zombies[j];
    const dx = b.x - a.x, dy = b.y - a.y, m = a.r + b.r;
    if (Math.abs(dx) > m || Math.abs(dy) > m) continue;
    const d = Math.hypot(dx, dy);
    if (d < m && d > 0) {
      const wa = a.boss ? .1 : b.boss ? .9 : .5, o = m - d;
      a.x -= dx / d * o * wa; a.y -= dy / d * o * wa;
      b.x += dx / d * o * (1 - wa); b.y += dy / d * o * (1 - wa);
    }
  }
  for (const p of players) {
    if (!p.alive) continue;
    for (const z of zombies) {
      const dx = p.x - z.x, dy = p.y - z.y, d = Math.hypot(dx, dy), m = p.r + z.r;
      if (d < m && d > 0) { p.x = z.x + dx / d * m; p.y = z.y + dy / d * m; }
    }
    solid(p);
  }

  // player projectiles
  for (const b of bullets) {
    if (b.kind === 'homing') {
      let tg = null, td = 450;
      for (const z of zombies) { const d = dist(z, b); if (!z.dead && d < td) { td = d; tg = z; } }
      if (tg) {
        const cur = Math.atan2(b.vy, b.vx), want = Math.atan2(tg.y - b.y, tg.x - b.x);
        let diff = want - cur; while (diff > Math.PI) diff -= 6.283; while (diff < -Math.PI) diff += 6.283;
        const na = cur + clamp(diff, -6 * dt, 6 * dt), sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.kind === 'flame') { b.size += dt * 34; b.vx *= .97; b.vy *= .97; }
    if ((b.kind === 'rocket' || b.kind === 'homing') && Math.random() < .7)
      particles.push({ x: b.x, y: b.y, vx: rand(-20, 20), vy: rand(-20, 20), life: .35, max: .35, size: 5, color: '#8a8478' });
    if (b.kind === 'plasma' && Math.random() < .8)
      particles.push({ x: b.x, y: b.y, vx: rand(-30, 30), vy: rand(-30, 30), life: .3, max: .3, size: 4, color: b.color });

    const end = () => { b.dead = true; if (b.blast) explode(b.x, b.y, b.blast, b.blastDmg, b.owner, b.slot); };
    if (isBlockedAt(b.x, b.y)) {
      if (b.mod === 'ricochet' && b.bounces < 2) {
        const px = b.x - b.vx * dt, py = b.y - b.vy * dt;
        const hx = isBlockedAt(b.x, py), hy = isBlockedAt(px, b.y);
        if (hx) b.vx = -b.vx;
        if (hy) b.vy = -b.vy;
        if (!hx && !hy) { b.vx = -b.vx; b.vy = -b.vy; }
        b.x = px; b.y = py; b.bounces++; b.life += .25; b.hit.clear();
        burst(b.x, b.y, '#e6dfc8', 2, 80, 2);
        continue;
      }
      if (b.kind === 'bullet') burst(b.x, b.y, '#d8d0b0', 3, 90, 2);
      end(); continue;
    }
    for (const br of barrels) if (br.alive && dist(b, br) < br.r + b.size) { blowBarrel(br, b.owner, b.slot); if (b.kind !== 'plasma') b.dead = true; break; }
    if (b.dead) continue;
    for (const z of zombies) {
      if (z.dead || b.hit.has(z) || dist(b, z) > z.r + b.size) continue;
      b.hit.add(z);
      if (b.kind === 'rocket' || b.kind === 'homing') { damage(z, b.dmg, b.owner, b.slot, b.vx, b.vy); end(); break; }
      damage(z, b.dmg, b.owner, b.slot, b.vx, b.vy, b.kind !== 'bullet');
      if (b.burn) { z.burn = 1.6; z.burnDps = Math.max(z.burnDps, b.burn); z.burnOwner = b.owner; z.burnSlot = b.slot; }
      if (b.hit.size > b.pierce) { b.dead = true; break; }
    }
    if (!b.dead && b.life <= 0) { if (b.kind === 'flame') b.dead = true; else end(); }
  }
  bullets = bullets.filter(b => !b.dead);

  // enemy projectiles
  for (const f of eshots) {
    f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt;
    const col = f.kind === 'acid' ? '#b6e04a' : f.kind === 'orb' ? '#9ad7ff' : '#ff7a2f';
    if (Math.random() < .6) particles.push({ x: f.x, y: f.y, vx: rand(-15, 15), vy: rand(-15, 15), life: .3, max: .3, size: 5, color: col });
    const stop = () => { f.dead = true; if (f.kind === 'acid') puddles.push({ x: f.x, y: f.y, r: 32, life: 4 }); };
    if (f.life <= 0 || f.x < 0 || f.x > WW || f.y < 0 || f.y > WH || isBlockedAt(f.x, f.y)) { stop(); continue; }
    for (const b of barricades) if (inRect(f, { x: b.x, y: b.y, w: CELL, h: CELL })) { b.hp -= 20; stop(); break; }
    if (f.dead) continue;
    for (const p of players) if (p.alive && dist(f, p) < p.r + f.r) { hurt(p, f.dmg); burst(f.x, f.y, col, 8); stop(); break; }
  }
  eshots = eshots.filter(f => !f.dead);

  zombies = zombies.filter(z => !z.dead).concat(newZ);
  barricades = barricades.filter(b => {
    if (b.hp > 0) return true;
    burst(b.x + 20, b.y + 20, '#8a6a3a', 14, 150, 5);
    return false;
  });
  pickups = pickups.filter(k => (k.life -= dt) > 0);
  puddles = puddles.filter(q => (q.life -= dt) > 0);

  // airstrike + medkits
  for (const st of strikes) {
    st.t -= dt;
    if (st.t <= 0) { explode(st.x, st.y, 110, 170, st.owner, null); st.done = true; }
  }
  strikes = strikes.filter(st => !st.done);
  for (const m of meds) {
    m.t += dt;
    const k = Math.min(1, m.t / m.dur);
    m.x = m.sx + (m.to.x - m.sx) * k; m.y = m.sy + (m.to.y - m.sy) * k - Math.sin(k * Math.PI) * 60;
    if (k >= 1) {
      m.done = true;
      const heal = 35 + 10 * m.from.up.medic;
      if (!m.to.alive) {
        m.to.alive = true; m.to.hp = heal; m.to.rev = 0; m.to.hurt = 1;
        banner(`${m.from.name} revived ${m.to.name} with a medkit`, '#8fd67a');
      } else {
        m.to.hp = Math.min(maxHp(m.to), m.to.hp + heal);
        floatText(m.to.x, m.to.y - 34, '+' + heal + ' health', '#8fd67a');
      }
      burst(m.to.x, m.to.y, '#8fd67a', 14, 140, 5);
    }
  }
  meds = meds.filter(m => !m.done);

  // waves
  if (state === 'play') {
    if (clearT > 0) {
      clearT -= dt;
      if (clearT <= 0) openShop();
    } else if (intermission > 0) {
      intermission -= dt;
      if (intermission <= 0) nextWave();
    } else {
      if (bossPending) { bossDelay -= dt; if (bossDelay <= 0) { bossPending = false; spawnBoss(); } }
      if (toSpawn > 0) {
        spawnT -= dt;
        if (spawnT <= 0 && zombies.length < 40) {
          spawnZombie(); toSpawn--;
          spawnT = Math.max(.2, 1 - wave * .05) * rand(.5, 1.3);
        }
      } else if (!bossPending && zombies.length === 0) {
        clearT = wave % BOSS_EVERY === 0 ? 6 : 2.5;
        activeMods.clear();
        banner('Wave ' + wave + ' cleared. Shop opens shortly', '#8fd67a');
      }
    }
  }

  updateCam(dt, false);
  updateFx(dt);
}

function updateFx(dt) {
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .9; q.vy *= .9; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  if (particles.length > 1500) particles.splice(0, particles.length - 1500);
  for (const t of texts) { t.y -= 30 * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  for (const b of beams) b.life -= dt;
  beams = beams.filter(b => b.life > 0);
  for (const b of bolts) b.life -= dt;
  bolts = bolts.filter(b => b.life > 0);
  if (banners.length) { banners[0].life -= dt * (banners.length > 2 ? 2 : 1); if (banners[0].life <= 0) banners.shift(); }
  shake = Math.max(0, shake - dt * 30);
}

/* ---------------- drawing ---------------- */
const FONT = '"Trebuchet MS", sans-serif';
const DISPLAY = 'Impact, "Arial Black", sans-serif';

function drawBlock(x, y, s, body, head, dx, dy, walk, flash, arms, eye) {
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(x - s * .9, y + s * .65, s * 1.8, s * .45);
  const bob = Math.sin(walk) * s * .18;
  ctx.fillStyle = '#1d1c16';
  ctx.fillRect(x - s * .6, y + s * .25 + Math.max(0, bob), s * .5, s * .55);
  ctx.fillRect(x + s * .1, y + s * .25 + Math.max(0, -bob), s * .5, s * .55);
  if (arms) {
    ctx.fillStyle = flash ? '#fff' : head;
    const ax = dx * s * .9, ay = dy * s * .9;
    ctx.fillRect(x - s * .8 + ax, y - s * .4 + ay, s * .35, s * .35);
    ctx.fillRect(x + s * .45 + ax, y - s * .4 + ay, s * .35, s * .35);
  }
  ctx.lineWidth = 2; ctx.strokeStyle = '#000';
  ctx.fillStyle = flash ? '#fff' : body;
  ctx.fillRect(x - s * .75, y - s * .7, s * 1.5, s * 1.05);
  ctx.strokeRect(x - s * .75, y - s * .7, s * 1.5, s * 1.05);
  ctx.fillStyle = flash ? '#fff' : head;
  ctx.fillRect(x - s * .62, y - s * 1.65, s * 1.24, s * 1.0);
  ctx.strokeRect(x - s * .62, y - s * 1.65, s * 1.24, s * 1.0);
  if (dy > -.6) {
    ctx.fillStyle = eye;
    const ex = x + dx * s * .28, ey = y - s * 1.3 + Math.max(0, dy) * s * .12;
    ctx.fillRect(ex - s * .38, ey, s * .22, s * .22);
    ctx.fillRect(ex + s * .16, ey, s * .22, s * .22);
  }
}

function drawPlayer(p) {
  if (!p.alive) {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(p.x - 17, p.y - 2, 34, 12);
    ctx.fillStyle = '#6b665a'; ctx.fillRect(p.x - 16, p.y - 8, 32, 14);
    ctx.fillStyle = p.head; ctx.fillRect(p.x + 6, p.y - 10, 13, 13);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(p.x - 16, p.y - 8, 32, 14);
    ctx.strokeStyle = 'rgba(143,214,122,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y - 2, 50, 0, 6.283); ctx.stroke();
    if (p.rev > 0) {
      ctx.strokeStyle = '#8fd67a'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(p.x, p.y - 2, 28, -1.571, -1.571 + 6.283 * p.rev / 3); ctx.stroke();
    }
    ctx.fillStyle = p.head; ctx.font = `bold 13px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText(p.name, p.x, p.y - 24);
    return;
  }
  const s = p.slots[p.cur], st = stats(s);
  const blink = p.hurt > 0 && Math.floor(time * 20) % 2 === 0;
  const thick = { rocket: 7, plasma: 8, homing: 7, laser: 4, tesla: 6, flame: 6 }[s.def.kind] || (s.id === 'shotgun' ? 5 : 4);
  const gun = () => {
    for (const off of st.dual ? [-9, 9] : [0]) {
      const ox = -p.dy * off, oy = p.dx * off;
      ctx.strokeStyle = '#111'; ctx.lineWidth = thick;
      ctx.beginPath(); ctx.moveTo(p.x + ox, p.y - 4 + oy); ctx.lineTo(p.x + ox + p.dx * 24, p.y - 4 + oy + p.dy * 24); ctx.stroke();
      if (s.rarity !== 'base' || s.def.kind !== 'bullet') {
        ctx.strokeStyle = s.rarity === 'base' ? s.def.color : RARITY_COLOR[s.rarity]; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x + ox + p.dx * 10, p.y - 4 + oy + p.dy * 10); ctx.lineTo(p.x + ox + p.dx * 22, p.y - 4 + oy + p.dy * 22); ctx.stroke();
      }
    }
  };
  if (p.dy < 0) gun();
  drawBlock(p.x, p.y, p.r, p.body, p.head, p.dx, p.dy, p.walk, blink, false, '#000');
  if (p.dy >= 0) gun();
  ctx.fillStyle = p.head; ctx.font = `bold 13px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillText(p.name + (mode !== 'local' && p.i === myIndex ? ' (you)' : ''), p.x, p.y - p.r * 1.95);
}

function drawZombie(z) {
  if (z.elite) {
    ctx.fillStyle = `rgba(242,210,122,${.18 + .1 * Math.sin(time * 6)})`;
    ctx.beginPath(); ctx.arc(z.x, z.y - z.r * .4, z.r * 2.1, 0, 6.283); ctx.fill();
  }
  if (z.blinkT > 0) {
    ctx.strokeStyle = `rgba(154,215,255,${.4 + .4 * Math.sin(time * 30)})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(z.bx, z.by, z.r + 10, 0, 6.283); ctx.stroke();
    ctx.globalAlpha = .5;
  }
  if (z.boss) {
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(z.x, z.y + z.r * .8, z.r * 1.3, z.r * .5, 0, 0, 6.283); ctx.fill();
  }
  drawBlock(z.x, z.y, z.r, z.body, z.head, z.dx, z.dy, z.walk, z.flash > 0, true,
            z.necro ? '#e8fff2' : z.boss ? '#fff26b' : '#ff3b2a');
  ctx.globalAlpha = 1;
  if (z.shield) {
    const a = Math.atan2(z.dy, z.dx);
    ctx.strokeStyle = '#c9ccd2'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(z.x, z.y - z.r * .3, z.r + 6, a - .9, a + .9); ctx.stroke();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(z.x, z.y - z.r * .3, z.r + 9, a - .9, a + .9); ctx.stroke();
  }
  if (z.bloat) {
    ctx.fillStyle = 'rgba(182,224,74,.5)';
    ctx.beginPath(); ctx.arc(z.x, z.y - z.r * .2, z.r * .55 + Math.sin(time * 6 + z.wob) * 2, 0, 6.283); ctx.fill();
  }
  if (z.slow > 0) { ctx.fillStyle = 'rgba(143,216,255,.3)'; ctx.fillRect(z.x - z.r, z.y - z.r * 1.7, z.r * 2, z.r * 2.5); }
  if (z.burn > 0) { ctx.fillStyle = 'rgba(255,120,40,.25)'; ctx.fillRect(z.x - z.r, z.y - z.r * 1.7, z.r * 2, z.r * 2.5); }
  if (!z.boss && z.hp < z.max) {
    ctx.fillStyle = '#000'; ctx.fillRect(z.x - z.r, z.y - z.r * 2.1, z.r * 2, 4);
    ctx.fillStyle = '#d0402f'; ctx.fillRect(z.x - z.r, z.y - z.r * 2.1, z.r * 2 * Math.max(0, z.hp / z.max), 4);
  }
}

function drawLoot(l) {
  const isMod = l.item.kind === 'mod';
  const col = isMod ? MODS[l.item.id].color : RARITY_COLOR[l.item.rarity];
  const bob = Math.sin(time * 3 + l.bob) * 3;
  const grad = ctx.createLinearGradient(0, l.y - 160, 0, l.y);
  grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, col + '88');
  ctx.fillStyle = grad; ctx.fillRect(l.x - 10, l.y - 160, 20, 160);
  ctx.save(); ctx.translate(l.x, l.y - 6 + bob); ctx.rotate(time * 1.5);
  ctx.fillStyle = col; ctx.fillRect(-10, -10, 20, 20);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(-10, -10, 20, 20);
  ctx.restore();
  let name, tag;
  if (isMod) { name = MODS[l.item.id].name + ' mod'; tag = MODS[l.item.id].desc; }
  else {
    const def = l.item.rarity === 'legendary' ? LEGENDARY[l.item.id] : W_DEFS[l.item.id];
    name = (l.item.rarity === 'rare' ? 'Prime ' : '') + def.name;
    tag = l.item.rarity === 'legendary' ? 'Legendary' : 'Rare';
  }
  ctx.font = `bold 14px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillStyle = '#000'; ctx.fillText(name, l.x + 1, l.y - 29);
  ctx.fillStyle = col; ctx.fillText(name, l.x, l.y - 30);
  ctx.font = `11px ${FONT}`; ctx.fillStyle = '#e6dfc8';
  ctx.fillText(tag, l.x, l.y - 44);
  if (isMod) ctx.fillText('Attaches to the weapon you are holding', l.x, l.y - 58);
}

function drawWorld() {
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
  ctx.setTransform(zoom, 0, 0, zoom, W / 2 - camX * zoom + sx, AY + (H - AY) / 2 - camY * zoom + sy);
  const vx0 = camX - W / 2 / zoom - 60, vx1 = camX + W / 2 / zoom + 60;
  const vy0 = camY - (H - AY) / 2 / zoom - 60, vy1 = camY + (H - AY) / 2 / zoom + 60;
  const vis = e => e.x > vx0 && e.x < vx1 && e.y > vy0 && e.y < vy1;

  ctx.drawImage(gnd, 0, 0);
  for (const q of puddles) {
    ctx.globalAlpha = Math.min(1, q.life) * .55;
    ctx.fillStyle = '#8fc43a';
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const o of OBST) {
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(o.x + 6, o.y + 8, o.w, o.h);
    ctx.fillStyle = '#6e6c5c'; ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = '#8d8a76'; ctx.fillRect(o.x, o.y, o.w, 8);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(o.x, o.y, o.w, o.h);
  }
  for (const b of barricades) {
    const k = b.hp / b.max;
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(b.x + 5, b.y + 6, CELL, CELL);
    ctx.fillStyle = k > .5 ? '#8a6636' : k > .25 ? '#6e4f2a' : '#523a20';
    ctx.fillRect(b.x, b.y, CELL, CELL);
    ctx.strokeStyle = '#3a2812'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(b.x + 4, b.y + 4); ctx.lineTo(b.x + CELL - 4, b.y + CELL - 4);
    ctx.moveTo(b.x + CELL - 4, b.y + 4); ctx.lineTo(b.x + 4, b.y + CELL - 4); ctx.stroke();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, CELL, CELL);
  }
  for (const b of barrels) {
    if (!b.alive) continue;
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(b.x - 10, b.y + 6, 26, 8);
    ctx.fillStyle = '#a3291f'; ctx.fillRect(b.x - 12, b.y - 14, 24, 24);
    ctx.fillStyle = '#c9a227'; ctx.fillRect(b.x - 12, b.y - 4, 24, 5);
    ctx.fillStyle = '#c8473a'; ctx.fillRect(b.x - 12, b.y - 14, 24, 5);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(b.x - 12, b.y - 14, 24, 24);
  }
  for (const k of pickups) {
    if (k.life < 3 && Math.floor(time * 8) % 2) continue;
    const bobY = Math.sin(time * 4 + k.x) * 2;
    ctx.fillStyle = k.type === 'ammo' ? '#c9a227' : '#e6dfc8';
    ctx.fillRect(k.x - 10, k.y - 10 + bobY, 20, 20);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(k.x - 10, k.y - 10 + bobY, 20, 20);
    ctx.fillStyle = k.type === 'ammo' ? '#1d1c16' : '#c8322a';
    if (k.type === 'ammo') for (const ox of [-6, -1, 4]) ctx.fillRect(k.x + ox, k.y - 6 + bobY, 3, 12);
    else { ctx.fillRect(k.x - 7, k.y - 2 + bobY, 14, 4); ctx.fillRect(k.x - 2, k.y - 7 + bobY, 4, 14); }
  }
  for (const l of loot) drawLoot(l);
  for (const st of strikes) {
    const k = 1 - st.t / st.max;
    ctx.strokeStyle = `rgba(255,80,50,${.4 + .5 * k})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(st.x, st.y, 110 * (1 - k * .6), 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(st.x - 12, st.y); ctx.lineTo(st.x + 12, st.y);
    ctx.moveTo(st.x, st.y - 12); ctx.lineTo(st.x, st.y + 12); ctx.stroke();
  }

  const actors = [];
  for (const p of players) actors.push({ y: p.alive ? p.y : p.y - 100, d: () => drawPlayer(p) });
  for (const z of zombies) if (vis(z) || z.boss) actors.push({ y: z.y, d: () => drawZombie(z) });
  actors.sort((a, b) => a.y - b.y).forEach(a => a.d());

  ctx.lineCap = 'round';
  for (const b of bullets) {
    if (!vis(b)) continue;
    if (b.kind === 'flame') {
      ctx.globalAlpha = Math.max(0, b.life / .42) * .8;
      ctx.fillStyle = b.life > .25 ? '#ffe28a' : b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (b.kind === 'plasma') {
      ctx.fillStyle = b.color + '55'; ctx.beginPath(); ctx.arc(b.x, b.y, b.size * 1.8, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.size * .7, 0, 6.283); ctx.fill();
    } else if (b.kind === 'rocket' || b.kind === 'homing') {
      ctx.fillStyle = b.color; ctx.fillRect(b.x - 4, b.y - 4, 8, 8);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(b.x - 4, b.y - 4, 8, 8);
    } else {
      ctx.strokeStyle = b.slot.rarity === 'rare' ? '#9fcbff' : b.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .015, b.y - b.vy * .015); ctx.stroke();
    }
  }
  for (const b of beams) {
    ctx.globalAlpha = b.life / b.max;
    if (b.ring) {
      ctx.strokeStyle = b.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x1, b.y1, b.r * (1 - b.life / b.max * .5), 0, 6.283); ctx.stroke();
    } else {
      ctx.strokeStyle = b.color; ctx.lineWidth = b.w * 2.2;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1, b.w * .6);
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    }
  }
  for (const b of bolts) {
    ctx.globalAlpha = b.life / b.max;
    for (const [col, w] of [[b.color, 5], ['#fff', 1.5]]) {
      ctx.strokeStyle = col; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(...b.pts[0]);
      for (const pt of b.pts) ctx.lineTo(...pt);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1; ctx.lineCap = 'butt';
  for (const f of eshots) {
    const col = f.kind === 'acid' ? '#b6e04a' : f.kind === 'orb' ? '#9ad7ff' : '#ff7a2f';
    ctx.fillStyle = col + '55'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 2, 0, 6.283); ctx.fill();
    ctx.fillStyle = f.kind === 'orb' ? '#e8f6ff' : f.kind === 'acid' ? '#dff58a' : '#ffd36a';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
  }
  for (const q of particles) {
    if (!vis(q)) continue;
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = `bold 15px ${FONT}`;
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2);
    ctx.fillStyle = '#000'; ctx.fillText(t.t, t.x + 1, t.y + 1);
    ctx.fillStyle = t.color; ctx.fillText(t.t, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  for (const m of meds) {
    ctx.fillStyle = '#e6dfc8'; ctx.fillRect(m.x - 9, m.y - 9, 18, 18);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(m.x - 9, m.y - 9, 18, 18);
    ctx.fillStyle = '#c8322a'; ctx.fillRect(m.x - 6, m.y - 2, 12, 4); ctx.fillRect(m.x - 2, m.y - 6, 4, 12);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (activeMods.has('fog') && state !== 'title') drawFog();
}

const fogC = document.createElement('canvas'); fogC.width = W; fogC.height = H;
const fg = fogC.getContext('2d');
function drawFog() {
  fg.globalCompositeOperation = 'source-over';
  fg.clearRect(0, 0, W, H);
  fg.fillStyle = 'rgba(8,8,12,.93)'; fg.fillRect(0, 0, W, H);
  fg.globalCompositeOperation = 'destination-out';
  for (const p of players) {
    const sx = W / 2 + (p.x - camX) * zoom, sy = AY + (H - AY) / 2 + (p.y - camY) * zoom, r = 300 * zoom;
    const gr = fg.createRadialGradient(sx, sy, r * .35, sx, sy, r);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    fg.fillStyle = gr;
    fg.beginPath(); fg.arc(sx, sy, r, 0, 6.283); fg.fill();
  }
  fg.globalCompositeOperation = 'source-over';
  ctx.drawImage(fogC, 0, 0);
}

function pips(x, y, lv, align) {
  const total = 3, w = 10, gap = 3, width = total * (w + gap) - gap;
  const x0 = align === 'right' ? x - width : x;
  for (let k = 0; k < total; k++) {
    ctx.fillStyle = k < lv ? '#f2d27a' : '#3a372c';
    ctx.fillRect(x0 + k * (w + gap), y - 9, w, 10);
  }
  return width;
}

/* ---------------- networking ---------------- */
const ROOM_PREFIX = 'blockrot-v4-room-';
const menu = document.getElementById('menu');
const netEl = document.getElementById('net');
const codeEl = document.getElementById('code');
const setNet = t => { netEl.textContent = t; };
const send = o => { if (conn && conn.open) conn.send(o); };

function cleanupNet() {
  const c = conn, pr = peer;
  conn = null; peer = null;
  if (c) try { c.close(); } catch (e) {}
  if (pr) try { pr.destroy(); } catch (e) {}
  mode = 'local'; myIndex = 0; lobby = 'none';
  netHeld = {}; netTaps = {}; lastHeldSent = ''; decalQueue.length = 0;
}
function netReady() {
  if (typeof Peer !== 'undefined') return true;
  setNet('Online play could not load. Check your internet connection and refresh the page.');
  return false;
}
function hostOnline() {
  if (!netReady()) return;
  cleanupNet();
  lobby = 'hosting';
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const code = Array.from({ length: 5 }, () => chars[Math.random() * chars.length | 0]).join('');
  peer = new Peer(ROOM_PREFIX + code);
  setNet('Creating a room...');
  peer.on('open', () => setNet(`Room code: ${code}. Send it to your friend and keep this tab open.`));
  peer.on('connection', c => {
    if (conn) { c.on('open', () => c.close()); return; }
    c.on('open', () => beginHost(c));
  });
  peer.on('error', e => setNet(e.type === 'unavailable-id' ? 'That code was taken. Press Host again.'
                                 : 'Could not create a room (' + e.type + '). Try another network.'));
}
function joinOnline() {
  if (!netReady()) return;
  const code = codeEl.value.trim().toUpperCase();
  if (code.length < 5) { setNet('Type the 5-letter room code first.'); return; }
  cleanupNet();
  lobby = 'joining';
  peer = new Peer();
  setNet('Connecting...');
  peer.on('open', () => {
    const c = peer.connect(ROOM_PREFIX + code, { reliable: true, serialization: 'json' });
    c.on('open', () => beginGuest(c));
    setTimeout(() => { if (lobby === 'joining' && !conn) setNet('Still connecting. Check the code, or try a different network.'); }, 10000);
  });
  peer.on('error', e => setNet(e.type === 'peer-unavailable' ? 'No room with that code. Check it and try again.'
                                 : 'Connection problem (' + e.type + '). Try another network.'));
}
function wire(c) {
  c.on('data', onData);
  c.on('close', connectionLost);
  c.on('error', connectionLost);
}
function beginHost(c) {
  conn = c; mode = 'host'; myIndex = 0; lobby = 'connected';
  wire(c);
  setNet('Your friend joined! Press Space or Enter to start. You are P1.');
}
function beginGuest(c) {
  conn = c; mode = 'guest'; myIndex = 1; lobby = 'connected';
  wire(c);
  setNet('Connected! Waiting for the host to start. You are P2.');
}
function connectionLost() {
  if (lobby !== 'connected') return;
  lobby = 'none';
  conn = null;
  if (state === 'title') { setNet('Your friend left the room.'); cleanupNet(); }
  else state = 'lost';
}
function backToMenu() {
  cleanupNet();
  state = 'title';
  setNet('');
}

function onData(d) {
  if (!d || typeof d !== 'object') return;
  if (mode === 'host') {
    if (d.t === 'held' && d.h) for (const a of ACTIONS) netHeld[a] = !!d.h[a];
    else if (d.t === 'tap' && typeof d.a === 'string') netTaps[d.a] = true;
  } else if (mode === 'guest') {
    if (d.t === 'start') guestStart();
    else if (d.t === 'snap') applySnap(d);
  }
}

/* host -> guest snapshot */
const BKINDS = ['bullet', 'rocket', 'plasma', 'homing', 'flame'];
const EKINDS = ['fire', 'acid', 'orb'];
const f2 = v => Math.round(v * 100) / 100;
function snapshot() {
  const r = Math.round, pal = [];
  const ci = c => { let i = pal.indexOf(c); if (i < 0) { i = pal.length; pal.push(c); } return i; };
  const out = {
    t: 'snap', st: state, wave, ts: toSpawn, cl: f2(clearT), it: f2(intermission), te: teamEnergy,
    am: [...activeMods], nm: nextMods, sh: r(shake), best,
    ma: Object.keys(mastery).map(k => mastery[k].lv),
    pl: players.map(p => ({
      x: r(p.x), y: r(p.y), dx: f2(p.dx), dy: f2(p.dy), hp: r(p.hp), al: p.alive, rv: f2(p.rev),
      w: f2(p.walk % 6.283), cur: p.cur, hu: p.hurt > 0 ? 1 : 0,
      sl: p.slots.map(sl => [sl.id, sl.rarity, sl.ammo === Infinity ? -1 : sl.ammo, sl.max === Infinity ? -1 : sl.max, sl.mod || 0]),
      sc: p.score, ca: p.cash, co: p.combo, b: p.build, up: p.up, mc: f2(p.medCd),
      ch: p.chain, ct: Object.fromEntries(Object.entries(p.chainT).map(([k, v]) => [k, f2(v)])),
      se: p.sel, rd: p.ready, ms: p.msgT > 0 ? p.msg : ''
    })),
    z: zombies.map(z => [z.id, z.boss ? z.key : z.type, r(z.x), r(z.y), z.r, r(z.hp), r(z.max), f2(z.dx), f2(z.dy),
      f2(z.walk % 6.283), z.flash > 0 ? 1 : 0, (z.elite ? 1 : 0) | (z.slow > 0 ? 2 : 0) | (z.burn > 0 ? 4 : 0),
      z.blinkT > 0 ? [r(z.bx), r(z.by)] : 0]),
    bu: bullets.map(b => [BKINDS.indexOf(b.kind), r(b.x), r(b.y), r(b.vx), r(b.vy), r(b.size), ci(b.color),
      b.slot && b.slot.rarity === 'rare' ? 1 : 0, f2(b.life)]),
    es: eshots.map(e => [r(e.x), r(e.y), r(e.vx), r(e.vy), e.r, EKINDS.indexOf(e.kind)]),
    be: beams.map(b => b.ring ? [1, r(b.x1), r(b.y1), b.r, ci(b.color), f2(b.life / b.max)]
                              : [0, r(b.x1), r(b.y1), r(b.x2), r(b.y2), b.w, ci(b.color), f2(b.life / b.max)]),
    bo: bolts.map(b => [b.pts.map(q => [r(q[0]), r(q[1])]), ci(b.color), f2(b.life / b.max)]),
    ba: barricades.map(b => [b.x, b.y, f2(b.hp / b.max)]),
    br: barrels.filter(b => b.alive).map(b => [b.x, b.y]),
    pu: puddles.map(q => [r(q.x), r(q.y), q.r, f2(q.life)]),
    pk: pickups.map(k => [r(k.x), r(k.y), k.type === 'ammo' ? 0 : 1, f2(k.life)]),
    lo: loot.map(l => [r(l.x), r(l.y), l.item, f2(l.bob)]),
    sk: strikes.map(q => [r(q.x), r(q.y), f2(q.t), f2(q.max)]),
    md: meds.map(m => [r(m.x), r(m.y)]),
    tx: texts.map(q => [r(q.x), r(q.y), q.t, ci(q.color), f2(q.life)]),
    bn: banners.slice(0, 1).map(b => [b.text, b.color, b.big ? 1 : 0, f2(b.life)]),
    pa: particles.slice(-260).map(q => [r(q.x), r(q.y), r(q.size), ci(q.color), f2(q.life / q.max)]),
    dc: decalQueue.splice(0)
  };
  out.pal = pal;
  return out;
}

/* guest side */
function guestStart() {
  mastery = {};
  for (const id in W_DEFS) mastery[id] = { lv: 0 };
  players = [newPlayer(0), newPlayer(1)];
  zombies = []; bullets = []; eshots = []; barricades = []; puddles = []; barrels = [];
  particles = []; pickups = []; loot = []; texts = []; banners = []; beams = []; bolts = [];
  strikes = []; meds = []; activeMods = new Set(); nextMods = [];
  resetGround();
  state = 'syncing';
}
function guestSlot(a) {
  const [id, rarity, ammo, max, mod] = a;
  const def = rarity === 'legendary' ? LEGENDARY[id] : W_DEFS[id];
  return { id, rarity, def, name: (rarity === 'rare' ? 'Prime ' : '') + def.name,
           base: rarity === 'legendary' ? null : id,
           ammo: ammo < 0 ? Infinity : ammo, max: max < 0 ? Infinity : max, mod: mod || undefined };
}
function applySnap(S) {
  if (!players.length) guestStart();
  if (players[0].slots.length === 0 && !S.pl[0].sl.length) return;
  const pal = S.pal || [];
  state = S.st; wave = S.wave; toSpawn = S.ts; clearT = S.cl; intermission = S.it; teamEnergy = S.te;
  activeMods = new Set(S.am); nextMods = S.nm; shake = S.sh; best = Math.max(best, S.best || 0);
  Object.keys(mastery).forEach((k, i) => { mastery[k].lv = S.ma[i] || 0; });

  S.pl.forEach((q, i) => {
    const p = players[i];
    const self = i === myIndex;
    p.hp = q.hp; p.rev = q.rv; p.cur = q.cur; p.hurt = q.hu ? .1 : 0;
    p.slots = q.sl.map(guestSlot);
    p.score = q.sc; p.cash = q.ca; p.combo = q.co; p.build = q.b; p.up = q.up; p.medCd = q.mc;
    p.chain = q.ch; p.chainT = q.ct; p.sel = q.se; p.ready = q.rd; p.msg = q.ms; p.msgT = q.ms ? 1 : 0;
    const revived = !p.alive && q.al;
    p.alive = q.al;
    p.tx = q.x; p.ty = q.y;
    const far = Math.hypot(q.x - p.x, q.y - p.y) > 150;
    if (far || revived || (self && (!p.alive || state !== 'play'))) { p.x = q.x; p.y = q.y; }
    if (!self) { p.dx = q.dx; p.dy = q.dy; p.walk = q.w; }
  });

  const old = new Map(zombies.map(z => [z.id, z]));
  zombies = S.z.map(a => {
    const [id, type, x, y, rr, hp, max, dx, dy, walk, flash, flags, blink] = a;
    let z = old.get(id);
    if (!z) {
      const boss = BOSSES.find(b => b.key === type);
      const T = boss || ZT[type];
      z = { id, type: boss ? 'boss' : type, boss: !!boss, key: boss ? type : undefined, name: boss ? boss.name : '',
            body: T.body, head: T.head, shield: !!T.shield, bloat: !!T.bloat, necro: !!T.necro,
            x, y, wob: id % 7 };
    }
    Object.assign(z, { tx: x, ty: y, r: rr, hp, max, dx, dy, walk, flash: flash ? 1 : 0,
      elite: !!(flags & 1), slow: flags & 2 ? 1 : 0, burn: flags & 4 ? 1 : 0,
      blinkT: blink ? 1 : 0, bx: blink ? blink[0] : 0, by: blink ? blink[1] : 0 });
    return z;
  });

  bullets = S.bu.map(([k, x, y, vx, vy, size, c, rare, life]) =>
    ({ kind: BKINDS[k], x, y, vx, vy, size, color: pal[c], slot: { rarity: rare ? 'rare' : 'base' }, life }));
  eshots = S.es.map(([x, y, vx, vy, rr, k]) => ({ x, y, vx, vy, r: rr, kind: EKINDS[k] }));
  beams = S.be.map(b => b[0] === 1
    ? { ring: true, x1: b[1], y1: b[2], r: b[3], color: pal[b[4]], life: b[5], max: 1 }
    : { x1: b[1], y1: b[2], x2: b[3], y2: b[4], w: b[5], color: pal[b[6]], life: b[7], max: 1 });
  bolts = S.bo.map(([pts, c, life]) => ({ pts, color: pal[c], life, max: 1 }));
  barricades = S.ba.map(([x, y, k]) => ({ x, y, hp: k, max: 1 }));
  barrels = S.br.map(([x, y]) => ({ x, y, r: 13, alive: true }));
  puddles = S.pu.map(([x, y, rr, life]) => ({ x, y, r: rr, life }));
  pickups = S.pk.map(([x, y, t, life]) => ({ x, y, type: t ? 'med' : 'ammo', life }));
  loot = S.lo.map(([x, y, item, bob]) => ({ x, y, item, bob }));
  strikes = S.sk.map(([x, y, t, max]) => ({ x, y, t, max }));
  meds = S.md.map(([x, y]) => ({ x, y }));
  texts = S.tx.map(([x, y, t, c, life]) => ({ x, y, t, color: pal[c], life }));
  banners = S.bn.map(([text, color, big, life]) => ({ text, color, big: !!big, life }));
  particles = S.pa.map(([x, y, size, c, a]) => ({ x, y, size, color: pal[c], life: a, max: 1, vx: 0, vy: 0 }));
  for (const d of S.dc || []) {
    if (d[0] === 0) splat(d[1], d[2], d[3], d[4]);
    else { g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.arc(d[1], d[2], d[3] * .45, 0, 6.283); g.fill(); }
  }
}
function guestSendInput() {
  const h = {};
  for (const a of ACTIONS) h[a] = held(anyKeys(a));
  const key = JSON.stringify(h);
  if (key !== lastHeldSent) { send({ t: 'held', h }); lastHeldSent = key; }
  for (const a of ACTIONS) if (tap(anyKeys(a))) send({ t: 'tap', a });
  if (tap(['KeyP', 'Escape'])) send({ t: 'tap', a: 'pause' });
  if (tap(['KeyR'])) send({ t: 'tap', a: 'restart' });
}
function guestFrame(dt) {
  time += dt;
  const me = players[myIndex];
  if (state === 'play' && me && me.alive) {
    // predict our own movement so it feels instant, then drift toward the host's copy
    let mx = (held(anyKeys('right')) ? 1 : 0) - (held(anyKeys('left')) ? 1 : 0);
    let my = (held(anyKeys('down')) ? 1 : 0) - (held(anyKeys('up')) ? 1 : 0);
    const moving = !!(mx || my);
    if (moving) {
      const l = Math.hypot(mx, my); mx /= l; my /= l;
      me.dx = mx; me.dy = my; me.walk += dt * 12;
      const spd = me.speed * (1 + .08 * me.up.speed);
      me.x += mx * spd * dt; me.y += my * spd * dt;
      const mate = players[1 - myIndex];
      me.x = clamp(me.x, mate.x - MAXDX, mate.x + MAXDX);
      me.y = clamp(me.y, mate.y - MAXDY, mate.y + MAXDY);
      solid(me);
    }
    const ex = (me.tx ?? me.x) - me.x, ey = (me.ty ?? me.y) - me.y, e = Math.hypot(ex, ey);
    const k = moving ? (e > 40 ? Math.min(1, dt * 3) : 0) : Math.min(1, dt * 8);
    me.x += ex * k; me.y += ey * k;
  }
  const smooth = Math.min(1, dt * 15);
  for (const p of players) {
    if (p === me && p.alive && state === 'play') continue;
    if (p.tx !== undefined) { p.x += (p.tx - p.x) * smooth; p.y += (p.ty - p.y) * smooth; }
  }
  for (const z of zombies) { z.x += (z.tx - z.x) * smooth; z.y += (z.ty - z.y) * smooth; }
  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.kind === 'flame') b.size += dt * 34; }
  for (const e of eshots) { e.x += e.vx * dt; e.y += e.vy * dt; }
  for (const q of strikes) q.t = Math.max(0, q.t - dt);
  if (players.length && (state === 'play' || state === 'shop' || state === 'paused')) updateCam(dt, false);
}

document.getElementById('bLocal').addEventListener('click', e => {
  e.currentTarget.blur(); cleanupNet(); setNet(''); startGame(); cv.focus();
});
document.getElementById('bHost').addEventListener('click', e => { e.currentTarget.blur(); hostOnline(); cv.focus(); });
document.getElementById('bJoin').addEventListener('click', e => { e.currentTarget.blur(); joinOnline(); cv.focus(); });

/* ---------------- loop ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  menu.style.display = state === 'title' ? 'flex' : 'none';

  if (state === 'lost') {
    if (tap(['KeyR'])) backToMenu();
  } else if (mode === 'guest') {
    if (state === 'title') { /* waiting for the host */ }
    else guestSendInput();
    if (state !== 'title') guestFrame(dt);
  } else {
    const wantPause = tap(['KeyP', 'Escape']) || netTaps.pause;
    const wantRestart = tap(['KeyR']) || netTaps.restart;
    if (state === 'title') {
      if (tap(['Space', 'Enter', 'NumpadEnter'])) {
        if (mode === 'host' && conn) startGame();
        else if (lobby === 'none') { setNet(''); startGame(); }
        else if (lobby === 'hosting') setNet('Still waiting for your friend to join...');
      }
    } else if (state === 'play') {
      if (wantPause) state = 'paused';
      else update(dt);
    } else if (state === 'shop') {
      shopInput(dt);
      updateFx(dt);
    } else if (state === 'paused') {
      if (wantPause) state = 'play';
      else if (wantRestart) startGame();
    } else if (state === 'over') {
      updateFx(dt);
      if (wantRestart) startGame();
    }
    netTaps = {};
    if (mode === 'host' && conn && state !== 'title') {
      snapAcc += dt;
      const busy = conn.dataChannel && conn.dataChannel.bufferedAmount > 300000;
      if (snapAcc >= .05 && !busy) { snapAcc = 0; send(snapshot()); }
    }
  }
  draw();
  for (const k in pressed) delete pressed[k];
  requestAnimationFrame(loop);
}
resetGround();
cv.focus();
requestAnimationFrame(loop);
</script>
