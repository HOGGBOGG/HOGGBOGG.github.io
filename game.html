  ctx.font = `11px ${FONT}`; ctx.fillStyle = '#1d1c16'; ctx.textAlign = 'center';
  ctx.fillText(Math.ceil(p.hp) + '/' + maxHp(p), bx + 75, 19);
  ctx.textAlign = 'left';
  const scoreTxt = PVP() ? `${pvpScoreOf(p)} / ${gameMode === 'gg' ? GG_LADDER.length : pvpTarget()}`
                         : `${p.score}${p.combo > 1 ? '  x' + Math.min(p.combo, 10) : ''}`;
  ctx.font = `bold 15px ${FONT}`;
  ctx.fillStyle = p.combo > 1 && !PVP() ? '#f2d27a' : '#e6dfc8';
  ctx.fillText(scoreTxt, bx + 162, 20);
  const scoreW = ctx.measureText(scoreTxt).width + 16;
  ctx.font = `bold 14px ${FONT}`;
  if (PVP()) {
    ctx.fillStyle = '#8f8870';
    ctx.fillText(`${p.kills}k / ${p.deaths}d`, bx + 162 + scoreW, 20);
  } else {
    ctx.fillStyle = '#8fd67a';
    ctx.fillText('$' + p.cash, bx + 162 + scoreW, 20);
  }
  ctx.font = `12px ${FONT}`; ctx.fillStyle = '#a9a28a';
  const cls = cdef(p);
  const abTxt = p.abT > 0 ? `${cls.ability} ACTIVE ${Math.ceil(p.abT)}s`
              : p.abCd > 0 ? `${cls.ability} in ${Math.ceil(p.abCd)}s` : `${cls.ability} ready [C]`;
  ctx.fillStyle = p.abT > 0 ? '#8fd67a' : p.abCd > 0 ? '#8f8870' : '#f2d27a';
  ctx.fillText(`${cls.name}  ·  ${abTxt}`, x0, 42);
  if (!PVP()) {
    ctx.fillStyle = '#8f8870';
    ctx.fillText(`Barricades ${p.build}/${buildCap(p)}   Medkit ${p.medCd > 0 ? Math.ceil(p.medCd) + 's' : 'ready'}`, x0 + 250, 42);
  }
}

function drawWeaponBar(p) {
  const bw = 178, gap = 8, n = SLOT_CAP;
  const total = n * bw + (n - 1) * gap + 130;
  let x = W / 2 - total / 2, y = H - 56;
  for (let i = 0; i < n; i++) {
    const s = p.slots[i];
    const on = i === p.cur;
    ctx.fillStyle = on ? 'rgba(60,56,40,.95)' : 'rgba(18,17,12,.85)';
    ctx.fillRect(x, y, bw, 46);
    ctx.strokeStyle = on ? (s ? RARITY_COLOR[s.rarity] : '#8f8870') : '#3a362a';
    ctx.lineWidth = on ? 3 : 2;
    ctx.strokeRect(x, y, bw, 46);
    ctx.textAlign = 'left'; ctx.font = `bold 12px ${FONT}`; ctx.fillStyle = on ? '#f2d27a' : '#6b665a';
    ctx.fillText(String(i + 1), x + 7, y + 15);
    if (s) {
      ctx.font = `bold 13px ${FONT}`;
      ctx.fillStyle = s.rarity === 'base' ? '#e6dfc8' : RARITY_COLOR[s.rarity];
      ctx.fillText(s.name, x + 22, y + 15, bw - 60);
      ctx.textAlign = 'right'; ctx.font = `bold 13px ${FONT}`;
      const am = s.ammo === Infinity ? '∞' : Math.ceil(s.ammo);
      ctx.fillStyle = s.ammo === Infinity ? '#8f8870' : s.ammo <= 0 ? '#d0402f' : s.ammo / s.max < .25 ? '#f2b134' : '#e6dfc8';
      ctx.fillText(am, x + bw - 8, y + 15);
      const ml = modLabel(s);
      ctx.textAlign = 'left'; ctx.font = `11px ${FONT}`; ctx.fillStyle = '#a9a28a';
      ctx.fillText(ml || (s.def.cat || ''), x + 22, y + 30, bw - 30);
      if (s.base && mastery[s.base] && mastery[s.base].lv) pips(x + 22, y + 43, mastery[s.base].lv, 'left');
      if (s.ammo !== Infinity) {
        ctx.fillStyle = '#3a372c'; ctx.fillRect(x + bw - 60, y + 36, 52, 4);
        ctx.fillStyle = '#c9a227'; ctx.fillRect(x + bw - 60, y + 36, 52 * clamp(s.ammo / s.max, 0, 1), 4);
      }
    } else {
      ctx.font = `12px ${FONT}`; ctx.fillStyle = '#4b463a';
      ctx.fillText('empty', x + 22, y + 15);
    }
    x += bw + gap;
  }
  // class ability button
  const cls = cdef(p), ready = p.abCd <= 0, act = p.abT > 0;
  ctx.fillStyle = act ? 'rgba(60,90,60,.95)' : 'rgba(18,17,12,.85)';
  ctx.fillRect(x, y, 122, 46);
  ctx.strokeStyle = act ? '#8fd67a' : ready ? '#f2d27a' : '#3a362a'; ctx.lineWidth = 2;
  ctx.strokeRect(x, y, 122, 46);
  ctx.textAlign = 'left'; ctx.font = `bold 12px ${FONT}`; ctx.fillStyle = ready || act ? '#f2d27a' : '#6b665a';
  ctx.fillText('C', x + 7, y + 15);
  ctx.font = `bold 12px ${FONT}`; ctx.fillStyle = act ? '#8fd67a' : ready ? '#e6dfc8' : '#8f8870';
  ctx.fillText(cls.ability, x + 20, y + 15, 96);
  ctx.font = `11px ${FONT}`; ctx.fillStyle = '#a9a28a';
  ctx.fillText(act ? Math.ceil(p.abT) + 's left' : ready ? 'ready' : Math.ceil(p.abCd) + 's', x + 20, y + 30);
  if (!ready && !act) {
    ctx.fillStyle = '#3a372c'; ctx.fillRect(x + 8, y + 36, 106, 4);
    ctx.fillStyle = '#c9a227'; ctx.fillRect(x + 8, y + 36, 106 * (1 - p.abCd / abilityCd(p)), 4);
  }
}

function drawChainBar(p) {
  const sl = p.slots[p.cur];
  if (!p.alive || !sl || !sl.base || !mastery[sl.base]) return;
  const id = sl.base, m = mastery[id];
  const bx = 10;
  ctx.fillStyle = 'rgba(18,17,12,.85)'; ctx.fillRect(bx, AY + 8, 250, 26);
  ctx.textAlign = 'left'; ctx.font = `bold 12px ${FONT}`; ctx.fillStyle = p.head;
  if (m.lv >= 3) { ctx.fillText(`${W_DEFS[id].name} fully mastered`, bx + 10, AY + 25); return; }
  const need = masteryNeed(m.lv), c = p.chain[id] || 0;
  ctx.fillText(`${W_DEFS[id].name} chain`, bx + 10, AY + 25);
  const barX = bx + 140, barW = 60;
  ctx.fillStyle = '#3a372c'; ctx.fillRect(barX, AY + 16, barW, 10);
  const tFrac = Math.max(0, (p.chainT[id] || 0) / CHAIN_WINDOW);
  ctx.fillStyle = '#f2d27a'; ctx.fillRect(barX, AY + 16, barW * Math.min(1, c / need), 10);
  ctx.fillStyle = 'rgba(242,210,122,.45)'; ctx.fillRect(barX, AY + 28, barW * tFrac, 2);
  ctx.textAlign = 'right'; ctx.fillStyle = '#e6dfc8'; ctx.font = `12px ${FONT}`;
  ctx.fillText(`${c}/${need}`, bx + 242, AY + 25);
}

function drawTeamPanel(me) {
  const list = players.filter(q => !q.gone && q !== me);
  if (!list.length) return;
  const px = W - 236, py = AY + 8, rh = 20;
  ctx.fillStyle = 'rgba(18,17,12,.85)'; ctx.fillRect(px, py, 226, 12 + list.length * rh);
  list.forEach((q, i) => {
    const yy = py + 20 + i * rh;
    ctx.textAlign = 'left'; ctx.font = `bold 12px ${FONT}`; ctx.fillStyle = q.head;
    ctx.fillText(cdef(q).icon + ' ' + q.name, px + 8, yy);
    if (q.alive) {
      ctx.fillStyle = '#2e2c24'; ctx.fillRect(px + 110, yy - 9, 60, 9);
      ctx.fillStyle = q.hp > maxHp(q) * .35 ? '#6bbf4a' : '#d0402f';
      ctx.fillRect(px + 110, yy - 9, 60 * clamp(q.hp / maxHp(q), 0, 1), 9);
    } else {
      ctx.fillStyle = '#e2735f'; ctx.fillText('DOWN', px + 112, yy);
    }
    ctx.textAlign = 'right'; ctx.font = `12px ${FONT}`; ctx.fillStyle = '#a9a28a';
    ctx.fillText(q.score, px + 218, yy);
  });
}

function drawScorePanel(me) {
  const list = players.filter(q => !q.gone).sort((a, b) => pvpScoreOf(b) - pvpScoreOf(a));
  const px = W - 250, rh = 19;
  let py = AY + 8;
  if (TEAMS()) {
    ctx.fillStyle = 'rgba(18,17,12,.88)'; ctx.fillRect(px, py, 240, 30);
    for (let t = 0; t < 2; t++) {
      ctx.textAlign = t ? 'right' : 'left';
      ctx.font = `bold 18px ${FONT}`; ctx.fillStyle = TEAM_COLORS[t][1];
      ctx.fillText(`${TEAM_NAMES[t]} ${teamScore[t]}`, t ? px + 232 : px + 8, py + 21);
    }
    ctx.textAlign = 'center'; ctx.font = `11px ${FONT}`; ctx.fillStyle = '#8f8870';
    ctx.fillText('first to ' + TDM_TARGET, px + 120, py + 21);
    py += 34;
  }
  ctx.fillStyle = 'rgba(18,17,12,.85)'; ctx.fillRect(px, py, 240, 12 + list.length * rh);
  list.forEach((q, i) => {
    const yy = py + 19 + i * rh;
    ctx.textAlign = 'left'; ctx.font = `bold 12px ${FONT}`;
    ctx.fillStyle = q === me ? '#fff' : q.head;
    ctx.fillText(`${i + 1}. ${cdef(q).icon} ${q.name}${q === me ? ' (you)' : ''}`, px + 8, yy);
    ctx.textAlign = 'right'; ctx.font = `12px ${FONT}`;
    if (gameMode === 'gg') {
      ctx.fillStyle = '#f2d27a';
      ctx.fillText(`${q.gg + 1}/${GG_LADDER.length}`, px + 232, yy);
    } else {
      ctx.fillStyle = '#e6dfc8';
      ctx.fillText(`${q.kills}`, px + 210, yy);
      ctx.fillStyle = '#8f8870';
      ctx.fillText(`${q.deaths}`, px + 234, yy);
    }
  });
  if (feed.length) {
    let fy = py + 24 + list.length * rh;
    ctx.textAlign = 'right'; ctx.font = `12px ${FONT}`;
    for (const f of feed) {
      ctx.globalAlpha = Math.min(1, f.life);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, W - 14, fy);
      fy += 16;
    }
    ctx.globalAlpha = 1;
  }
}

function drawEdgeMarkers(me) {
  for (const q of players) {
    if (q.gone || q === me) continue;
    if (PVP() && hostile(me, q)) continue;                 // no wallhacks on enemies
    const sx = W / 2 + (q.x - camX) * zoom, sy = AY + (H - AY) / 2 + (q.y - camY) * zoom;
    if (sx > 0 && sx < W && sy > AY && sy < H) continue;
    const ex = clamp(sx, 24, W - 24), ey = clamp(sy, AY + 24, H - 24);
    const a = Math.atan2(sy - ey, sx - ex);
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(a);
    ctx.fillStyle = q.alive ? q.head : '#e2735f';
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-6, -8); ctx.lineTo(-6, 8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
    ctx.textAlign = 'center'; ctx.font = `bold 11px ${FONT}`;
    ctx.fillStyle = q.alive ? q.head : '#e2735f';
    ctx.fillText(q.alive ? q.name : q.name + ' (down)', ex - Math.cos(a) * 22, ey - Math.sin(a) * 18 + 4);
  }
}

function drawHud() {
  ctx.fillStyle = '#12110c'; ctx.fillRect(0, 0, W, AY);
  ctx.fillStyle = '#000'; ctx.fillRect(0, AY - 2, W, 2);
  const me = players[myIndex];
  if (!me) return;
  drawPlayerBlock(me);
  ctx.textAlign = 'center';
  ctx.font = `bold 18px ${FONT}`; ctx.fillStyle = '#e6dfc8';
  if (PVP()) {
    ctx.fillText(GAME_MODES[gameMode].name, W / 2, 21);
    ctx.font = `13px ${FONT}`; ctx.fillStyle = '#8f8870';
    const sub = gameMode === 'gg'
      ? 'Weapon ' + (me.gg + 1) + ' of ' + GG_LADDER.length + ': ' + (me.slots[0] ? me.slots[0].name : '')
      : gameMode === 'tdm' ? `${TEAM_NAMES[me.team]} team  ·  ${teamScore[me.team]} / ${TDM_TARGET}`
      : `${me.kills} / ${DM_TARGET} kills`;
    ctx.fillText(sub, W / 2, 42);
  } else {
    ctx.fillText('Wave ' + wave + (wave % BOSS_EVERY === 0 ? ' (boss)' : ''), W / 2, 21);
    ctx.font = `13px ${FONT}`; ctx.fillStyle = '#8f8870';
    ctx.fillText(clearT > 0 ? 'Wave cleared' : intermission > 0 ? 'Next wave in ' + Math.ceil(intermission)
      : (zombies.length + toSpawn + miniQueue) + ' enemies left', W / 2, 42);
  }
  if (mode !== 'solo') {
    ctx.textAlign = 'right'; ctx.font = `12px ${FONT}`; ctx.fillStyle = '#8f8870';
    ctx.fillText(roomCode ? `Room ${roomCode}  ·  ${teamSize()} players${mode === 'host' ? '  ·  K to remove' : ''}` : '', W - 14, 20);
  }

  let y = AY + 8;
  if (PVP()) { drawScorePanel(me); drawEdgeMarkers(me); }
  else {
    drawChainBar(me); drawTeamPanel(me); drawEdgeMarkers(me);
    const pw = 380, px = W / 2 - pw / 2, full = teamEnergy >= energyMax();
    const modTxt = [...activeMods].map(m => MODIFIERS[m].name).join('  ·  ');
    const ph = modTxt ? 46 : 26;
    ctx.fillStyle = 'rgba(18,17,12,.85)'; ctx.fillRect(px, AY + 8, pw, ph);
    ctx.textAlign = 'left'; ctx.font = `bold 12px ${FONT}`;
    ctx.fillStyle = full ? (Math.floor(time * 4) % 2 ? '#ff9a3c' : '#ffd27a') : '#8f8870';
    ctx.fillText(full ? 'Airstrike ready: two players press G together' : 'Airstrike', px + 10, AY + 25);
    if (!full) {
      ctx.fillStyle = '#3a372c'; ctx.fillRect(px + 90, AY + 16, 270, 10);
      ctx.fillStyle = '#ff9a3c'; ctx.fillRect(px + 90, AY + 16, 270 * teamEnergy / energyMax(), 10);
    }
    if (modTxt) {
      ctx.textAlign = 'center'; ctx.font = `bold 12px ${FONT}`; ctx.fillStyle = '#c9a0ff';
      ctx.fillText(modTxt, W / 2, AY + 45);
    }
    y = AY + 8 + Math.max(34, ph + 6);
  }
  const boss = zombies.find(z => z.boss && !z.mini);
  if (boss) {
    ctx.fillStyle = 'rgba(18,17,12,.85)'; ctx.fillRect(W / 2 - 260, y, 520, 36);
    ctx.textAlign = 'center'; ctx.font = `bold 14px ${FONT}`; ctx.fillStyle = '#e2735f';
    ctx.fillText(boss.name + (boss.hp < boss.max * .4 ? ' (enraged)' : ''), W / 2, y + 14);
    ctx.fillStyle = '#3a1612'; ctx.fillRect(W / 2 - 250, y + 20, 500, 10);
    ctx.fillStyle = '#d0402f'; ctx.fillRect(W / 2 - 250, y + 20, 500 * Math.max(0, boss.hp / boss.max), 10);
    y += 42;
  }

  if (banners.length) {
    const b = banners[0];
    ctx.globalAlpha = Math.min(1, b.life * 2);
    ctx.textAlign = 'center';
    ctx.font = b.big ? `34px ${DISPLAY}` : `bold 22px ${FONT}`;
    ctx.fillStyle = '#000'; ctx.fillText(b.text, W / 2 + 2, y + 52);
    ctx.fillStyle = b.color; ctx.fillText(b.text, W / 2, y + 50);
    ctx.globalAlpha = 1;
  }

  drawWeaponBar(me);

  if (!PVP()) {
    const earned = Object.keys(mastery).filter(k => mastery[k].lv > 0);
    if (earned.length) {
      const show = earned.slice(0, 6);
      const hh = 22 + show.length * 18;
      ctx.fillStyle = 'rgba(18,17,12,.8)'; ctx.fillRect(10, H - hh - 70, 190, hh);
      ctx.textAlign = 'left'; ctx.font = `bold 12px ${FONT}`; ctx.fillStyle = '#8f8870';
      ctx.fillText('Team mastery', 20, H - hh - 70 + 16);
      show.forEach((k, i) => {
        ctx.font = `13px ${FONT}`; ctx.fillStyle = '#e6dfc8';
        ctx.fillText(W_DEFS[k].name, 20, H - hh - 70 + 36 + i * 18);
        pips(190, H - hh - 70 + 36 + i * 18, mastery[k].lv, 'right');
      });
    }
  }

  const mx = W - MMW - 10, my = H - MMH - 10;
  ctx.drawImage(mm, mx, my);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(mx, my, MMW, MMH);
  ctx.strokeStyle = 'rgba(230,223,200,.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(mx + (camX - W / 2 / zoom) * MMS, my + (camY - (H - AY) / 2 / zoom) * MMS, W / zoom * MMS, (H - AY) / zoom * MMS);
  for (const z of zombies) {
    if (activeMods.has('fog') && !z.boss && zombies.length + toSpawn > 5) continue;
    ctx.fillStyle = z.boss ? '#ff4a3a' : z.elite ? '#f2d27a' : '#b8322a';
    const sz = z.boss ? (z.mini ? 4 : 6) : 2;
    ctx.fillRect(mx + z.x * MMS - sz / 2, my + z.y * MMS - sz / 2, sz, sz);
  }
  for (const l of loot) {
    ctx.fillStyle = l.item.kind === 'mod' ? MODS[l.item.id].color : RARITY_COLOR[l.item.rarity];
    ctx.fillRect(mx + l.x * MMS - 3, my + l.y * MMS - 3, 6, 6);
  }
  for (const m of minions) { ctx.fillStyle = '#9ad7ff'; ctx.fillRect(mx + m.x * MMS - 2, my + m.y * MMS - 2, 4, 4); }
  for (const p of players) {
    if (p.gone) continue;
    if (PVP() && p !== me && hostile(me, p)) continue;
    ctx.fillStyle = p.alive ? p.head : '#6b665a';
    const sz = p === me ? 8 : 6;
    ctx.fillRect(mx + p.x * MMS - sz / 2, my + p.y * MMS - sz / 2, sz, sz);
  }
}

function shade(a) { ctx.fillStyle = `rgba(10,9,6,${a})`; ctx.fillRect(0, 0, W, H); }

function drawShopColumn(p, x0, hint) {

/* ---------------- networking ---------------- */
// Star network: the host's browser runs the game; every guest connects to the host.
const ROOM_PREFIX = 'blockrot-v6-room-';
const menu = document.getElementById('menu');
const netEl = document.getElementById('net');
const codeEl = document.getElementById('code');
const nameEl = document.getElementById('pname');
const classEl = document.getElementById('pclass');
const classNote = document.getElementById('classNote');
const modeRow = document.getElementById('modeRow');
const setNet = t => { netEl.textContent = t; };
const cleanName = (raw, fallback) => (String(raw || '').replace(/[^\w \-]/g, '').trim().slice(0, 12) || fallback);
const cleanClass = c => (CLASSES[c] ? c : 'soldier');
const sendTo = (c, o) => { if (c && c.open) c.send(o); };
function send(o) {
  if (mode === 'guest') sendTo(conn, o);
  else if (mode === 'host') for (const gst of guests) sendTo(gst.conn, o);
}

function cleanupNet() {
  const list = guests.map(gst => gst.conn).concat(conn ? [conn] : []);
  const pr = peer;
  guests = []; conn = null; peer = null; roster = []; roomCode = '';
  mode = 'solo'; myIndex = 0; lobby = 'none';
  netHeld = {}; netTaps = {}; lastHeldSent = ''; decalQueue.length = 0;
  for (const c of list) try { c.close(); } catch (e) {}
  if (pr) try { pr.destroy(); } catch (e) {}
}
function netReady() {
  if (typeof Peer !== 'undefined') return true;
  setNet('Online play could not load. Check your internet connection and refresh the page.');
  return false;
}
function lobbyText() {
  const names = roster.map(r => `${r.name} (${CLASSES[cleanClass(r.cls)].name})`).join(', ');
  const gm = GAME_MODES[gameMode].name;
  if (mode === 'host') {
    setNet(`Room code: ${roomCode}   ${gm}   Players ${roster.length}/${MAX_PLAYERS}: ${names}. ` +
           (guests.length ? 'Press Space or Enter to start, or K to remove someone. Friends can still join mid-game.'
                          : 'Waiting for friends to join...'));
  } else if (mode === 'guest') {
    setNet(`Room ${roomCode}   ${gm}   Players ${roster.length}/${MAX_PLAYERS}: ${names}. Waiting for the host to start.`);
  }
}

/* host side */
function hostOnline() {
  if (!netReady()) return;
  cleanupNet();
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const code = Array.from({ length: 5 }, () => chars[Math.random() * chars.length | 0]).join('');
  mode = 'host'; myIndex = 0; lobby = 'hosting'; roomCode = code;
  roster = [{ idx: 0, name: cleanName(nameEl.value, 'P1'), cls: myClass }];
  peer = new Peer(ROOM_PREFIX + code);
  setNet('Creating a room...');
  peer.on('open', () => lobbyText());
  peer.on('connection', c => c.on('open', () => guestJoined(c)));
  peer.on('error', e => setNet(e.type === 'unavailable-id' ? 'That code was taken. Press Host again.'
                                 : 'Could not create a room (' + e.type + '). Try another network.'));
}
function freeIndex() {
  const used = i => i === 0 || guests.some(gst => gst.idx === i);
  for (let i = 1; i < MAX_PLAYERS; i++) {
    if (used(i)) continue;
    if (state === 'title' || !players[i] || players[i].gone) return i;
  }
  return -1;
}
function guestJoined(c) {
  if (mode !== 'host') { c.close(); return; }
  const idx = freeIndex();
  if (idx < 0) { sendTo(c, { t: 'full' }); setTimeout(() => { try { c.close(); } catch (e) {} }, 800); return; }
  const meta = c.metadata || {};
  if (banned.has(c.peer)) { sendTo(c, { t: 'kicked' }); setTimeout(() => { try { c.close(); } catch (e) {} }, 500); return; }
  const gst = { conn: c, idx, name: cleanName(meta.name, 'P' + (idx + 1)), cls: cleanClass(meta.cls), seen: performance.now() };
  guests.push(gst);
  roster = roster.filter(r => r.idx !== idx).concat([{ idx, name: gst.name, cls: gst.cls }]).sort((a, b) => a.idx - b.idx);
  netHeld[idx] = {}; netTaps[idx] = {};
  c.on('data', d => onHostData(gst, d));
  c.on('close', () => guestLeft(gst));
  c.on('error', () => guestLeft(gst));
  sendTo(c, { t: 'welcome', idx, code: roomCode, gm: gameMode });
  if (state !== 'title') {
    addLatePlayer(idx, gst.name, gst.cls);
    sendTo(c, { t: 'start', gm: gameMode });
    snapAcc = 1;
    banner(gst.name + ' joined the fight', '#8fd67a');
  }
  broadcastLobby();
  if (state === 'title') lobbyText();
}
function addLatePlayer(idx, name, cls) {
  const teamCount = [0, 0];
  for (const q of players) if (q && !q.gone) teamCount[q.team]++;
  const team = teamCount[0] <= teamCount[1] ? 0 : 1;
  const p = newPlayer(idx, name, cls, team);
  giveStartWeapons(p);
  if (PVP()) {
    const [x, y] = pvpSpawnPoint(p);
    p.x = x; p.y = y;
  } else {
    const anchor = players.find(q => q.alive && !q.gone);
    if (anchor) { p.x = anchor.x + rand(-30, 30); p.y = anchor.y + rand(-30, 30); solid(p); }
    const others = players.filter(q => q && !q.gone);
    p.cash = others.length ? Math.round(others.reduce((a, q) => a + q.cash, 0) / others.length / 2) : 0;
  }
  p.hurt = 1; p.spawnProt = SPAWN_PROT;
  if (state === 'shop') { p.offers = rollOffers(p, OFFER_COUNT); p.ready = false; }
  while (players.length < idx) { const filler = newPlayer(players.length); filler.gone = true; filler.alive = false; players.push(filler); }
  players[idx] = p;
}
function guestLeft(gst, why) {
  const k = guests.indexOf(gst);
  if (k < 0) return;
  guests.splice(k, 1);
  roster = roster.filter(r => r.idx !== gst.idx);
  netHeld[gst.idx] = {}; netTaps[gst.idx] = {};
  if (state !== 'title' && players[gst.idx]) {
    const p = players[gst.idx];
    p.gone = true; p.alive = false;
    for (const m of minions) if (m.owner === p) m.dead = true;
    banner(p.name + ' ' + (why || 'left the game'), '#e2735f');
    if (!PVP() && players.every(q => !q.alive || q.gone)) gameOver();
  }
  broadcastLobby();
  if (state === 'title') lobbyText();
}
function broadcastLobby() { send({ t: 'lobby', roster, code: roomCode, gm: gameMode }); }
function onHostData(gst, d) {
  gst.seen = performance.now();
  if (!d || typeof d !== 'object' || d.t === 'ping') return;
  if (d.t === 'held' && d.h) {
    const h = netHeld[gst.idx] = {};
    for (const a of ACTIONS) h[a] = !!d.h[a];
  } else if (d.t === 'tap' && typeof d.a === 'string' && d.a.length < 12) {
    (netTaps[gst.idx] = netTaps[gst.idx] || {})[d.a] = true;
  } else if (d.t === 'class' && state === 'title') {
    gst.cls = cleanClass(d.c);
    const r = roster.find(x => x.idx === gst.idx);
    if (r) r.cls = gst.cls;
    broadcastLobby(); lobbyText();
  }
}

/* ---------------- host controls: kick anyone, clear out ghosts ---------------- */
const DIGIT_KEYS = [1,2,3,4,5,6,7,8,9].map(n => ['Digit' + n, 'Numpad' + n]);
function kickList() { return guests.slice().sort((a, b) => a.idx - b.idx); }
function kickGuest(gst) {
  if (!gst) return;
  if (gst.conn && gst.conn.peer) banned.add(gst.conn.peer);
  sendTo(gst.conn, { t: 'kicked' });
  const c = gst.conn;
  setTimeout(() => { try { c.close(); } catch (e) {} }, 400);
  guestLeft(gst, 'was removed by the host');
  if (state === 'title') setNet(gst.name + ' was removed. ' + netEl.textContent);
}
// A browser that is closed or asleep often never fires 'close', which used to
// leave a player who can never ready up and a shop nobody could leave.
function dropDeadGuests() {
  if (mode !== 'host' || !guests.length) return;
  const now = performance.now();
  for (const gst of guests.slice()) {
    const gone = (gst.conn && gst.conn.open === false) || now - (gst.seen || now) > PEER_TIMEOUT;
    if (!gone) continue;
    try { gst.conn.close(); } catch (e) {}
    guestLeft(gst, 'lost connection');
  }
}
function hostKeys() {
  if (mode !== 'host') { kickOpen = false; return; }
  if (tap(['KeyK'])) { kickOpen = !kickOpen; delete pressed.KeyK; }
  if (!kickOpen) return;
  if (tap(['Escape'])) { kickOpen = false; delete pressed.Escape; }
  else {
    const list = kickList();
    for (let i = 0; i < Math.min(9, list.length); i++) {
      if (tap(DIGIT_KEYS[i])) { kickGuest(list[i]); kickOpen = guests.length > 0; break; }
    }
  }
  for (const pair of DIGIT_KEYS) for (const k of pair) delete pressed[k];   // no weapon swap while the list is open
}

/* guest side */
function joinOnline() {
  if (!netReady()) return;
  const code = codeEl.value.trim().toUpperCase();
  if (code.length < 5) { setNet('Type the 5-letter room code first.'); return; }
  cleanupNet();
  lobby = 'joining'; roomCode = code;
  peer = new Peer();
  setNet('Connecting...');
  peer.on('open', () => {
    const c = peer.connect(ROOM_PREFIX + code, { reliable: true, serialization: 'json',
                                                 metadata: { name: cleanName(nameEl.value, ''), cls: myClass } });
    c.on('open', () => beginGuest(c));
    setTimeout(() => { if (lobby === 'joining' && !conn) setNet('Still connecting. Check the code, or try a different network.'); }, 10000);
  });
  peer.on('error', e => setNet(e.type === 'peer-unavailable' ? 'No room with that code. Check it and try again.'
                                 : 'Connection problem (' + e.type + '). Try another network.'));
}
function beginGuest(c) {
  conn = c; mode = 'guest'; myIndex = -1; lobby = 'connected';
  c.on('data', onGuestData);
  c.on('close', connectionLost);
  c.on('error', connectionLost);
  setNet('Connected! Waiting for the host...');
}
function onGuestData(d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'welcome') { myIndex = d.idx; if (d.code) roomCode = d.code; if (d.gm) { gameMode = d.gm; syncModeButtons(); } }
  else if (d.t === 'lobby') { roster = d.roster || []; if (d.gm) { gameMode = d.gm; syncModeButtons(); } if (state === 'title') lobbyText(); }
  else if (d.t === 'full') { lobby = 'full'; cleanupNet(); setNet(`That room is full (${MAX_PLAYERS} players).`); }
  else if (d.t === 'kicked') { lobby = 'none'; cleanupNet(); state = 'title'; setNet('The host removed you from the room.'); }
  else if (d.t === 'start') guestStart(d.gm);
  else if (d.t === 'snap') applySnap(d);
}
function connectionLost() {
  if (lobby !== 'connected') return;
  lobby = 'none';
  conn = null;
  if (state === 'title') { cleanupNet(); setNet('The host closed the room.'); }
  else state = 'lost';
}
function backToMenu() {
  cleanupNet();
  state = 'title';
  setNet('');
}

/* ---------------- host -> guest snapshot ---------------- */
const BKINDS = ['bullet', 'rocket', 'plasma', 'homing', 'flame'];
const EKINDS = Object.keys(ESHOT);
// Stable indexes so snapshots ship numbers instead of type names.
const ZKEYS = Object.keys(ZT);
const BKEYS = BOSSES.map(b => b.key);
const EPKEYS = Object.keys(ELITE_PATTERNS);
const f2 = v => Math.round(v * 100) / 100;
const netSlot = sl => [sl.id, sl.rarity, sl.ammo === Infinity ? -1 : Math.round(sl.ammo),
                       sl.max === Infinity ? -1 : sl.max, sl.mods || {}];
function detailFor(p) {
  return {
    cur: p.cur, sl: p.slots.map(netSlot), ca: p.cash, b: p.build, up: p.up, mc: f2(p.medCd),
    ch: p.chain, ct: Object.fromEntries(Object.entries(p.chainT).map(([k, v]) => [k, f2(v)])),
    se: p.sel, of: p.offers, rr: p.rerolls, ms: p.msgT > 0 ? p.msg : '',
    ab: f2(p.abCd), at: f2(p.abT)
  };
}
const CULL_W = 790, CULL_H = 510;   // a touch wider than one guest's actual view
function snapshot() {
  const r = Math.round, pal = [];
  const ci = c => { let i = pal.indexOf(c); if (i < 0) { i = pal.length; pal.push(c); } return i; };
  const out = {
    t: 'snap', st: state, gm: gameMode, wave, ts: toSpawn + miniQueue, cl: f2(clearT), it: f2(intermission),
    te: teamEnergy, am: [...activeMods], nm: nextMods, sh: f2(shake), best, tsc: teamScore, pe: pvpEnd,
    ma: Object.keys(mastery).map(k => mastery[k].lv),
    pl: players.map(p => ({
      x: r(p.x), y: r(p.y), dx: f2(p.dx), dy: f2(p.dy), hp: r(p.hp), mh: maxHp(p), al: p.alive, g: p.gone ? 1 : 0,
      rv: f2(p.rev), w: f2(p.walk % 6.283), hu: p.hurt > 0 ? 1 : 0, sc: p.score, co: p.combo,
      nm: p.name, rd: p.ready, cs: p.slots[p.cur] ? netSlot(p.slots[p.cur]) : 0,
      cl: p.cls, tm: p.team, k: p.kills, d: p.deaths, gg: p.gg, rs: f2(p.respawn),
      sp: f2(Math.max(0, p.spawnProt)), sd: r(p.shield), sm: r(p.shieldMax), at: f2(p.abT), nsl: p.slots.length
    })),
    z: zombies.map(z => [z.id, z.boss ? 100 + BKEYS.indexOf(z.key) : ZKEYS.indexOf(z.type), r(z.x), r(z.y), z.r,
      f2(Math.max(0, z.hp / z.max)), f2(z.dx), f2(z.dy), f2(z.walk % 6.283),
      (z.elite ? 1 : 0) | (z.slow > 0 ? 2 : 0) | (z.burn > 0 ? 4 : 0) | (z.charging ? 8 : 0) | (z.ward ? 16 : 0)
      | (z.mini ? 32 : 0) | (z.flash > 0 ? 64 : 0),
      z.blinkT > 0 ? [r(z.bx), r(z.by)] : 0, z.ep ? EPKEYS.indexOf(z.ep) : -1]),
    mi: minions.map(m => [m.id, m.kind === 'drone' ? 0 : 1, r(m.x), r(m.y), f2(m.hp / m.max), f2(m.dx), f2(m.dy),
      f2(m.walk % 6.283), m.flash > 0 ? 1 : 0]),
    bu: bullets.map(b => [BKINDS.indexOf(b.kind), r(b.x), r(b.y), r(b.vx), r(b.vy), r(b.size), ci(b.color),
      b.slot && b.slot.rarity === 'rare' ? 1 : 0, f2(b.life)]),
    es: eshots.map(e => [r(e.x), r(e.y), r(e.vx), r(e.vy), e.r, EKINDS.indexOf(e.kind)]),
    be: beams.map(b => b.swing ? [2, r(b.x1), r(b.y1), b.r, ci(b.color), f2(b.life / b.max), f2(b.a), f2(b.arc)]
                      : b.ring ? [1, r(b.x1), r(b.y1), b.r, ci(b.color), f2(b.life / b.max)]
                               : [0, r(b.x1), r(b.y1), r(b.x2), r(b.y2), b.w, ci(b.color), f2(b.life / b.max)]),
    bo: bolts.map(b => [b.pts.map(q => [r(q[0]), r(q[1])]), ci(b.color), f2(b.life / b.max)]),
    ba: barricades.map(b => [b.x, b.y, f2(b.hp / b.max)]),
    br: barrels.filter(b => b.alive).map(b => [b.x, b.y]),
    pu: puddles.map(q => [r(q.x), r(q.y), q.r, f2(q.life)]),
    pk: pickups.map(k => [r(k.x), r(k.y), k.type === 'ammo' ? 0 : 1, f2(k.life)]),
    lo: loot.map(l => [r(l.x), r(l.y), l.item, f2(l.bob)]),
    sk: strikes.map(q => [r(q.x), r(q.y), f2(q.t), f2(q.max)]),
    md: meds.map(m => [r(m.x), r(m.y)]),
    tx: texts.map(q => [r(q.x), r(q.y), q.t, ci(q.color), f2(q.life)]),
    bn: banners.slice(0, 1).map(b => [b.text, b.color, b.big ? 1 : 0, f2(b.life)]),
    fd: feed.map(f => [f.text, f.color, f2(f.life)]),
    pa: particles.slice(guests.length > 2 ? -34 : -70).map(q => [r(q.x), r(q.y), r(q.size), ci(q.color), f2(q.life / q.max)]),
    dc: decalQueue.splice(0)
  };
  out.pal = pal;
  return out;
}
// Only ship what a guest can actually see. This is what keeps 8-player rooms
// from drowning in traffic when the screen is full of bullets.
function cullFor(base, px, py) {
  const near = (x, y) => Math.abs(x - px) < CULL_W && Math.abs(y - py) < CULL_H;
  return Object.assign({}, base, {
    z: base.z.filter(a => a[1] >= 100 || near(a[2], a[3])),
    bu: base.bu.filter(a => near(a[1], a[2])),
    es: base.es.filter(a => near(a[0], a[1])),
    pa: base.pa.filter(a => near(a[0], a[1])),
    mi: base.mi.filter(a => near(a[2], a[3]))
  });
}

/* guest side */
function guestStart(gm) {
  if (gm) gameMode = gm;
  mastery = {};
  for (const id in W_DEFS) mastery[id] = { lv: 0 };
  players = [];
  zombies = []; bullets = []; eshots = []; barricades = []; puddles = []; barrels = [];
  particles = []; pickups = []; loot = []; texts = []; banners = []; beams = []; bolts = [];
  strikes = []; meds = []; minions = []; feed = []; corpses = [];
  activeMods = new Set(); nextMods = [];
  setupMap();
  resetGround();
  state = 'syncing';
}
function guestSlot(a) {
  const [id, rarity, ammo, max, mods] = a;
  const def = rarity === 'legendary' ? LEGENDARY[id] : W_DEFS[id];
  if (!def) return makeSlot('m1911');
  return { id, rarity, def, name: (rarity === 'rare' ? 'Prime ' : '') + def.name,
           base: rarity === 'legendary' ? null : id, mods: mods || {},
           ammo: ammo < 0 ? Infinity : ammo, max: max < 0 ? Infinity : max };
}
function applySnap(S) {
  if (!mastery.m1911) for (const id in W_DEFS) mastery[id] = { lv: 0 };
  if (myIndex < 0 && typeof S.you === 'number') myIndex = S.you;
  if (myIndex < 0) return;
  if (S.gm && S.gm !== gameMode) { gameMode = S.gm; setupMap(); resetGround(); }
  const pal = S.pal || [];
  state = S.st; wave = S.wave; toSpawn = S.ts; clearT = S.cl; intermission = S.it; teamEnergy = S.te;
  activeMods = new Set(S.am); nextMods = S.nm; shake = Math.min(SHAKE_MAX, S.sh); best = Math.max(best, S.best || 0);
  teamScore = S.tsc || [0, 0]; pvpEnd = S.pe || '';
  Object.keys(mastery).forEach((k, i) => { mastery[k].lv = S.ma[i] || 0; });

  while (players.length < S.pl.length) {
    const np = newPlayer(players.length);
    np.fresh = true;
    players.push(np);
  }
  players.length = S.pl.length;
  S.pl.forEach((q, i) => {
    const p = players[i];
    const self = i === myIndex;
    p.name = q.nm; p.gone = !!q.g; p.hp = q.hp; p.cls = cleanClass(q.cl); p.team = q.tm;
    p.rev = q.rv; p.hurt = q.hu ? .1 : 0; p.score = q.sc; p.combo = q.co; p.ready = q.rd;
    p.kills = q.k; p.deaths = q.d; p.gg = q.gg; p.respawn = q.rs; p.spawnProt = q.sp;
    p.shield = q.sd; p.shieldMax = q.sm; p.abT = q.at;
    const [body, head] = TEAMS() ? TEAM_COLORS[q.tm] : PLAYER_COLORS[i % PLAYER_COLORS.length];
    p.body = body; p.head = head;
    if (self && S.me) {
      const m = S.me;
      p.slots = m.sl.map(guestSlot); p.cur = m.cur; p.cash = m.ca; p.build = m.b; p.up = m.up;
      p.medCd = m.mc; p.chain = m.ch; p.chainT = m.ct; p.sel = m.se; p.msg = m.ms; p.msgT = m.ms ? 1 : 0;
      p.offers = m.of || []; p.rerolls = m.rr || 0; p.abCd = m.ab;
    } else {
      p.slots = q.cs ? [guestSlot(q.cs)] : []; p.cur = 0;
      p.up = p.up || {};
      p.up.armor = Math.max(0, Math.round((q.mh - (CLASSES[p.cls] || CLASSES.soldier).hp) / 22));
    }
    const revived = !p.alive && q.al;
    p.alive = q.al;
    p.tx = q.x; p.ty = q.y;
    const far = Math.hypot(q.x - p.x, q.y - p.y) > 150;
    if (p.fresh || far || revived || (self && (!p.alive || state !== 'play'))) { p.x = q.x; p.y = q.y; p.fresh = false; }
    if (!self) { p.dx = q.dx; p.dy = q.dy; p.walk = q.w; }
  });
  if (!players[myIndex]) return;

  const old = new Map(zombies.map(z => [z.id, z]));
  zombies = S.z.map(a => {
    const [id, ti, x, y, rr, hpk, dx, dy, walk, flags, blink, ep] = a;
    let z = old.get(id);
    if (!z) {
      const bossKey = ti >= 100 ? BKEYS[ti - 100] : null;
      const boss = bossKey ? BOSS_BY_KEY[bossKey] : null;
      const T = boss || ZT[ZKEYS[ti]] || ZT.walker;
      z = { id, type: boss ? 'boss' : ZKEYS[ti], boss: !!boss, key: bossKey || undefined,
            name: boss ? ((flags & 32) ? 'Lesser ' + boss.name.replace(/^The /, '') : boss.name) : '',
            body: T.body, head: T.head, shield: !!T.shield, bloat: !!T.bloat, necro: !!T.necro,
            x, y, wob: id % 7 };
    }
    Object.assign(z, { tx: x, ty: y, r: rr, hp: hpk, max: 1, dx, dy, walk, flash: (flags & 64) ? 1 : 0,
      elite: !!(flags & 1), slow: flags & 2 ? 1 : 0, burn: flags & 4 ? 1 : 0,
      charging: !!(flags & 8), ward: !!(flags & 16), mini: !!(flags & 32),
      ep: ep >= 0 ? EPKEYS[ep] : undefined, cdx: dx, cdy: dy,
      blinkT: blink ? 1 : 0, bx: blink ? blink[0] : 0, by: blink ? blink[1] : 0 });
    return z;
  });
  const oldM = new Map(minions.map(m => [m.id, m]));
  minions = (S.mi || []).map(a => {
    const [id, kind, x, y, hpk, dx, dy, walk, flash] = a;
    let m = oldM.get(id);
    if (!m) m = { id, kind: kind ? 'undead' : 'drone', x, y, r: kind ? 12 : 9, max: 1 };
    Object.assign(m, { tx: x, ty: y, hp: hpk, max: 1, dx, dy, walk, flash: flash ? 1 : 0 });
    return m;
  });

  bullets = S.bu.map(([k, x, y, vx, vy, size, c, rare, life]) =>
    ({ kind: BKINDS[k], x, y, vx, vy, size, color: pal[c], slot: { rarity: rare ? 'rare' : 'base' }, life }));
  eshots = S.es.map(([x, y, vx, vy, rr, k]) => ({ x, y, vx, vy, r: rr, kind: EKINDS[k] }));
  beams = S.be.map(b => b[0] === 2
    ? { swing: true, x1: b[1], y1: b[2], r: b[3], color: pal[b[4]], life: b[5], max: 1, a: b[6], arc: b[7] }
    : b[0] === 1
    ? { ring: true, x1: b[1], y1: b[2], r: b[3], color: pal[b[4]], life: b[5], max: 1 }
    : { x1: b[1], y1: b[2], x2: b[3], y2: b[4], w: b[5], color: pal[b[6]], life: b[7], max: 1 });
  bolts = S.bo.map(([pts, c, life]) => ({ pts, color: pal[c], life, max: 1 }));
  barricades = S.ba.map(([x, y, k]) => ({ x, y, hp: k, max: 1 }));
  barrels = S.br.map(([x, y]) => ({ x, y, r: 13, alive: true }));
  puddles = S.pu.map(([x, y, rr, life]) => ({ x, y, r: rr, life }));
  pickups = S.pk.map(([x, y, t, life]) => ({ x, y, type: t ? 'med' : 'ammo', life }));
  loot = S.lo.map(([x, y, item, bob]) => ({ x, y, item, bob, cool: 0 }));
  strikes = S.sk.map(([x, y, t, max]) => ({ x, y, t, max }));
  meds = S.md.map(([x, y]) => ({ x, y }));
  texts = S.tx.map(([x, y, t, c, life]) => ({ x, y, t, color: pal[c], life }));
  banners = S.bn.map(([text, color, big, life]) => ({ text, color, big: !!big, life }));
  feed = (S.fd || []).map(([text, color, life]) => ({ text, color, life }));
  particles = particles.filter(q => q.local).concat(
    S.pa.map(([x, y, size, c, a]) => ({ x, y, size, color: pal[c], life: a, max: 1, vx: 0, vy: 0 })));
  for (const d of S.dc || []) {
    if (d[0] === 0) splat(d[1], d[2], d[3], d[4]);
    else { g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.arc(d[1], d[2], d[3] * .45, 0, 6.283); g.fill(); }
  }
}
function guestSendInput() {
  const h = {};
  for (const a of ACTIONS) h[a] = held(CTRL[a]);
  const key = JSON.stringify(h);
  if (key !== lastHeldSent) { send({ t: 'held', h }); lastHeldSent = key; }
  for (const a of ACTIONS) if (tap(CTRL[a])) send({ t: 'tap', a });
  if (tap(['KeyP', 'Escape'])) send({ t: 'tap', a: 'pause' });
  if (tap(['KeyR'])) send({ t: 'tap', a: 'restart' });
}
function guestFrame(dt) {
  time += dt;
  const me = players[myIndex];
  if (state === 'play' && me && me.alive) {
    let mx = (held(CTRL.right) ? 1 : 0) - (held(CTRL.left) ? 1 : 0);
    let my = (held(CTRL.down) ? 1 : 0) - (held(CTRL.up) ? 1 : 0);
    const moving = !!(mx || my);
    if (moving) {
      const l = Math.hypot(mx, my); mx /= l; my /= l;
      me.dx = mx; me.dy = my; me.walk += dt * 12;
      const spd = pSpeed(me);
      me.x += mx * spd * dt; me.y += my * spd * dt;
      solid(me);
    }
    const ex = (me.tx ?? me.x) - me.x, ey = (me.ty ?? me.y) - me.y, e = Math.hypot(ex, ey);
    const k = moving ? (e > 40 ? Math.min(1, dt * 3) : 0) : Math.min(1, dt * 8);
    me.x += ex * k; me.y += ey * k;
  }
  const smooth = Math.min(1, dt * 15);
  for (const p of players) {
    if (p.gone || (p === me && p.alive && state === 'play')) continue;
    if (p.tx !== undefined) { p.x += (p.tx - p.x) * smooth; p.y += (p.ty - p.y) * smooth; }
  }
  for (const z of zombies) { z.x += (z.tx - z.x) * smooth; z.y += (z.ty - z.y) * smooth; }
  for (const m of minions) { m.x += (m.tx - m.x) * smooth; m.y += (m.ty - m.y) * smooth; }
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.kind === 'flame') b.size += dt * 34;
    else if ((b.kind === 'rocket' || b.kind === 'homing') && Math.random() < .7)
      particles.push({ x: b.x, y: b.y, vx: rand(-20, 20), vy: rand(-20, 20), life: .35, max: .35, size: 5, color: '#8a8478', local: 1 });
    else if (b.kind === 'plasma' && Math.random() < .8)
      particles.push({ x: b.x, y: b.y, vx: rand(-30, 30), vy: rand(-30, 30), life: .3, max: .3, size: 4, color: b.color, local: 1 });
  }
  for (const e of eshots) {
    e.x += e.vx * dt; e.y += e.vy * dt;
    if (Math.random() < .35) {
      const col = (ESHOT[e.kind] || ESHOT.fire)[2];
      particles.push({ x: e.x, y: e.y, vx: rand(-15, 15), vy: rand(-15, 15), life: .3, max: .3, size: 5, color: col, local: 1 });
    }
  }
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .9; q.vy *= .9; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  if (particles.length > 700) particles.splice(0, particles.length - 700);
  for (const q of strikes) q.t = Math.max(0, q.t - dt);
  if (players.length && (state === 'play' || state === 'shop' || state === 'paused')) updateCam(dt, false);
}

/* ---------------- menu wiring ---------------- */
for (const id of CLASS_IDS) {
  const o = document.createElement('option');
  o.value = id; o.textContent = CLASSES[id].name;
  classEl.appendChild(o);
}
function showClassNote() {
  const C = CLASSES[myClass];
  classNote.textContent = `${C.name}: ${C.desc}`;
}
classEl.value = myClass;
showClassNote();
classEl.addEventListener('change', () => {
  myClass = cleanClass(classEl.value);
  showClassNote();
  if (mode === 'guest' && conn) send({ t: 'class', c: myClass });
  if (mode === 'host') {
    const r = roster.find(x => x.idx === 0);
    if (r) r.cls = myClass;
    broadcastLobby(); lobbyText();
  }
});
function syncModeButtons() {
  for (const b of modeRow.querySelectorAll('button')) b.classList.toggle('on', b.dataset.gm === gameMode);
}
for (const b of modeRow.querySelectorAll('button')) {
  b.addEventListener('click', e => {
    e.currentTarget.blur();
    if (mode === 'guest') { setNet('Only the host picks the mode.'); return; }
    gameMode = b.dataset.gm;
    syncModeButtons();
    if (mode === 'host') { broadcastLobby(); lobbyText(); }
    else setNet(`${GAME_MODES[gameMode].name}: ${GAME_MODES[gameMode].blurb}`);
    cv.focus();
  });
}
syncModeButtons();
document.getElementById('bSolo').addEventListener('click', e => {
  e.currentTarget.blur(); cleanupNet(); setNet(''); syncModeButtons(); startGame(); cv.focus();
});
document.getElementById('bHost').addEventListener('click', e => { e.currentTarget.blur(); hostOnline(); cv.focus(); });
document.getElementById('bJoin').addEventListener('click', e => { e.currentTarget.blur(); joinOnline(); cv.focus(); });

// Runs off the render loop so a backgrounded tab still reports in.
setInterval(() => {
  if (mode === 'guest' && conn && conn.open) { send({ t: 'ping' }); lastPing = performance.now(); }
}, 2000);

/* ---------------- loop ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  menu.style.display = state === 'title' ? 'flex' : 'none';
  modeRow.style.display = mode === 'guest' ? 'none' : 'flex';

  if (state === 'lost') {
    if (tap(['KeyR'])) backToMenu();
  } else if (mode === 'guest') {
    if (state !== 'title' && myIndex >= 0 && players[myIndex]) { guestSendInput(); guestFrame(dt); }
  } else {
    dropDeadGuests();
    hostKeys();
    const remote = Object.values(netTaps);
    const wantPause = tap(['KeyP', 'Escape']) || remote.some(t => t.pause);
    const wantRestart = tap(['KeyR']) || remote.some(t => t.restart);
    if (state === 'title') {
      if (tap(['Space', 'Enter', 'NumpadEnter'])) {
        if (mode === 'host') {
          if (guests.length) startGame();
          else setNet(`Room code: ${roomCode}. Nobody has joined yet. Share the code, or press Play solo.`);
        } else { setNet(''); startGame(); }
      }
    } else if (state === 'play') {
      if (wantPause) state = 'paused';
      else update(dt);
    } else if (state === 'shop') {
      if (mode === 'host' && tap(['KeyH'])) for (const q of players) if (!q.gone) q.ready = true;
      shopInput(dt);
      updateFx(dt);
    } else if (state === 'paused') {
      if (wantPause) state = 'play';
      else if (wantRestart) startGame();
    } else if (state === 'over') {
      updateFx(dt);
      if (wantRestart) startGame();
    }
    for (const k in netTaps) netTaps[k] = {};
    if (mode === 'host' && guests.length && state !== 'title') {
      snapAcc += dt;
      if (snapAcc >= (guests.length > 5 ? .085 : guests.length > 2 ? .066 : .05)) {
        snapAcc = 0;
        const base = snapshot();
        for (const gst of guests) {
          const dc = gst.conn.dataChannel;
          if (dc && dc.bufferedAmount > 300000) continue;   // this guest is lagging; skip a frame for them
          const pl = players[gst.idx];
          const view = pl ? cullFor(base, pl.x, pl.y) : base;
          sendTo(gst.conn, Object.assign(view, { you: gst.idx, me: pl ? detailFor(pl) : null }));
        }
      }
    }
  }
  draw();
  for (const k in pressed) delete pressed[k];
  requestAnimationFrame(loop);
}
setupMap();
resetGround();
cv.focus();
requestAnimationFrame(loop);
</script>
