<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockrot: two-player zombie survival</title>
<style>
  :root { --bg:#16140f; --ink:#e6dfc8; --muted:#8f8870; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--ink);
    font-family:"Trebuchet MS", "Segoe UI", sans-serif; overflow:hidden; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  canvas { display:block; border:3px solid #000; outline:2px solid #3a362a; }
  #bar { font-size:13px; color:var(--muted); display:flex; gap:18px; }
  #bar a { color:var(--ink); }
  #bar a:focus-visible { outline:2px solid #f2b134; outline-offset:2px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1200" height="760" tabindex="0" aria-label="Blockrot game"></canvas>
  <div id="bar"><a href="index.html">Back to study files</a><span>P pause · R restart</span></div>
</div>
<script>
"use strict";
/* =====================================================================
   BLOCKROT v2 — tweakable data lives in the CONFIG section just below.
   ===================================================================== */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1200, H = 760, AY = 52;            // screen size, HUD height
const WW = 2400, WH = 1600, CELL = 40;       // world size, grid cell
const GW = WW / CELL, GH = WH / CELL;
const ZMIN = 0.65;                           // how far the camera can zoom out

/* ---------------- CONFIG: weapons ---------------- */
// kind: bullet | rocket | plasma | homing | flame | laser | tesla
const W_DEFS = {
  pistol:  { name:'Pistol',        kind:'bullet', rate:.28, dmg:25, speed:760, spread:.03, ammo:Infinity, unlock:1, color:'#fff3c4' },
  smg:     { name:'SMG',           kind:'bullet', rate:.08, dmg:14, speed:800, spread:.12, ammo:260, unlock:2, color:'#fff3c4' },
  shotgun: { name:'Shotgun',       kind:'bullet', rate:.70, dmg:18, speed:660, spread:.30, pellets:7, life:.45, ammo:50, unlock:3, color:'#ffd9a0' },
  laser:   { name:'Laser Rifle',   kind:'laser',  rate:.14, dmg:11, range:620, width:3, ammo:180, unlock:4, color:'#ff4d6d' },
  rockets: { name:'Rockets',       kind:'rocket', rate:1.0, dmg:30, speed:450, blast:100, blastDmg:130, ammo:14, unlock:6, color:'#e6dfc8' },
  flamer:  { name:'Flamethrower',  kind:'flame',  rate:.04, dmg:5,  speed:380, spread:.22, burn:12, ammo:400, unlock:7, color:'#ff9a3c' },
  plasma:  { name:'Plasma Cannon', kind:'plasma', rate:.90, dmg:55, speed:320, size:11, blast:70, blastDmg:40, ammo:20, unlock:8, color:'#7df9ff' },
  tesla:   { name:'Tesla Coil',    kind:'tesla',  rate:.45, dmg:30, range:300, chains:4, ammo:60, unlock:9, color:'#b8c8ff' }
};
const LEGENDARY = {
  voidlance:   { name:'Void Lance',      kind:'laser',  rate:.40, dmg:70, range:1400, width:10, wallpierce:true, ammo:40, color:'#b36bff' },
  starbreaker: { name:'Starbreaker',     kind:'plasma', rate:.70, dmg:60, speed:360, size:13, blast:110, blastDmg:80, pellets:3, spread:.25, ammo:30, color:'#ffe066' },
  hive:        { name:'Hive Queen',      kind:'homing', rate:.50, dmg:30, speed:380, blast:55, blastDmg:40, pellets:4, spread:.6, ammo:40, color:'#ffb000' },
  stormcaller: { name:'Stormcaller',     kind:'tesla',  rate:.30, dmg:45, range:380, chains:9, ammo:70, color:'#6ff0ff' },
  dragon:      { name:"Dragon's Breath", kind:'flame',  rate:.03, dmg:9,  speed:480, spread:.30, burn:30, ammo:600, color:'#ff4a1c' }
};
const RARITY_COLOR = { base:'#e6dfc8', rare:'#5aa9ff', legendary:'#ff9f1a' };

/* ---------------- CONFIG: team mastery ---------------- */
// Kills count toward a weapon's mastery only while BOTH players are alive and
// holding that same weapon (a Prime version counts as the same weapon).
// Kills must keep coming within CHAIN_WINDOW seconds or the chain resets.
const MASTERY_NEED = [12, 25, 40];
const CHAIN_WINDOW = 3;
const MASTERY_PERKS = [
  'Quickdraw: 33% faster fire rate',
  'Hardened: +35% damage, shots pierce one more enemy',
  'Dual wield: double shots, +50% ammo'
];

/* ---------------- CONFIG: enemies ---------------- */
// from = first wave it can appear, weight = how common it is
const ZT = {
  walker:  { hp:50,  speed:[55,75],   r:15, dmg:10, body:'#5f8a45', head:'#86b066', pts:10, from:1, weight:10 },
  crawler: { hp:18,  speed:[140,165], r:9,  dmg:6,  body:'#6b5a3a', head:'#a08660', pts:8,  from:2, weight:5 },
  runner:  { hp:30,  speed:[125,145], r:12, dmg:8,  body:'#8d9a45', head:'#b9c46a', pts:15, from:3, weight:5 },
  spitter: { hp:60,  speed:[45,55],   r:14, dmg:8,  body:'#4d7a2a', head:'#b6e04a', pts:25, from:3, weight:3, ranged:'acid' },
  imp:     { hp:90,  speed:[45,60],   r:15, dmg:12, body:'#9b2f22', head:'#d4533c', pts:25, from:4, weight:3, ranged:'fire' },
  bloater: { hp:80,  speed:[40,50],   r:20, dmg:0,  body:'#7b8a3e', head:'#c2c96b', pts:30, from:4, weight:2, bloat:true },
  shield:  { hp:120, speed:[45,55],   r:16, dmg:14, body:'#51555c', head:'#86b066', pts:35, from:5, weight:3, shield:true },
  splitter:{ hp:90,  speed:[55,65],   r:17, dmg:12, body:'#6a3f6e', head:'#a86bb0', pts:30, from:6, weight:3, split:true },
  brute:   { hp:420, speed:[34,44],   r:24, dmg:25, body:'#3f5c33', head:'#5f7f4c', pts:60, from:6, weight:1.5 },
  necro:   { hp:110, speed:[40,50],   r:15, dmg:8,  body:'#2e2a3a', head:'#a9f0c8', pts:50, from:7, weight:1.2, necro:true },
  ghoul:   { hp:70,  speed:[70,80],   r:13, dmg:14, body:'#3d4a55', head:'#9fb3c2', pts:30, from:8, weight:3, dash:true }
};
const BOSS_EVERY = 5;
const BOSSES = [
  { key:'brood',  name:'The Broodmother', hp:2600, speed:42, r:40, dmg:30, body:'#5a4a2e', head:'#c7a86b' },
  { key:'pyre',   name:'The Pyre King',   hp:2300, speed:55, r:34, dmg:26, body:'#7a1c12', head:'#ff7a2f' },
  { key:'wraith', name:'The Wraith Lord', hp:2100, speed:72, r:32, dmg:24, body:'#252a3a', head:'#9ad7ff' }
];

/* ---------------- CONFIG: map ---------------- */
// [x, y, width, height] in grid cells (1 cell = 40px). Map is 60 x 40 cells.
const OB_GRID = [
  [10,8,4,1],[46,8,4,1],[10,31,4,1],[46,31,4,1],
  [28,17,1,6],[31,17,1,6],
  [20,12,1,4],[39,12,1,4],[20,24,1,4],[39,24,1,4],
  [6,18,2,4],[52,18,2,4],
  [24,4,3,1],[33,4,3,1],[24,35,3,1],[33,35,3,1],
  [4,4,1,4],[5,4,3,1],[55,4,1,4],[52,4,3,1],
  [4,32,1,4],[5,35,3,1],[55,32,1,4],[52,35,3,1],
  [14,19,3,2],[43,19,3,2],
  [25,27,2,2],[33,27,2,2],[25,11,2,2],[33,11,2,2]
];
const BARREL_SPOTS = [[700,500],[1700,500],[700,1100],[1700,1100],[1200,300],
                      [1200,1350],[420,640],[1980,640],[960,800],[1440,800]];
const GATES = [
  {x:600,y:-40,jx:1},{x:1800,y:-40,jx:1},{x:600,y:WH+40,jx:1},{x:1800,y:WH+40,jx:1},
  {x:-40,y:400,jy:1},{x:-40,y:1200,jy:1},{x:WW+40,y:400,jy:1},{x:WW+40,y:1200,jy:1}
];
const OBST = OB_GRID.map(([x,y,w,h]) => ({ x:x*CELL, y:y*CELL, w:w*CELL, h:h*CELL }));

/* ---------------- setup ---------------- */
function fit() {
  const s = Math.min((innerWidth - 16) / W, (innerHeight - 40) / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

const keys = {}, pressed = {};
const CTRL = [
  { up:['KeyW'], down:['KeyS'], left:['KeyA'], right:['KeyD'],
    fire:['Space'], swap:['KeyQ'], build:['KeyE'] },
  { up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight'],
    fire:['Enter','NumpadEnter','Numpad0'], swap:['ShiftRight','Period'], build:['Slash','Numpad1'] }
];
const BLOCK = new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Slash','Enter','Period','Quote']);
addEventListener('keydown', e => {
  if (BLOCK.has(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') state = 'paused'; });
const held = l => l.some(k => keys[k]);
const tap  = l => l.some(k => pressed[k]);

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const pick = arr => arr[Math.random() * arr.length | 0];
const inRect = (p, o) => p.x > o.x && p.x < o.x + o.w && p.y > o.y && p.y < o.y + o.h;
function norm(x, y) { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; }

/* ---------------- grid + flow field ---------------- */
const blocked = new Uint8Array(GW * GH);
for (const [x, y, w, h] of OB_GRID)
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) blocked[j * GW + i] = 1;
const isBlockedAt = (px, py) => {
  const cx = Math.floor(px / CELL), cy = Math.floor(py / CELL);
  return cx < 0 || cy < 0 || cx >= GW || cy >= GH || blocked[cy * GW + cx] === 1;
};
const field = new Float32Array(GW * GH);
const queue = new Int32Array(GW * GH);
let fieldT = 0;
function computeField() {
  field.fill(1e9);
  let h = 0, t = 0;
  for (const p of players) {
    if (!p.alive) continue;
    const i = clamp(Math.floor(p.y / CELL), 0, GH - 1) * GW + clamp(Math.floor(p.x / CELL), 0, GW - 1);
    if (field[i] !== 0) { field[i] = 0; queue[t++] = i; }
  }
  while (h < t) {
    const i = queue[h++], x = i % GW, y = (i / GW) | 0, d = field[i] + 1;
    if (x > 0)      { const j = i - 1;  if (!blocked[j] && field[j] > d) { field[j] = d; queue[t++] = j; } }
    if (x < GW - 1) { const j = i + 1;  if (!blocked[j] && field[j] > d) { field[j] = d; queue[t++] = j; } }
    if (y > 0)      { const j = i - GW; if (!blocked[j] && field[j] > d) { field[j] = d; queue[t++] = j; } }
    if (y < GH - 1) { const j = i + GW; if (!blocked[j] && field[j] > d) { field[j] = d; queue[t++] = j; } }
  }
}
function flowDir(z, t) {
  const cx = Math.floor(z.x / CELL), cy = Math.floor(z.y / CELL);
  if (cx < 0 || cy < 0 || cx >= GW || cy >= GH)
    return norm(clamp(z.x, CELL * 2, WW - CELL * 2) - z.x, clamp(z.y, CELL * 2, WH - CELL * 2) - z.y);
  const here = field[cy * GW + cx];
  if (here <= 1 || here >= 1e9) return norm(t.x - z.x, t.y - z.y);
  let best = here, bx = 0, by = 0;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
    if (!ox && !oy) continue;
    const nx = cx + ox, ny = cy + oy;
    if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
    if (ox && oy && (blocked[cy * GW + nx] || blocked[ny * GW + cx])) continue;
    const v = field[ny * GW + nx];
    if (v < best) { best = v; bx = ox; by = oy; }
  }
  if (best === here) return norm(t.x - z.x, t.y - z.y);
  return norm((cx + bx + .5) * CELL - z.x, (cy + by + .5) * CELL - z.y);
}

/* ---------------- ground + minimap layers ---------------- */
const gnd = document.createElement('canvas'); gnd.width = WW; gnd.height = WH;
const g = gnd.getContext('2d');
function resetGround() {
  g.fillStyle = '#2b2a22'; g.fillRect(0, 0, WW, WH);
  for (let y = 0; y < WH; y += CELL) for (let x = 0; x < WW; x += CELL) {
    const v = Math.random() * 9 | 0;
    g.fillStyle = `rgb(${58 + v},${57 + v},${46 + v})`;
    g.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
  }
  for (let i = 0; i < 14; i++) {           // dirt patches
    g.fillStyle = 'rgba(70,52,30,.25)';
    const px = rand(0, WW), py = rand(0, WH);
    for (let k = 0; k < 18; k++) g.fillRect(px + rand(-120, 120), py + rand(-80, 80), CELL, CELL);
  }
  g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 1.5;
  for (let i = 0; i < 160; i++) {
    let x = rand(0, WW), y = rand(0, WH);
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 4; k++) { x += rand(-22, 22); y += rand(-22, 22); g.lineTo(x, y); }
    g.stroke();
  }
  for (const gt of GATES) {
    for (let k = -3; k < 3; k++) {
      g.fillStyle = k % 2 ? '#c9a227' : '#1a1a14';
      if (gt.jx) g.fillRect(gt.x + k * 20, gt.y < 0 ? 0 : WH - 10, 20, 10);
      else g.fillRect(gt.x < 0 ? 0 : WW - 10, gt.y + k * 20, 10, 20);
    }
  }
}
function splat(x, y, size, color) {
  g.fillStyle = color;
  for (let i = 0; i < 7; i++) {
    const s = rand(size * 0.2, size * 0.6);
    g.fillRect(x + rand(-size, size) - s / 2, y + rand(-size, size) - s / 2, s, s);
  }
}
const MMW = 180, MMH = 120, MMS = MMW / WW;
const mm = document.createElement('canvas'); mm.width = MMW; mm.height = MMH;
(() => {
  const m = mm.getContext('2d');
  m.fillStyle = 'rgba(20,19,14,.85)'; m.fillRect(0, 0, MMW, MMH);
  m.fillStyle = '#77745f';
  for (const o of OBST) m.fillRect(o.x * MMS, o.y * MMS, Math.max(1, o.w * MMS), Math.max(1, o.h * MMS));
})();

/* ---------------- state ---------------- */
let state = 'title', wave = 0, time = 0, shake = 0;
let players = [], zombies = [], bullets = [], eshots = [], barricades = [], puddles = [];
let barrels = [], particles = [], pickups = [], loot = [], texts = [], banners = [], beams = [], bolts = [];
let toSpawn = 0, spawnT = 0, intermission = 0, bossPending = false, bossDelay = 0;
let camX = WW / 2, camY = WH / 2, zoom = ZMIN;
let mastery = {};
let best = 0;
try { best = +localStorage.getItem('blockrot-best') || 0; } catch (e) {}

function newPlayer(i) {
  return { i, x: i ? 1280 : 1120, y: 1100, r: 14, hp: 100, dx: 0, dy: -1, speed: 200,
    slots: [], cur: 0, cd: 0, alive: true, build: 2, score: 0, combo: 0, comboT: 0,
    hurt: 0, rev: 0, walk: 0,
    body: i ? '#2f8fa0' : '#c98a1e', head: i ? '#5fc6d6' : '#f2b134', name: i ? 'P2' : 'P1' };
}

function makeSlot(id, rarity = 'base') {
  const def = rarity === 'legendary' ? LEGENDARY[id] : W_DEFS[id];
  const s = { id, rarity, def, name: (rarity === 'rare' ? 'Prime ' : '') + def.name,
              base: rarity === 'legendary' ? null : id };
  s.max = maxAmmo(s); s.ammo = s.max;
  return s;
}
function maxAmmo(s) {
  let m = s.def.ammo;
  if (m === Infinity) return m;
  if (s.rarity === 'rare') m *= 1.5;
  if (s.base && mastery[s.base].lv >= 3) m *= 1.5;
  return Math.round(m);
}
function stats(s) {
  const d = s.def, lv = s.base ? mastery[s.base].lv : 0;
  let dmg = d.dmg, rate = d.rate, pierce = d.pierce || 0, blastMul = 1;
  if (s.rarity === 'rare') { dmg *= 1.5; rate *= .8; pierce += 1; }
  if (lv >= 1) rate *= .75;
  if (lv >= 2) { dmg *= 1.35; pierce += 1; blastMul = 1.25; }
  return { dmg, rate, pierce, blastMul, dual: lv >= 3, lv, mult: dmg / d.dmg };
}

function banner(text, color = '#e6dfc8', big = false) { banners.push({ text, color, big, life: big ? 3 : 2.4 }); }
function floatText(x, y, t, color = '#fff') { texts.push({ x, y, t, color, life: 1 }); }
function burst(x, y, color, n, spd = 160, size = 4) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.283), s = rand(spd * .3, spd), life = rand(.25, .6);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, size: rand(size * .5, size), color });
  }
}

function startGame() {
  state = 'play'; wave = 0; time = 0;
  mastery = {};
  for (const id in W_DEFS) mastery[id] = { lv: 0, chain: 0, t: 0 };
  players = [newPlayer(0), newPlayer(1)];
  zombies = []; bullets = []; eshots = []; barricades = []; puddles = [];
  particles = []; pickups = []; loot = []; texts = []; banners = []; beams = []; bolts = [];
  bossPending = false;
  resetGround(); nextWave();
  updateCam(0, true);
}

function nextWave() {
  wave++;
  const boss = wave % BOSS_EVERY === 0;
  toSpawn = boss ? 6 + wave * 2 : 8 + wave * 5;
  spawnT = 1.2; intermission = 0;
  for (const p of players) {
    if (!p.alive) { p.alive = true; p.hp = 50; p.hurt = 1; }
    else p.hp = Math.min(100, p.hp + 25);
    p.build = Math.min(6, p.build + 2);
    const baseCount = p.slots.filter(s => s.rarity === 'base').length;
    let ins = baseCount;
    for (const id in W_DEFS) {
      if (W_DEFS[id].unlock <= wave && !p.slots.some(s => s.rarity === 'base' && s.id === id))
        p.slots.splice(ins++, 0, makeSlot(id));
    }
    for (const s of p.slots) {
      if (s.rarity === 'base') s.ammo = s.max;
      else s.ammo = Math.min(s.max, s.ammo + Math.ceil(s.max / 2));
    }
  }
  barrels = BARREL_SPOTS.map(([x, y]) => ({ x, y, r: 13, alive: true }))
    .filter(b => players.every(p => dist(p, b) > 40));
  if (boss) {
    bossPending = true; bossDelay = 3;
    banner('Wave ' + wave + ': boss incoming', '#e2735f', true);
  } else banner('Wave ' + wave, '#e6dfc8', true);
  for (const id in W_DEFS) {
    if (W_DEFS[id].unlock === wave && wave > 1)
      banner('New weapon: ' + W_DEFS[id].name, '#f2d27a');
  }
}

function farGate() {
  const far = GATES.filter(gt => players.every(p => dist(p, gt) > 650));
  return pick(far.length ? far : GATES);
}
function makeZombie(type, x, y, inside) {
  const T = ZT[type], scale = 1 + (wave - 1) * .09;
  return {
    type, x, y, r: T.r, hp: T.hp * scale, max: T.hp * scale,
    speed: rand(...T.speed) * (1 + wave * .012), dmg: T.dmg, body: T.body, head: T.head, pts: T.pts,
    ranged: T.ranged, bloat: T.bloat, shield: T.shield, split: T.split, necro: T.necro, dash: T.dash,
    atk: 0, shoot: rand(1.5, 3), heal: 3, dcd: rand(1, 3), dashT: 0,
    inside, wob: rand(0, 6.28), flash: 0, dx: 0, dy: 1, walk: 0, burn: 0, burnDps: 0
  };
}
function spawnZombie() {
  const pool = Object.keys(ZT).filter(k => ZT[k].from <= wave);
  let tot = pool.reduce((a, k) => a + ZT[k].weight, 0), r = Math.random() * tot, type = pool[0];
  for (const k of pool) { r -= ZT[k].weight; if (r <= 0) { type = k; break; } }
  const gt = farGate();
  zombies.push(makeZombie(type, gt.x + (gt.jx ? rand(-60, 60) : 0), gt.y + (gt.jy ? rand(-60, 60) : 0), false));
}
function spawnBoss() {
  const idx = wave / BOSS_EVERY - 1, B = BOSSES[idx % BOSSES.length];
  const gt = farGate();
  const hp = B.hp * (1 + wave * .08) * (1 + idx * .35);
  zombies.push({
    type: 'boss', key: B.key, boss: true, name: B.name, x: gt.x, y: gt.y, r: B.r,
    hp, max: hp, speed: B.speed, dmg: B.dmg, body: B.body, head: B.head, pts: 1000,
    atk: 0, t1: 3, t2: 2, blinkT: 0, inside: false, wob: 0, flash: 0, dx: 0, dy: 1, walk: 0, burn: 0, burnDps: 0
  });
  banner(B.name + ' has arrived', '#e2735f', true);
  shake = 12;
}

/* ---------------- physics ---------------- */
function pushOut(e, rx, ry, rw, rh) {
  const cx = clamp(e.x, rx, rx + rw), cy = clamp(e.y, ry, ry + rh);
  const dx = e.x - cx, dy = e.y - cy, d2 = dx * dx + dy * dy;
  if (d2 >= e.r * e.r) return false;
  if (d2 === 0) {
    const l = e.x - rx, rr = rx + rw - e.x, t = e.y - ry, b = ry + rh - e.y, m = Math.min(l, rr, t, b);
    if (m === l) e.x = rx - e.r; else if (m === rr) e.x = rx + rw + e.r;

/* ---------------- player actions ---------------- */
function switchNext(p) {

  for (let k = 1; k <= n; k++) {
    const j = (p.cur + k) % n;
    if (p.slots[j].ammo > 0) { p.cur = j; return; }
  }
}

function fire(p) {
  const s = p.slots[p.cur];

  const st = stats(s);
  p.cd = st.rate;
  if (s.ammo !== Infinity) s.ammo--;
  const a = Math.atan2(p.dy, p.dx);
  for (const off of st.dual ? [-9, 9] : [0]) {
    const ox = p.x + p.dx * 18 - p.dy * off, oy = p.y - 4 + p.dy * 18 + p.dx * off;
    shoot(p, s, st, ox, oy, a);
    particles.push({ x: ox + p.dx * 6, y: oy + p.dy * 6, vx: 0, vy: 0, life: .05, max: .05, size: 9, color: s.def.color });
  }
  if (s.def.kind === 'rocket' || s.def.kind === 'plasma') shake = Math.max(shake, 3);
  if (s.ammo <= 0) { floatText(p.x, p.y - 34, s.name + ' empty', '#f2d27a'); switchNext(p); }
}

function shoot(p, s, st, x, y, a) {

  if (d.kind === 'tesla') return arc(p, s, st, x, y, a);
  if (d.kind === 'flame') {
    for (let k = 0; k < 2; k++) {
      const aa = a + rand(-d.spread, d.spread), sp = d.speed * rand(.75, 1);
      bullets.push({ kind: 'flame', x, y, vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp, dmg: st.dmg,
        owner: p, slot: s, life: .42, pierce: 99, hit: new Set(), size: 5, color: d.color, burn: d.burn * st.mult });
    }
    return;
  }
  const n = d.pellets || 1;
  for (let k = 0; k < n; k++) {
    const aa = (n > 1 && d.kind !== 'bullet') ? a + (k - (n - 1) / 2) * d.spread
                                              : a + rand(-(d.spread || 0), d.spread || 0);
    const sp = d.speed * (d.kind === 'bullet' ? rand(.92, 1) : 1);
    bullets.push({
      kind: d.kind, x, y, vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp, dmg: st.dmg, owner: p, slot: s,
      life: d.kind === 'bullet' ? (d.life || .9) : 2.5,
      blast: (d.blast || 0) * st.blastMul, blastDmg: (d.blastDmg || 0) * st.mult,
      pierce: d.kind === 'plasma' ? 99 : st.pierce, hit: new Set(),

function beam(p, s, st, x, y, a) {
  const d = s.def, dx = Math.cos(a), dy = Math.sin(a);

    const px = x + dx * t, py = y + dy * t;

  }

    if (z.dead) continue;
    const rx = z.x - x, ry = z.y - y, t = rx * dx + ry * dy;
    if (t > 0 && t < len && Math.abs(rx * dy - ry * dx) < z.r + w) hits.push(z);
  }
  for (const z of hits) damage(z, st.dmg, p, s, dx, dy, true);
  for (const b of barrels) {
    if (!b.alive) continue;
    const rx = b.x - x, ry = b.y - y, t = rx * dx + ry * dy;
    if (t > 0 && t < len && Math.abs(rx * dy - ry * dx) < b.r + w) blowBarrel(b, p, s);
  }

function zig(a, b) {

  for (let i = 1; i < 6; i++) {

    pts.push([a.x + (b.x - a.x) * t + rand(-9, 9), a.y + (b.y - a.y) * t + rand(-9, 9)]);
  }

    if (z.dead) continue;
    const rx = z.x - x, ry = z.y - y, dd = Math.hypot(rx, ry) || 1;
    if (dd < bd && (rx * dx + ry * dy) / dd > .55) { first = z; bd = dd; }
  }
  if (!first) {
    bolts.push({ pts: zig({ x, y }, { x: x + dx * 70, y: y + dy * 70 }), color: d.color, life: .08, max: .08 });
    return;
  }

    damage(cur, dmg, p, s, cur.x - from.x, cur.y - from.y, true);
    dmg *= .85;

function build(p) {
  if (p.build <= 0) return;
  const tx = p.x + p.dx * 40, ty = p.y + p.dy * 40;
  const gx = Math.floor(tx / CELL) * CELL, gy = Math.floor(ty / CELL) * CELL;
  if (isBlockedAt(gx + 1, gy + 1)) return;
  if (barricades.some(b => b.x === gx && b.y === gy)) return;
  const touches = e => Math.hypot(e.x - clamp(e.x, gx, gx + CELL), e.y - clamp(e.y, gy, gy + CELL)) < e.r;
  if (players.some(q => q.alive && touches(q)) || zombies.some(touches) || barrels.some(b => b.alive && touches(b))) return;
  barricades.push({ x: gx, y: gy, hp: 180, max: 180 });
  p.build--;
  burst(gx + 20, gy + 20, '#a07a45', 6, 80);
}

function isDown(p) {
  if (p.hp > 0) return;
  p.hp = 0; p.alive = false; p.rev = 0; p.combo = 0;
  banner(p.name + ' is down. Stand next to them to revive', '#e2735f');
  if (players.every(q => !q.alive)) gameOver();
}
function hurt(p, d) {
  if (!p.alive || p.hurt > 0) return;
  p.hp -= d; p.hurt = .3; shake = Math.max(shake, 5);
  burst(p.x, p.y, '#b8322a', 6);
  isDown(p);
}
function hurtDot(p, d) {

  p.hp -= d;
  isDown(p);

/* ---------------- damage, kills, mastery ---------------- */
function syncWeapon() {
  const [a, b] = players;
  if (!a.alive || !b.alive) return null;
  const sa = a.slots[a.cur], sb = b.slots[b.cur];
  return sa && sb && sa.base && sa.base === sb.base ? sa.base : null;
}

function damage(z, d, owner, slot, kx, ky, bypass) {
  if (z.dead) return;
  if (z.shield && !bypass) {
    const s = Math.hypot(kx, ky) || 1;
    if ((kx / s) * z.dx + (ky / s) * z.dy < -.35) {
      d *= .2;
      burst(z.x + z.dx * z.r, z.y + z.dy * z.r, '#c9ccd2', 2, 90, 3);
    }
  }
  z.hp -= d; z.flash = .08;
  if (!z.boss) {
    const s = Math.hypot(kx, ky) || 1, push = z.type === 'brute' ? 1 : 3;
    z.x += kx / s * push; z.y += ky / s * push;
  }
  if (Math.random() < .5) burst(z.x, z.y, '#7a1f18', 2, 120, 3);
  if (z.hp <= 0) kill(z, owner, slot);
}

  if (owner) {
    owner.combo++; owner.comboT = 2.2;
    const pts = z.pts * Math.min(owner.combo, 10);
    owner.score += pts;
    floatText(z.x, z.y - 24, '+' + pts, owner.head);
    if (slot && slot.base && syncWeapon() === slot.base) {
      const m = mastery[slot.base];
      if (m.lv < 3) {
        m.chain++; m.t = CHAIN_WINDOW;
        if (m.chain >= MASTERY_NEED[m.lv]) {
          m.lv++; m.chain = 0;
          banner(`${W_DEFS[slot.base].name} mastery ${'I'.repeat(m.lv)}: ${MASTERY_PERKS[m.lv - 1]}`, '#f2d27a', true);
          for (const p of players) {
            burst(p.x, p.y, '#f2d27a', 20, 220, 5);
            for (const s of p.slots) if (s.base === slot.base) { const old = s.max; s.max = maxAmmo(s); if (s.max !== Infinity) s.ammo += s.max - old; }
          }
        }
      }
    }
  }

  burst(z.x, z.y, z.body, z.boss ? 40 : 10, z.boss ? 300 : 180, z.boss ? 9 : 5);
  if (z.bloat) bloatBoom(z);
  if (z.split) for (let k = 0; k < 2; k++) newZ.push(makeZombie('crawler', z.x + rand(-12, 12), z.y + rand(-12, 12), true));
  if (z.boss) { bossDeath(z); return; }
  const r = Math.random();
  if (r < .06) pickups.push({ x: z.x, y: z.y, type: 'ammo', life: 15 });
  else if (r < .1) pickups.push({ x: z.x, y: z.y, type: 'med', life: 15 });
}

function explode(x, y, rad, dmg, owner, slot) {
  shake = Math.max(shake, 10);
  burst(x, y, '#ffb347', 22, 260, 7);
  burst(x, y, '#5a5448', 14, 120, 9);
  g.fillStyle = 'rgba(0,0,0,.3)';
  g.beginPath(); g.arc(x, y, rad * .45, 0, 6.283); g.fill();
  for (const z of zombies) {
    const d = Math.hypot(z.x - x, z.y - y);

}
function bloatBoom(z) {

  burst(z.x, z.y, '#b6e04a', 26, 240, 7);
  puddles.push({ x: z.x, y: z.y, r: 50, life: 5 });
  for (const p of players) if (p.alive && dist(p, z) < 95) hurt(p, 28);
  for (const o of zombies) if (o !== z && !o.dead && dist(o, z) < 95) damage(o, 60, null, null, o.x - z.x, o.y - z.y, true);

function rollRare() {
  const ids = Object.keys(W_DEFS).filter(k => k !== 'pistol');
  return { id: pick(ids), rarity: 'rare' };
}
function rollLegendary() {
  const taken = new Set([...players.flatMap(p => p.slots.filter(s => s.rarity === 'legendary').map(s => s.id)),
                         ...loot.filter(l => l.item.rarity === 'legendary').map(l => l.item.id)]);

}
function bossDeath(z) {

  banner(z.name + ' defeated. Grab the loot, one item each', '#ff9f1a', true);
  const idx = wave / BOSS_EVERY - 1;
  const items = [rollRare(), Math.random() < .35 + idx * .2 ? rollLegendary() : rollRare()];
  if (idx === 1 && !items.some(i => i.rarity === 'legendary')) items[1] = rollLegendary();
  items.forEach((it, k) => {
    const l = { x: z.x + (k ? 50 : -50), y: z.y, r: 12, item: it, bob: rand(0, 6) };
    l.x = clamp(l.x, 30, WW - 30); l.y = clamp(l.y, 30, WH - 30);

function gameOver() {
  state = 'over';
  if (wave > best) { best = wave; try { localStorage.setItem('blockrot-best', best); } catch (e) {} }
}

/* ---------------- enemy projectiles ---------------- */
function eShot(x, y, a, speed, kind) {
  const spec = { fire: [6, 14], acid: [7, 10], orb: [8, 16] }[kind];
  eshots.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: spec[0], dmg: spec[1], kind, life: 2.6 });
}

/* ---------------- camera ---------------- */
function updateCam(dt, snap) {
  const [a, b] = players;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const need = Math.max(Math.abs(a.x - b.x) / (W - 240), Math.abs(a.y - b.y) / (H - AY - 200), 1e-6);
  const tz = clamp(1 / need, ZMIN, 1);
  zoom = snap ? tz : zoom + (tz - zoom) * Math.min(1, dt * 4);
  const vw = W / zoom, vh = (H - AY) / zoom;
  const tx = clamp(mx, vw / 2, WW - vw / 2), ty = clamp(my, vh / 2, WH - vh / 2);
  camX = snap ? tx : camX + (tx - camX) * Math.min(1, dt * 8);

}
const MAXDX = W / ZMIN - 220, MAXDY = (H - AY) / ZMIN - 180;

/* ---------------- update ---------------- */
function update(dt) {
  time += dt;
  newZ = [];

  fieldT -= dt;
  if (fieldT <= 0) { computeField(); fieldT = .25; }

  for (const id in mastery) {
    const m = mastery[id];
    if (m.t > 0) { m.t -= dt; if (m.t <= 0) m.chain = 0; }
  }

  // players
  for (const p of players) {
    if (!p.alive) {
      const mate = players[1 - p.i];
      if (mate.alive && dist(p, mate) < 50) {
        p.rev += dt;
        if (p.rev >= 3) { p.alive = true; p.hp = 40; p.rev = 0; p.hurt = 1; banner(p.name + ' is back up', '#8fd67a'); }
      } else p.rev = Math.max(0, p.rev - dt);
      continue;
    }
    const c = CTRL[p.i];
    let mx = (held(c.right) ? 1 : 0) - (held(c.left) ? 1 : 0);
    let my = (held(c.down) ? 1 : 0) - (held(c.up) ? 1 : 0);
    if (mx || my) {
      const l = Math.hypot(mx, my); mx /= l; my /= l;
      p.dx = mx; p.dy = my; p.walk += dt * 12;
    }
    p.x += mx * p.speed * dt; p.y += my * p.speed * dt;
    const mate = players[1 - p.i];
    p.x = clamp(p.x, mate.x - MAXDX, mate.x + MAXDX);
    p.y = clamp(p.y, mate.y - MAXDY, mate.y + MAXDY);

    p.cd -= dt;
    if (held(c.fire) && p.cd <= 0) fire(p);
    if (tap(c.build)) build(p);
    if (p.comboT > 0) { p.comboT -= dt; if (p.comboT <= 0) p.combo = 0; }
    if (p.hurt > 0) p.hurt -= dt;

    for (const k of pickups) {
      if (k.life > 0 && dist(p, k) < 26) {
        k.life = 0;
        if (k.type === 'ammo') {
          for (const s of p.slots) if (s.ammo !== Infinity) s.ammo = Math.min(s.max, s.ammo + Math.ceil(s.max / 2));
          p.build = Math.min(6, p.build + 1);
          floatText(p.x, p.y - 34, 'Ammo + barricade', '#f2d27a');
        } else {
          p.hp = Math.min(100, p.hp + 30);
          floatText(p.x, p.y - 34, '+30 health', '#8fd67a');
        }
      }
    }
    for (const l of loot) {
      if (l.taken || dist(p, l) > 28) continue;
      l.taken = true;
      const same = p.slots.find(s => s.id === l.item.id && s.rarity === l.item.rarity);
      if (same) { same.ammo = same.max; floatText(p.x, p.y - 34, same.name + ' refilled', RARITY_COLOR[same.rarity]); }
      else {
        const s = makeSlot(l.item.id, l.item.rarity);
        p.slots.push(s); p.cur = p.slots.length - 1;
        banner(`${p.name} claimed ${s.name}`, RARITY_COLOR[s.rarity]);
      }
      burst(l.x, l.y, RARITY_COLOR[l.item.rarity], 24, 200, 5);
    }
    for (const q of puddles) if (dist(p, q) < q.r) hurtDot(p, 14 * dt);
  }
  loot = loot.filter(l => !l.taken);

  // zombies
  for (const z of zombies) {
    z.flash -= dt;
    if (z.burn > 0) {
      z.burn -= dt;
      z.hp -= z.burnDps * dt;
      if (Math.random() < .3) particles.push({ x: z.x + rand(-z.r, z.r), y: z.y - z.r, vx: 0, vy: -40, life: .35, max: .35, size: 5, color: '#ff8a2a' });

    let sp = z.speed;

    if (z.ranged && bd < 340) sp *= .35;
    if (z.necro && bd < 320) { fx = -tdx; fy = -tdy; sp *= .6; }
    if (z.dash) {
      z.dcd -= dt;
      if (z.dashT > 0) { z.dashT -= dt; fx = z.ddx; fy = z.ddy; sp = 430; }
      else if (z.dcd <= 0 && bd < 280) { z.dashT = .4; z.dcd = rand(3, 4.5); z.ddx = tdx; z.ddy = tdy; burst(z.x, z.y, '#9fb3c2', 6, 100); }
    }

    if (z.boss) {
      const rage = z.hp < z.max * .4 ? .65 : 1;
      z.t1 -= dt; z.t2 -= dt;
      if (z.key === 'brood') {
        if (z.t1 <= 0) {
          z.t1 = 4.5 * rage;
          if (zombies.length + newZ.length < 50)
            for (let k = 0; k < 3; k++) newZ.push(makeZombie('crawler', z.x + rand(-50, 50), z.y + rand(-50, 50), true));
          burst(z.x, z.y, '#a08660', 16, 160, 6);
        }
        if (z.t2 <= 0) {
          z.t2 = 2.2 * rage;
          const a = Math.atan2(tdy, tdx);
          for (let k = -1; k <= 1; k++) eShot(z.x, z.y, a + k * .25, 230, 'acid');
        }
      } else if (z.key === 'pyre') {
        if (z.t1 <= 0) { z.t1 = 3.4 * rage; for (let k = 0; k < 14; k++) eShot(z.x, z.y, k / 14 * 6.283 + time, 200, 'fire'); }
        if (z.t2 <= 0) {
          z.t2 = 1.2 * rage;
          const a = Math.atan2(tdy, tdx);
          for (let k = -1; k <= 1; k++) eShot(z.x, z.y, a + k * .18, 280, 'fire');
        }
        if (Math.random() < .5) particles.push({ x: z.x + rand(-z.r, z.r), y: z.y - z.r * 1.4, vx: 0, vy: -60, life: .4, max: .4, size: 7, color: '#ff7a2f' });
      } else if (z.key === 'wraith') {
        if (z.blinkT > 0) {
          z.blinkT -= dt; sp = 0;
          if (z.blinkT <= 0) {
            burst(z.x, z.y, '#9ad7ff', 20, 200, 6);
            z.x = z.bx; z.y = z.by;
            for (let k = 0; k < 10; k++) eShot(z.x, z.y, k / 10 * 6.283, 210, 'orb');
            burst(z.x, z.y, '#9ad7ff', 20, 200, 6);
            shake = Math.max(shake, 8);
          }
        } else if (z.t1 <= 0) {
          z.t1 = 5.5 * rage;
          const a = rand(0, 6.283), bx = t.x + Math.cos(a) * 170, by = t.y + Math.sin(a) * 170;

        }
        if (z.t2 <= 0) {
          z.t2 = 8 * rage;
          if (zombies.length + newZ.length < 50)
            for (let k = 0; k < 2; k++) newZ.push(makeZombie('ghoul', z.x + rand(-40, 40), z.y + rand(-40, 40), true));
        }
      }
    }

    const wob = z.boss || z.dashT > 0 ? 0 : Math.sin(time * 2 + z.wob) * .3;
    z.x += (fx - fy * wob) * sp * dt; z.y += (fy + fx * wob) * sp * dt;
    z.dx = tdx; z.dy = tdy; z.walk += dt * Math.abs(sp) * .12;
    if (!z.inside && z.x > z.r && z.x < WW - z.r && z.y > z.r && z.y < WH - z.r) z.inside = true;
    const bar = solid(z);
    if (bar) { bar.hp -= (z.dmg || 10) * 2.5 * dt; if (Math.random() < .1) burst(bar.x + 20, bar.y + 20, '#a07a45', 1, 60); }

    z.atk -= dt;
    if (bd < z.r + t.r + 5) {
      if (z.bloat) { z.hp = 0; kill(z, null, null); continue; }
      if (z.atk <= 0) { hurt(t, z.dmg); z.atk = .7; }
    }
    if (z.ranged && z.inside) {
      z.shoot -= dt;
      if (z.shoot <= 0 && bd < 450) {
        z.shoot = rand(2, 3.2);
        eShot(z.x, z.y - 6, Math.atan2(tdy, tdx), z.ranged === 'acid' ? 230 : 260, z.ranged);
      }
    }
    if (z.necro) {
      z.heal -= dt;
      if (z.heal <= 0) {
        z.heal = 3;
        let any = false;
        for (const o of zombies) if (o !== z && !o.dead && !o.boss && dist(o, z) < 200 && o.hp < o.max) {
          o.hp = Math.min(o.max, o.hp + o.max * .25); any = true;
          burst(o.x, o.y, '#a9f0c8', 4, 60, 4);
        }
        if (any) beams.push({ ring: true, x1: z.x, y1: z.y, r: 200, color: '#a9f0c8', life: .4, max: .4 });
      }
    }
  }
  zombies = zombies.filter(z => !z.dead);
  for (let i = 0; i < zombies.length; i++) for (let j = i + 1; j < zombies.length; j++) {
    const a = zombies[i], b = zombies[j];
    const dx = b.x - a.x, dy = b.y - a.y, m = a.r + b.r;
    if (Math.abs(dx) > m || Math.abs(dy) > m) continue;
    const d = Math.hypot(dx, dy);
    if (d < m && d > 0) {
      const wa = a.boss ? .1 : b.boss ? .9 : .5, o = m - d;
      a.x -= dx / d * o * wa; a.y -= dy / d * o * wa;
      b.x += dx / d * o * (1 - wa); b.y += dy / d * o * (1 - wa);
    }
  }
  for (const p of players) {
    if (!p.alive) continue;
    for (const z of zombies) {
      const dx = p.x - z.x, dy = p.y - z.y, d = Math.hypot(dx, dy), m = p.r + z.r;
      if (d < m && d > 0) { p.x = z.x + dx / d * m; p.y = z.y + dy / d * m; }
    }
    solid(p);
  }

  // player projectiles
  for (const b of bullets) {
    if (b.kind === 'homing') {
      let tg = null, td = 450;
      for (const z of zombies) { const d = dist(z, b); if (!z.dead && d < td) { td = d; tg = z; } }
      if (tg) {
        const cur = Math.atan2(b.vy, b.vx), want = Math.atan2(tg.y - b.y, tg.x - b.x);
        let diff = want - cur; while (diff > Math.PI) diff -= 6.283; while (diff < -Math.PI) diff += 6.283;
        const na = cur + clamp(diff, -6 * dt, 6 * dt), sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.kind === 'flame') { b.size += dt * 34; b.vx *= .97; b.vy *= .97; }
    if ((b.kind === 'rocket' || b.kind === 'homing') && Math.random() < .7)
      particles.push({ x: b.x, y: b.y, vx: rand(-20, 20), vy: rand(-20, 20), life: .35, max: .35, size: 5, color: '#8a8478' });
    if (b.kind === 'plasma' && Math.random() < .8)
      particles.push({ x: b.x, y: b.y, vx: rand(-30, 30), vy: rand(-30, 30), life: .3, max: .3, size: 4, color: b.color });

    const end = () => { b.dead = true; if (b.blast) explode(b.x, b.y, b.blast, b.blastDmg, b.owner, b.slot); };
    if (b.x < 0 || b.x > WW || b.y < 0 || b.y > WH || isBlockedAt(b.x, b.y)) {
      if (b.kind === 'bullet') burst(b.x, b.y, '#d8d0b0', 3, 90, 2);
      end(); continue;
    }
    for (const br of barrels) if (br.alive && dist(b, br) < br.r + b.size) { blowBarrel(br, b.owner, b.slot); if (b.kind !== 'plasma') b.dead = true; break; }
    if (b.dead) continue;
    for (const z of zombies) {
      if (z.dead || b.hit.has(z) || dist(b, z) > z.r + b.size) continue;
      b.hit.add(z);
      if (b.kind === 'rocket' || b.kind === 'homing') { damage(z, b.dmg, b.owner, b.slot, b.vx, b.vy); end(); break; }
      damage(z, b.dmg, b.owner, b.slot, b.vx, b.vy, b.kind !== 'bullet');
      if (b.burn) { z.burn = 1.6; z.burnDps = Math.max(z.burnDps, b.burn); z.burnOwner = b.owner; z.burnSlot = b.slot; }
      if (b.hit.size > b.pierce) { b.dead = true; break; }
    }
    if (!b.dead && b.life <= 0) { if (b.kind === 'flame') b.dead = true; else end(); }
  }
  bullets = bullets.filter(b => !b.dead);

  // enemy projectiles
  for (const f of eshots) {
    f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt;
    const col = f.kind === 'acid' ? '#b6e04a' : f.kind === 'orb' ? '#9ad7ff' : '#ff7a2f';
    if (Math.random() < .6) particles.push({ x: f.x, y: f.y, vx: rand(-15, 15), vy: rand(-15, 15), life: .3, max: .3, size: 5, color: col });
    const stop = () => { f.dead = true; if (f.kind === 'acid') puddles.push({ x: f.x, y: f.y, r: 32, life: 4 }); };
    if (f.life <= 0 || f.x < 0 || f.x > WW || f.y < 0 || f.y > WH || isBlockedAt(f.x, f.y)) { stop(); continue; }
    for (const b of barricades) if (inRect(f, { x: b.x, y: b.y, w: CELL, h: CELL })) { b.hp -= 20; stop(); break; }
    if (f.dead) continue;
    for (const p of players) if (p.alive && dist(f, p) < p.r + f.r) { hurt(p, f.dmg); burst(f.x, f.y, col, 8); stop(); break; }
  }
  eshots = eshots.filter(f => !f.dead);

  zombies = zombies.filter(z => !z.dead).concat(newZ);
  barricades = barricades.filter(b => {
    if (b.hp > 0) return true;
    burst(b.x + 20, b.y + 20, '#8a6a3a', 14, 150, 5);
    return false;
  });
  pickups = pickups.filter(k => (k.life -= dt) > 0);
  puddles = puddles.filter(q => (q.life -= dt) > 0);

  // waves
  if (state === 'play') {
    if (intermission > 0) {
      intermission -= dt;
      if (intermission <= 0) nextWave();
    } else {
      if (bossPending) { bossDelay -= dt; if (bossDelay <= 0) { bossPending = false; spawnBoss(); } }
      if (toSpawn > 0) {
        spawnT -= dt;
        if (spawnT <= 0 && zombies.length < 40) {
          spawnZombie(); toSpawn--;
          spawnT = Math.max(.2, 1 - wave * .05) * rand(.5, 1.3);
        }
      } else if (!bossPending && zombies.length === 0) {
        intermission = wave % BOSS_EVERY === 0 ? 8 : 4;
        banner('Wave ' + wave + ' cleared', '#8fd67a');
      }
    }
  }

  updateCam(dt, false);
  updateFx(dt);
}

function updateFx(dt) {
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .9; q.vy *= .9; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  if (particles.length > 1500) particles.splice(0, particles.length - 1500);
  for (const t of texts) { t.y -= 30 * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  for (const b of beams) b.life -= dt;
  beams = beams.filter(b => b.life > 0);
  for (const b of bolts) b.life -= dt;
  bolts = bolts.filter(b => b.life > 0);
  if (banners.length) { banners[0].life -= dt * (banners.length > 2 ? 2 : 1); if (banners[0].life <= 0) banners.shift(); }
  shake = Math.max(0, shake - dt * 30);
}

/* ---------------- drawing ---------------- */
const FONT = '"Trebuchet MS", sans-serif';
const DISPLAY = 'Impact, "Arial Black", sans-serif';

function drawBlock(x, y, s, body, head, dx, dy, walk, flash, arms, eye) {
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(x - s * .9, y + s * .65, s * 1.8, s * .45);
  const bob = Math.sin(walk) * s * .18;
  ctx.fillStyle = '#1d1c16';
  ctx.fillRect(x - s * .6, y + s * .25 + Math.max(0, bob), s * .5, s * .55);
  ctx.fillRect(x + s * .1, y + s * .25 + Math.max(0, -bob), s * .5, s * .55);
  if (arms) {
    ctx.fillStyle = flash ? '#fff' : head;
    const ax = dx * s * .9, ay = dy * s * .9;
    ctx.fillRect(x - s * .8 + ax, y - s * .4 + ay, s * .35, s * .35);
    ctx.fillRect(x + s * .45 + ax, y - s * .4 + ay, s * .35, s * .35);
  }
  ctx.lineWidth = 2; ctx.strokeStyle = '#000';
  ctx.fillStyle = flash ? '#fff' : body;
  ctx.fillRect(x - s * .75, y - s * .7, s * 1.5, s * 1.05);
  ctx.strokeRect(x - s * .75, y - s * .7, s * 1.5, s * 1.05);
  ctx.fillStyle = flash ? '#fff' : head;
  ctx.fillRect(x - s * .62, y - s * 1.65, s * 1.24, s * 1.0);
  ctx.strokeRect(x - s * .62, y - s * 1.65, s * 1.24, s * 1.0);
  if (dy > -.6) {
    ctx.fillStyle = eye;
    const ex = x + dx * s * .28, ey = y - s * 1.3 + Math.max(0, dy) * s * .12;
    ctx.fillRect(ex - s * .38, ey, s * .22, s * .22);
    ctx.fillRect(ex + s * .16, ey, s * .22, s * .22);
  }
}

function drawPlayer(p) {
  if (!p.alive) {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(p.x - 17, p.y - 2, 34, 12);
    ctx.fillStyle = '#6b665a'; ctx.fillRect(p.x - 16, p.y - 8, 32, 14);
    ctx.fillStyle = p.head; ctx.fillRect(p.x + 6, p.y - 10, 13, 13);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(p.x - 16, p.y - 8, 32, 14);
    ctx.strokeStyle = 'rgba(143,214,122,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y - 2, 50, 0, 6.283); ctx.stroke();
    if (p.rev > 0) {
      ctx.strokeStyle = '#8fd67a'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(p.x, p.y - 2, 28, -1.571, -1.571 + 6.283 * p.rev / 3); ctx.stroke();
    }
    ctx.fillStyle = p.head; ctx.font = `bold 13px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText(p.name, p.x, p.y - 24);
    return;
  }
  const s = p.slots[p.cur], st = stats(s);
  const blink = p.hurt > 0 && Math.floor(time * 20) % 2 === 0;
  const thick = { rocket: 7, plasma: 8, homing: 7, laser: 4, tesla: 6, flame: 6 }[s.def.kind] || (s.id === 'shotgun' ? 5 : 4);
  const gun = () => {
    for (const off of st.dual ? [-9, 9] : [0]) {
      const ox = -p.dy * off, oy = p.dx * off;
      ctx.strokeStyle = '#111'; ctx.lineWidth = thick;
      ctx.beginPath(); ctx.moveTo(p.x + ox, p.y - 4 + oy); ctx.lineTo(p.x + ox + p.dx * 24, p.y - 4 + oy + p.dy * 24); ctx.stroke();
      if (s.rarity !== 'base' || s.def.kind !== 'bullet') {
        ctx.strokeStyle = s.rarity === 'base' ? s.def.color : RARITY_COLOR[s.rarity]; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x + ox + p.dx * 10, p.y - 4 + oy + p.dy * 10); ctx.lineTo(p.x + ox + p.dx * 22, p.y - 4 + oy + p.dy * 22); ctx.stroke();
      }
    }
  };
  if (p.dy < 0) gun();
  drawBlock(p.x, p.y, p.r, p.body, p.head, p.dx, p.dy, p.walk, blink, false, '#000');
  if (p.dy >= 0) gun();
  ctx.fillStyle = p.head; ctx.font = `bold 13px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillText(p.name, p.x, p.y - p.r * 1.95);
}

function drawZombie(z) {
  if (z.blinkT > 0) {
    ctx.strokeStyle = `rgba(154,215,255,${.4 + .4 * Math.sin(time * 30)})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(z.bx, z.by, z.r + 10, 0, 6.283); ctx.stroke();
    ctx.globalAlpha = .5;
  }
  if (z.boss) {
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(z.x, z.y + z.r * .8, z.r * 1.3, z.r * .5, 0, 0, 6.283); ctx.fill();
  }
  drawBlock(z.x, z.y, z.r, z.body, z.head, z.dx, z.dy, z.walk, z.flash > 0, true,
            z.necro ? '#e8fff2' : z.boss ? '#fff26b' : '#ff3b2a');
  ctx.globalAlpha = 1;
  if (z.shield) {
    const a = Math.atan2(z.dy, z.dx);
    ctx.strokeStyle = '#c9ccd2'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(z.x, z.y - z.r * .3, z.r + 6, a - .9, a + .9); ctx.stroke();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(z.x, z.y - z.r * .3, z.r + 9, a - .9, a + .9); ctx.stroke();
  }
  if (z.bloat) {
    ctx.fillStyle = 'rgba(182,224,74,.5)';
    ctx.beginPath(); ctx.arc(z.x, z.y - z.r * .2, z.r * .55 + Math.sin(time * 6 + z.wob) * 2, 0, 6.283); ctx.fill();
  }
  if (z.burn > 0) { ctx.fillStyle = 'rgba(255,120,40,.25)'; ctx.fillRect(z.x - z.r, z.y - z.r * 1.7, z.r * 2, z.r * 2.5); }
  if (!z.boss && z.hp < z.max) {
    ctx.fillStyle = '#000'; ctx.fillRect(z.x - z.r, z.y - z.r * 2.1, z.r * 2, 4);
    ctx.fillStyle = '#d0402f'; ctx.fillRect(z.x - z.r, z.y - z.r * 2.1, z.r * 2 * Math.max(0, z.hp / z.max), 4);
  }
}

function drawLoot(l) {
  const col = RARITY_COLOR[l.item.rarity];
  const bob = Math.sin(time * 3 + l.bob) * 3;
  const grad = ctx.createLinearGradient(0, l.y - 160, 0, l.y);
  grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, col + '88');
  ctx.fillStyle = grad; ctx.fillRect(l.x - 10, l.y - 160, 20, 160);
  ctx.save(); ctx.translate(l.x, l.y - 6 + bob); ctx.rotate(time * 1.5);
  ctx.fillStyle = col; ctx.fillRect(-10, -10, 20, 20);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(-10, -10, 20, 20);
  ctx.restore();
  const def = l.item.rarity === 'legendary' ? LEGENDARY[l.item.id] : W_DEFS[l.item.id];
  const name = (l.item.rarity === 'rare' ? 'Prime ' : '') + def.name;
  ctx.font = `bold 14px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillStyle = '#000'; ctx.fillText(name, l.x + 1, l.y - 29);
  ctx.fillStyle = col; ctx.fillText(name, l.x, l.y - 30);
  ctx.font = `11px ${FONT}`; ctx.fillStyle = '#e6dfc8';
  ctx.fillText(l.item.rarity === 'legendary' ? 'Legendary' : 'Rare', l.x, l.y - 44);
}

function drawWorld() {
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
  ctx.setTransform(zoom, 0, 0, zoom, W / 2 - camX * zoom + sx, AY + (H - AY) / 2 - camY * zoom + sy);
  const vx0 = camX - W / 2 / zoom - 60, vx1 = camX + W / 2 / zoom + 60;
  const vy0 = camY - (H - AY) / 2 / zoom - 60, vy1 = camY + (H - AY) / 2 / zoom + 60;
  const vis = e => e.x > vx0 && e.x < vx1 && e.y > vy0 && e.y < vy1;

  ctx.drawImage(gnd, 0, 0);
  for (const q of puddles) {
    ctx.globalAlpha = Math.min(1, q.life) * .55;
    ctx.fillStyle = '#8fc43a';
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const o of OBST) {
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(o.x + 6, o.y + 8, o.w, o.h);
    ctx.fillStyle = '#6e6c5c'; ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = '#8d8a76'; ctx.fillRect(o.x, o.y, o.w, 8);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(o.x, o.y, o.w, o.h);
  }
  for (const b of barricades) {
    const k = b.hp / b.max;
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(b.x + 5, b.y + 6, CELL, CELL);
    ctx.fillStyle = k > .5 ? '#8a6636' : k > .25 ? '#6e4f2a' : '#523a20';
    ctx.fillRect(b.x, b.y, CELL, CELL);
    ctx.strokeStyle = '#3a2812'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(b.x + 4, b.y + 4); ctx.lineTo(b.x + CELL - 4, b.y + CELL - 4);
    ctx.moveTo(b.x + CELL - 4, b.y + 4); ctx.lineTo(b.x + 4, b.y + CELL - 4); ctx.stroke();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, CELL, CELL);
  }
  for (const b of barrels) {
    if (!b.alive) continue;
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(b.x - 10, b.y + 6, 26, 8);
    ctx.fillStyle = '#a3291f'; ctx.fillRect(b.x - 12, b.y - 14, 24, 24);
    ctx.fillStyle = '#c9a227'; ctx.fillRect(b.x - 12, b.y - 4, 24, 5);
    ctx.fillStyle = '#c8473a'; ctx.fillRect(b.x - 12, b.y - 14, 24, 5);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(b.x - 12, b.y - 14, 24, 24);
  }
  for (const k of pickups) {
    if (k.life < 3 && Math.floor(time * 8) % 2) continue;
    const bobY = Math.sin(time * 4 + k.x) * 2;
    ctx.fillStyle = k.type === 'ammo' ? '#c9a227' : '#e6dfc8';
    ctx.fillRect(k.x - 10, k.y - 10 + bobY, 20, 20);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(k.x - 10, k.y - 10 + bobY, 20, 20);
    ctx.fillStyle = k.type === 'ammo' ? '#1d1c16' : '#c8322a';
    if (k.type === 'ammo') for (const ox of [-6, -1, 4]) ctx.fillRect(k.x + ox, k.y - 6 + bobY, 3, 12);
    else { ctx.fillRect(k.x - 7, k.y - 2 + bobY, 14, 4); ctx.fillRect(k.x - 2, k.y - 7 + bobY, 4, 14); }
  }
  for (const l of loot) drawLoot(l);

  const actors = [];
  for (const p of players) actors.push({ y: p.alive ? p.y : p.y - 100, d: () => drawPlayer(p) });
  for (const z of zombies) if (vis(z) || z.boss) actors.push({ y: z.y, d: () => drawZombie(z) });
  actors.sort((a, b) => a.y - b.y).forEach(a => a.d());

  ctx.lineCap = 'round';
  for (const b of bullets) {
    if (!vis(b)) continue;
    if (b.kind === 'flame') {
      ctx.globalAlpha = Math.max(0, b.life / .42) * .8;
      ctx.fillStyle = b.life > .25 ? '#ffe28a' : b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (b.kind === 'plasma') {
      ctx.fillStyle = b.color + '55'; ctx.beginPath(); ctx.arc(b.x, b.y, b.size * 1.8, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.size * .7, 0, 6.283); ctx.fill();
    } else if (b.kind === 'rocket' || b.kind === 'homing') {
      ctx.fillStyle = b.color; ctx.fillRect(b.x - 4, b.y - 4, 8, 8);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(b.x - 4, b.y - 4, 8, 8);
    } else {
      ctx.strokeStyle = b.slot.rarity === 'rare' ? '#9fcbff' : b.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .015, b.y - b.vy * .015); ctx.stroke();
    }
  }
  for (const b of beams) {
    ctx.globalAlpha = b.life / b.max;
    if (b.ring) {
      ctx.strokeStyle = b.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x1, b.y1, b.r * (1 - b.life / b.max * .5), 0, 6.283); ctx.stroke();
    } else {
      ctx.strokeStyle = b.color; ctx.lineWidth = b.w * 2.2;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1, b.w * .6);
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    }
  }
  for (const b of bolts) {
    ctx.globalAlpha = b.life / b.max;
    for (const [col, w] of [[b.color, 5], ['#fff', 1.5]]) {
      ctx.strokeStyle = col; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(...b.pts[0]);
      for (const pt of b.pts) ctx.lineTo(...pt);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1; ctx.lineCap = 'butt';
  for (const f of eshots) {
    const col = f.kind === 'acid' ? '#b6e04a' : f.kind === 'orb' ? '#9ad7ff' : '#ff7a2f';
    ctx.fillStyle = col + '55'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 2, 0, 6.283); ctx.fill();
    ctx.fillStyle = f.kind === 'orb' ? '#e8f6ff' : f.kind === 'acid' ? '#dff58a' : '#ffd36a';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
  }
  for (const q of particles) {
    if (!vis(q)) continue;
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = `bold 15px ${FONT}`;
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2);
    ctx.fillStyle = '#000'; ctx.fillText(t.t, t.x + 1, t.y + 1);
    ctx.fillStyle = t.color; ctx.fillText(t.t, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function pips(x, y, lv, align) {
  const total = 3, w = 10, gap = 3, width = total * (w + gap) - gap;
  const x0 = align === 'right' ? x - width : x;
  for (let k = 0; k < total; k++) {
    ctx.fillStyle = k < lv ? '#f2d27a' : '#3a372c';
    ctx.fillRect(x0 + k * (w + gap), y - 9, w, 10);
  }
  return width;
}

function drawHud() {
  ctx.fillStyle = '#12110c'; ctx.fillRect(0, 0, W, AY);
  ctx.fillStyle = '#000'; ctx.fillRect(0, AY - 2, W, 2);
  for (const p of players) {
    const left = p.i === 0, x0 = left ? 14 : W - 14, al = left ? 'left' : 'right';
    ctx.textAlign = al;
    ctx.font = `bold 16px ${FONT}`; ctx.fillStyle = p.head;
    ctx.fillText(p.name, x0, 20);
    const bx = left ? x0 + 32 : x0 - 32 - 150;
    ctx.fillStyle = '#2e2c24'; ctx.fillRect(bx, 8, 150, 13);
    const fw = 150 * p.hp / 100;
    ctx.fillStyle = p.hp > 35 ? '#6bbf4a' : '#d0402f';
    ctx.fillRect(left ? bx : bx + 150 - fw, 8, fw, 13);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(bx, 8, 150, 13);
    ctx.font = `bold 15px ${FONT}`;
    ctx.fillStyle = p.combo > 1 ? '#f2d27a' : '#e6dfc8';
    ctx.fillText(p.score + (p.combo > 1 ? '  x' + Math.min(p.combo, 10) : ''), left ? bx + 162 : bx - 12, 20);

    const s = p.slots[p.cur];
    const am = s.ammo === Infinity ? '∞' : s.ammo;
    const lv = s.base ? mastery[s.base].lv : 0;
    ctx.font = `bold 14px ${FONT}`;
    const nameTxt = `${s.name} ${am}`;
    const tail = `   Barricades ${p.build}   ${p.cur + 1}/${p.slots.length}`;
    ctx.font = `13px ${FONT}`; const tailW = ctx.measureText(tail).width;
    ctx.font = `bold 14px ${FONT}`; const nameW = ctx.measureText(nameTxt).width;
    const pw = s.base ? 45 : 0;
    let cx = left ? x0 : x0 - (nameW + pw + tailW);
    ctx.textAlign = 'left';
    ctx.fillStyle = RARITY_COLOR[s.rarity]; ctx.fillText(nameTxt, cx, 42); cx += nameW + 6;
    if (s.base) { pips(cx, 42, lv, 'left'); cx += 39; }
    ctx.font = `13px ${FONT}`; ctx.fillStyle = '#8f8870'; ctx.fillText(tail, cx, 42);
  }
  ctx.textAlign = 'center';
  ctx.font = `bold 18px ${FONT}`; ctx.fillStyle = '#e6dfc8';
  ctx.fillText('Wave ' + wave + (wave % BOSS_EVERY === 0 ? ' (boss)' : ''), W / 2, 21);
  ctx.font = `13px ${FONT}`; ctx.fillStyle = '#8f8870';
  ctx.fillText(intermission > 0 ? 'Next wave in ' + Math.ceil(intermission) : (zombies.length + toSpawn) + ' enemies left', W / 2, 42);

  let y = AY + 8;
  const sid = syncWeapon();
  if (sid) {
    const m = mastery[sid];
    ctx.fillStyle = 'rgba(18,17,12,.85)'; ctx.fillRect(W / 2 - 170, y, 340, 28);
    ctx.textAlign = 'left'; ctx.font = `bold 13px ${FONT}`; ctx.fillStyle = '#f2d27a';
    const label = m.lv >= 3 ? `${W_DEFS[sid].name} fully mastered` : `Synced: ${W_DEFS[sid].name} mastery`;
    ctx.fillText(label, W / 2 - 160, y + 18);
    if (m.lv < 3) {
      const need = MASTERY_NEED[m.lv], bw = 110, bxx = W / 2 + 45;
      ctx.fillStyle = '#3a372c'; ctx.fillRect(bxx, y + 9, bw, 10);
      ctx.fillStyle = '#f2d27a'; ctx.fillRect(bxx, y + 9, bw * m.chain / need, 10);
      ctx.textAlign = 'right'; ctx.fillStyle = '#e6dfc8'; ctx.font = `12px ${FONT}`;
      ctx.fillText(`${m.chain}/${need}`, W / 2 + 162, y + 18);
    }
    y += 34;
  }
  const boss = zombies.find(z => z.boss);
  if (boss) {
    ctx.fillStyle = 'rgba(18,17,12,.85)'; ctx.fillRect(W / 2 - 260, y, 520, 36);
    ctx.textAlign = 'center'; ctx.font = `bold 14px ${FONT}`; ctx.fillStyle = '#e2735f';
    ctx.fillText(boss.name + (boss.hp < boss.max * .4 ? ' (enraged)' : ''), W / 2, y + 14);
    ctx.fillStyle = '#3a1612'; ctx.fillRect(W / 2 - 250, y + 20, 500, 10);
    ctx.fillStyle = '#d0402f'; ctx.fillRect(W / 2 - 250, y + 20, 500 * Math.max(0, boss.hp / boss.max), 10);
    y += 42;
  }

  if (banners.length) {
    const b = banners[0];
    ctx.globalAlpha = Math.min(1, b.life * 2);
    ctx.textAlign = 'center';
    ctx.font = b.big ? `34px ${DISPLAY}` : `bold 22px ${FONT}`;
    ctx.fillStyle = '#000'; ctx.fillText(b.text, W / 2 + 2, y + 52);
    ctx.fillStyle = b.color; ctx.fillText(b.text, W / 2, y + 50);
    ctx.globalAlpha = 1;
  }

  // mastery summary (bottom-left)
  const earned = Object.keys(mastery).filter(k => mastery[k].lv > 0);
  if (earned.length) {
    const hh = 22 + earned.length * 18;
    ctx.fillStyle = 'rgba(18,17,12,.8)'; ctx.fillRect(10, H - hh - 10, 190, hh);
    ctx.textAlign = 'left'; ctx.font = `bold 12px ${FONT}`; ctx.fillStyle = '#8f8870';
    ctx.fillText('Team mastery', 20, H - hh + 6);
    earned.forEach((k, i) => {
      ctx.font = `13px ${FONT}`; ctx.fillStyle = '#e6dfc8';
      ctx.fillText(W_DEFS[k].name, 20, H - hh + 26 + i * 18);
      pips(190, H - hh + 26 + i * 18, mastery[k].lv, 'right');
    });
  }

  // minimap (bottom-right)
  const mx = W - MMW - 10, my = H - MMH - 10;
  ctx.drawImage(mm, mx, my);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(mx, my, MMW, MMH);
  ctx.strokeStyle = 'rgba(230,223,200,.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(mx + (camX - W / 2 / zoom) * MMS, my + (camY - (H - AY) / 2 / zoom) * MMS, W / zoom * MMS, (H - AY) / zoom * MMS);
  for (const z of zombies) {
    ctx.fillStyle = z.boss ? '#ff4a3a' : '#b8322a';
    const s = z.boss ? 6 : 2;
    ctx.fillRect(mx + z.x * MMS - s / 2, my + z.y * MMS - s / 2, s, s);
  }
  for (const l of loot) {
    ctx.fillStyle = RARITY_COLOR[l.item.rarity];
    ctx.fillRect(mx + l.x * MMS - 3, my + l.y * MMS - 3, 6, 6);
  }
  for (const p of players) {
    ctx.fillStyle = p.alive ? p.head : '#6b665a';
    ctx.fillRect(mx + p.x * MMS - 3, my + p.y * MMS - 3, 6, 6);
  }
}

function shade(a) { ctx.fillStyle = `rgba(10,9,6,${a})`; ctx.fillRect(0, 0, W, H); }

function drawTitle() {
  camX = WW / 2; camY = WH / 2; zoom = ZMIN;
  drawWorld(); shade(.74);
  ctx.textAlign = 'center';
  ctx.font = `110px ${DISPLAY}`;
  ctx.fillStyle = '#000'; ctx.fillText('BLOCKROT', W / 2 + 5, 160);
  ctx.fillStyle = '#86b066'; ctx.fillText('BLOCKROT', W / 2, 155);
  ctx.font = `19px ${FONT}`; ctx.fillStyle = '#e6dfc8';
  ctx.fillText('Two players, one keyboard, too many zombies.', W / 2, 192);

  const rows = [['Move', 'W A S D', 'Arrow keys'], ['Shoot', 'Space', 'Enter'],
                ['Switch weapon', 'Q', 'Right Shift'], ['Place barricade', 'E', '/']];
  ctx.font = `bold 19px ${FONT}`;
  ctx.fillStyle = '#f2b134'; ctx.fillText('Player 1', W / 2 - 60, 250);
  ctx.fillStyle = '#5fc6d6'; ctx.fillText('Player 2', W / 2 + 160, 250);
  rows.forEach((r, i) => {
    const yy = 284 + i * 32;
    ctx.textAlign = 'right'; ctx.font = `17px ${FONT}`; ctx.fillStyle = '#8f8870';
    ctx.fillText(r[0], W / 2 - 160, yy);
    ctx.textAlign = 'center'; ctx.fillStyle = '#e6dfc8'; ctx.font = `bold 17px ${FONT}`;
    ctx.fillText(r[1], W / 2 - 60, yy); ctx.fillText(r[2], W / 2 + 160, yy);
  });
  const lines = [
    'You aim where you walk. Shoot red barrels. Stand next to a downed partner for 3 seconds to revive them.',
    'Hold the same weapon as your partner and chain kills together to earn team mastery for it.',
    `Every ${BOSS_EVERY}th wave brings a boss that drops rare and legendary weapons. Each drop goes to whoever grabs it.`,
    'New weapons unlock as the waves go on.' + (best ? `   Best: wave ${best}` : '')
  ];
  ctx.font = `15px ${FONT}`; ctx.fillStyle = '#a9a28a';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 454 + i * 24));
  if (Math.floor(performance.now() / 500) % 2 === 0) {
    ctx.font = `bold 26px ${FONT}`; ctx.fillStyle = '#e6dfc8';
    ctx.fillText('Press Space or Enter to start', W / 2, 640);
  }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#16140f'; ctx.fillRect(0, 0, W, H);
  if (state === 'title') { drawTitle(); return; }
  drawWorld();
  drawHud();
  ctx.textAlign = 'center';
  if (state === 'paused') {
    shade(.6);
    ctx.font = `72px ${DISPLAY}`; ctx.fillStyle = '#e6dfc8';
    ctx.fillText('Paused', W / 2, H / 2);
    ctx.font = `19px ${FONT}`; ctx.fillStyle = '#8f8870';
    ctx.fillText('P to resume, R to restart', W / 2, H / 2 + 44);
  } else if (state === 'over') {
    shade(.7);
    ctx.font = `90px ${DISPLAY}`;
    ctx.fillStyle = '#000'; ctx.fillText('OVERRUN', W / 2 + 4, H / 2 - 56);
    ctx.fillStyle = '#d0402f'; ctx.fillText('OVERRUN', W / 2, H / 2 - 60);
    ctx.font = `24px ${FONT}`; ctx.fillStyle = '#e6dfc8';
    ctx.fillText(`You made it to wave ${wave}. Best: wave ${best}`, W / 2, H / 2 - 6);
    ctx.fillStyle = '#f2b134'; ctx.fillText('P1  ' + players[0].score, W / 2 - 120, H / 2 + 36);
    ctx.fillStyle = '#5fc6d6'; ctx.fillText('P2  ' + players[1].score, W / 2 + 120, H / 2 + 36);
    ctx.font = `bold 22px ${FONT}`; ctx.fillStyle = '#e6dfc8';
    ctx.fillText('Press R to play again', W / 2, H / 2 + 90);
  }
}

/* ---------------- loop ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (state === 'title') {
    if (tap(['Space', 'Enter', 'NumpadEnter'])) startGame();
  } else if (state === 'play') {
    if (tap(['KeyP', 'Escape'])) state = 'paused';
    else if (tap(['KeyR'])) startGame();
    else update(dt);
  } else if (state === 'paused') {
    if (tap(['KeyP', 'Escape'])) state = 'play';
    else if (tap(['KeyR'])) startGame();
  } else if (state === 'over') {
    updateFx(dt);
    if (tap(['KeyR'])) startGame();
  }
  draw();
  for (const k in pressed) delete pressed[k];
  requestAnimationFrame(loop);
}
resetGround();
cv.focus();
requestAnimationFrame(loop);
</script>
