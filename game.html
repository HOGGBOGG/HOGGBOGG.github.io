<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockrot: co-op survival and PVP</title>
<style>
  :root { --bg:#16140f; --ink:#e6dfc8; --muted:#8f8870; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--ink);
    font-family:"Trebuchet MS", "Segoe UI", sans-serif; overflow:hidden; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  canvas { display:block; border:3px solid #000; outline:2px solid #3a362a; }
  #bar { font-size:13px; color:var(--muted); display:flex; gap:18px; }
  #bar a { color:var(--ink); }
  #bar a:focus-visible { outline:2px solid #f2b134; outline-offset:2px; }
  #stage { position:relative; }
  #menu { position:absolute; left:50%; bottom:4%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:7px;
    background:rgba(18,17,12,.93); border:2px solid #3a362a; padding:10px 16px; width:min(780px, 96%); }
  #menu .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; width:100%; }
  #menu button, #menu input, #menu select { font:bold 15px "Trebuchet MS", sans-serif; padding:9px 13px;
    border:2px solid #000; background:#3a362a; color:var(--ink); cursor:pointer; }
  #menu button:hover { background:#4e493a; }
  #menu button.main { background:#5f8a45; }
  #menu button.main:hover { background:#6f9c53; }
  #menu button.seg { padding:7px 11px; font-size:13px; background:#2a2720; }
  #menu button.seg.on { background:#7a6a2a; color:#fff6cf; }
  #menu input { background:#0e0d09; cursor:text; }
  #menu #code { width:118px; text-transform:uppercase; letter-spacing:3px; }
  #menu #pname { width:140px; }
  #menu .lbl { font-size:13px; color:var(--muted); }
  #menu button:focus-visible, #menu input:focus-visible, #menu select:focus-visible { outline:2px solid #f2b134; outline-offset:2px; }
  #net { font-size:14px; color:#f2d27a; min-height:1.3em; text-align:center; }
  #classNote { font-size:12px; color:#a9a28a; text-align:center; min-height:1.2em; }
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="1200" height="760" tabindex="0" aria-label="Blockrot game"></canvas>
    <div id="menu">
      <div class="row">
        <input id="pname" maxlength="12" placeholder="Your name" aria-label="Your name" autocomplete="off">
        <span class="lbl">Class</span>
        <select id="pclass" aria-label="Your class"></select>
      </div>
      <p id="classNote"></p>
      <div class="row" id="modeRow">
        <span class="lbl">Mode</span>
        <button class="seg" data-gm="coop">Survival co-op</button>
        <button class="seg" data-gm="dm">Deathmatch</button>
        <button class="seg" data-gm="tdm">Team deathmatch</button>
        <button class="seg" data-gm="gg">Gun game</button>
      </div>
      <div class="row">
        <button id="bSolo" class="main">Play solo</button>
        <button id="bHost">Host online game</button>
        <input id="code" maxlength="5" placeholder="CODE" aria-label="Room code" autocomplete="off">
        <button id="bJoin">Join online game</button>
      </div>
      <p id="net" role="status"></p>
    </div>
  </div>
  <div id="bar"><a href="index.html">Back to study files</a><span>1 2 3 switch weapons &middot; X drops one &middot; C is your class ability &middot; P pauses</span></div>
</div>

/* ---------------- grid + flow field ---------------- */
let OBST = [], obGrid = OB_COOP;
const blocked = new Uint8Array(GW * GH);
function buildGrid(list) {
  obGrid = list;
  OBST = list.map(([x, y, w, h]) => ({ x:x*CELL, y:y*CELL, w:w*CELL, h:h*CELL }));
  blocked.fill(0);
  for (const [x, y, w, h] of list)
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) blocked[j * GW + i] = 1;
}
const isBlockedAt = (px, py) => {
  const cx = Math.floor(px / CELL), cy = Math.floor(py / CELL);
  return cx < 0 || cy < 0 || cx >= GW || cy >= GH || blocked[cy * GW + cx] === 1;
};
const field = new Float32Array(GW * GH);
const queue = new Int32Array(GW * GH);
let fieldT = 0;
function computeField() {
  field.fill(1e9);
  let h = 0, t = 0;
  for (const p of players) {
    if (!p.alive || p.gone) continue;
    const i = clamp(Math.floor(p.y / CELL), 0, GH - 1) * GW + clamp(Math.floor(p.x / CELL), 0, GW - 1);
    if (field[i] !== 0) { field[i] = 0; queue[t++] = i; }
  }
  while (h < t) {
    const i = queue[h++], x = i % GW, y = (i / GW) | 0, d = field[i] + 1;
    if (x > 0)      { const j = i - 1;  if (!blocked[j] && field[j] > d) { field[j] = d; queue[t++] = j; } }
    if (x < GW - 1) { const j = i + 1;  if (!blocked[j] && field[j] > d) { field[j] = d; queue[t++] = j; } }
    if (y > 0)      { const j = i - GW; if (!blocked[j] && field[j] > d) { field[j] = d; queue[t++] = j; } }
    if (y < GH - 1) { const j = i + GW; if (!blocked[j] && field[j] > d) { field[j] = d; queue[t++] = j; } }
  }
}
function flowDir(z, t) {
  const cx = Math.floor(z.x / CELL), cy = Math.floor(z.y / CELL);
  if (cx < 0 || cy < 0 || cx >= GW || cy >= GH)
    return norm(clamp(z.x, CELL * 2, WW - CELL * 2) - z.x, clamp(z.y, CELL * 2, WH - CELL * 2) - z.y);
  const here = field[cy * GW + cx];
  if (here <= 1 || here >= 1e9) return norm(t.x - z.x, t.y - z.y);
  let best = here, bx = 0, by = 0;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
    if (!ox && !oy) continue;
    const nx = cx + ox, ny = cy + oy;
    if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
    if (ox && oy && (blocked[cy * GW + nx] || blocked[ny * GW + cx])) continue;
    const v = field[ny * GW + nx];
    if (v < best) { best = v; bx = ox; by = oy; }
  }
  if (best === here) return norm(t.x - z.x, t.y - z.y);
  return norm((cx + bx + .5) * CELL - z.x, (cy + by + .5) * CELL - z.y);
}

function makeSlot(id, rarity = 'base', o) {
  const def = rarity === 'legendary' ? LEGENDARY[id] : W_DEFS[id];
  if (!def) return makeSlot('m1911');
  const s = { id, rarity, def, name: (rarity === 'rare' ? 'Prime ' : '') + def.name,
              base: rarity === 'legendary' ? null : id, mods: (o && o.mods) ? Object.assign({}, o.mods) : {} };
  s.max = maxAmmo(s, o && o.owner);
  s.ammo = (o && o.ammo !== undefined && o.ammo !== null) ? Math.min(o.ammo < 0 ? Infinity : o.ammo, s.max) : s.max;
  return s;

function maxAmmo(s, p) {

  if (s.rarity === 'rare') m *= 1.5;
  if (s.base && mastery[s.base] && mastery[s.base].lv >= 3) m *= 1.5;
  m *= 1 + .5 * (s.mods.magazine || 0);
  if (p) m *= 1 + .2 * up(p, 'ammoCap');

    if (nm !== Infinity) s.ammo = Math.min(s.ammo, nm);

function stats(s, p) {

/* ---------------- waves ---------------- */

    budget = cap + (excess - miniQueue * MINI_WORTH);
  }
  toSpawn = budget; miniT = 6;
  let nElite = wave >= ELITE_FROM ? Math.ceil(teamSize() / 2) : 0;
  if (activeMods.has('elites')) nElite *= 2;
  if (boss) nElite = Math.floor(nElite / 2);
  eliteAt = new Set(Array.from({ length: nElite }, (_, k) => Math.floor(toSpawn * (k + 1) / (nElite + 1))));
  spawnT = 1.2; intermission = 0;
  for (const p of players) {
    if (p.gone) continue;
    if (!p.alive) { p.alive = true; p.hp = Math.round(maxHp(p) * .5); p.hurt = 1; }
    else p.hp = Math.min(maxHp(p), p.hp + 25);

    p.slow = 0;

  }

}

        burn: (st.burn || d.burn) * st.mult, crit: st.crit, bounces: 0 });
    }
    return;
  }
  const n = d.pellets || 1;
  for (let k = 0; k < n; k++) {
    const aa = (n > 1 && d.kind !== 'bullet') ? a + (k - (n - 1) / 2) * d.spread
                                              : a + rand(-(d.spread || 0), d.spread || 0);
    const sp = (st.speed || d.speed) * (d.kind === 'bullet' ? rand(.92, 1) : 1);
    bullets.push({
      kind: d.kind, x, y, vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp, dmg: st.dmg, owner: p, slot: s,
      life: d.kind === 'bullet' ? (d.life || .9) : 2.5,
      blast: (d.blast || 0) * st.blastMul, blastDmg: (d.blastDmg || 0) * st.mult,
      pierce: d.kind === 'plasma' ? 99 : st.pierce, hit: new Set(), crit: st.crit,
      burn: st.burn && d.kind !== 'flame' ? st.burn : 0,
      size: d.size || 3, color: d.color, ricochet: modCount(s, 'ricochet'), bounces: 0
    });

}

// Every hostile thing a shot from `owner` is allowed to hurt. This runs once per
// bullet per frame, so co-op hands back the live zombie array (no copy at all)
// and PVP lists are built once per frame per team.
let frameNo = 0, hlFrame = -1;
const hlCache = new Map();
function hostileList(owner) {
  if (!PVP()) return zombies;
  const key = !owner ? 'n' : (TEAMS() ? 't' + owner.team : 'p' + owner.i);
  if (hlFrame !== frameNo) { hlCache.clear(); hlFrame = frameNo; }
  let l = hlCache.get(key);
  if (l) return l;
  l = [];
  for (const z of zombies) if (!z.dead) l.push(z);
  for (const q of players) if (q.alive && !q.gone && q.spawnProt <= 0 && (!owner || hostile(owner, q))) l.push(q);
  for (const m of minions) if (!m.dead && m.owner && (!owner || hostile(owner, m.owner))) l.push(m);
  hlCache.set(key, l);

}
function damageAny(e, d, owner, slot, kx, ky, bypass) {
  if (!e) return;
  if (e.tag === 'p') return damagePlayer(e, d, owner, 0, slot);
  if (e.tag === 'm') return damageMinion(e, d);
  return damage(e, d, owner, slot, kx, ky, bypass);
}

function beam(p, s, st, x, y, a) {
  castBeam(p, s, st, x, y, Math.cos(a), Math.sin(a), st.range || s.def.range, modCount(s, 'ricochet') * 2);
}
function castBeam(p, s, st, x, y, dx, dy, range, bounces) {
  const d = s.def;
  let len = range, wall = false, rx2 = -dx, ry2 = -dy;
  for (let t = 6; t < range; t += 6) {
    const px = x + dx * t, py = y + dy * t;
    const out = px < 0 || py < 0 || px > WW || py > WH;
    if (out || (!d.wallpierce && isBlockedAt(px, py))) {
      len = t; wall = true;
      const qx = x + dx * (t - 6), qy = y + dy * (t - 6);
      const hx = isBlockedAt(px, qy), hy = isBlockedAt(qx, py);
      if (hx || hy) { rx2 = hx ? -dx : dx; ry2 = hy ? -dy : dy; }
      break;
    }
  }
  const w = (d.width || 3) / 2;
  for (const e of hostileList(p)) {
    const ox = e.x - x, oy = e.y - y, t = ox * dx + oy * dy;
    if (t > 0 && t < len && Math.abs(ox * dy - oy * dx) < e.r + w)
      damageAny(e, st.dmg * critRoll(st.crit), p, s, dx, dy, true);
  }
  for (const b of barrels) {
    if (!b.alive) continue;
    const ox = b.x - x, oy = b.y - y, t = ox * dx + oy * dy;
    if (t > 0 && t < len && Math.abs(ox * dy - oy * dx) < b.r + w) blowBarrel(b, p, s);
  }
  beams.push({ x1: x, y1: y, x2: x + dx * len, y2: y + dy * len, w: d.width || 3, color: d.color, life: .07, max: .07 });
  burst(x + dx * len, y + dy * len, d.color, 2, 80, 3);
  if (wall && bounces > 0 && len > 12)
    castBeam(p, s, st, x + dx * (len - 6), y + dy * (len - 6), rx2, ry2, range * .7, bounces - 1);
}

function zig(a, b) {
  const pts = [[a.x, a.y]];
  for (let i = 1; i < 6; i++) {
    const t = i / 6;
    pts.push([a.x + (b.x - a.x) * t + rand(-9, 9), a.y + (b.y - a.y) * t + rand(-9, 9)]);
  }
  pts.push([b.x, b.y]);
  return pts;
}
function arc(p, s, st, x, y, a) {
  const d = s.def, dx = Math.cos(a), dy = Math.sin(a);
  const list = hostileList(p);
  let first = null, bd = st.range || d.range;
  for (const e of list) {
    const rx = e.x - x, ry = e.y - y, dd = Math.hypot(rx, ry) || 1;
    if (dd < bd && (rx * dx + ry * dy) / dd > .55) { first = e; bd = dd; }
  }
  if (!first) {
    bolts.push({ pts: zig({ x, y }, { x: x + dx * 70, y: y + dy * 70 }), color: d.color, life: .08, max: .08 });
    return;
  }
  const hit = new Set();
  let from = { x, y }, cur = first, dmg = st.dmg;
  const chains = d.chains + (st.lv >= 2 ? 1 : 0) + modCount(s, 'ricochet') * 3;
  for (let i = 0; i <= chains && cur; i++) {
    hit.add(cur);
    bolts.push({ pts: zig(from, cur), color: d.color, life: .12, max: .12 });
    damageAny(cur, dmg * critRoll(st.crit), p, s, cur.x - from.x, cur.y - from.y, true);
    dmg *= .85;
    from = { x: cur.x, y: cur.y };
    let nx = null, nd = 170;
    for (const e of list) {
      if (hit.has(e) || e.dead) continue;
      const dd = dist(e, from);
      if (dd < nd) { nd = dd; nx = e; }
    }
    cur = nx;
  }
}

function swing(p, s, st, x, y, a) {
  const d = s.def, range = st.range || d.range || 60, arcW = d.arc || 1;
  let hits = 0;
  for (const e of hostileList(p)) {
    const ox = e.x - p.x, oy = e.y - p.y, dd = Math.hypot(ox, oy);
    if (dd > range + e.r) continue;
    let da = Math.atan2(oy, ox) - a;
    while (da > Math.PI) da -= 6.283; while (da < -Math.PI) da += 6.283;
    if (Math.abs(da) > arcW) continue;
    damageAny(e, st.dmg * critRoll(st.crit), p, s, ox, oy, true);
    hits++;
  }
  beams.push({ swing: true, x1: p.x, y1: p.y, r: range, a, arc: arcW, color: d.color, life: .14, max: .14 });
  if (hits) burst(p.x + Math.cos(a) * range * .7, p.y + Math.sin(a) * range * .7, '#fff', 4, 120, 3);
}

function build(p) {
  if (p.build <= 0) { floatText(p.x, p.y - 34, 'No barricades left', '#8f8870'); return; }
  const tx = p.x + p.dx * 40, ty = p.y + p.dy * 40;
  const gx = Math.floor(tx / CELL) * CELL, gy = Math.floor(ty / CELL) * CELL;
  if (isBlockedAt(gx + 1, gy + 1)) return;
  if (barricades.some(b => b.x === gx && b.y === gy)) return;
  const touches = e => Math.hypot(e.x - clamp(e.x, gx, gx + CELL), e.y - clamp(e.y, gy, gy + CELL)) < e.r;
  if (players.some(q => q.alive && !q.gone && touches(q)) || zombies.some(touches) || barrels.some(b => b.alive && touches(b))) return;
  const bhp = 180 * (1 + .4 * up(p, 'fort'));
  barricades.push({ x: gx, y: gy, hp: bhp, max: bhp, owner: p.i });
  p.build--;
  burst(gx + 20, gy + 20, '#a07a45', 6, 80);
}

/* ---------------- minions (summoner / necromancer) ---------------- */
let corpses = [];
const MINION_SLOT = { id:'minion', rarity:'base', mods:{}, base:null, name:'Minion',
                      def:{ kind:'bullet', color:'#9ad7ff', dmg:1 } };
function spawnMinion(owner, kind, life, x, y) {
  const mine = minions.filter(m => m.owner === owner && !m.dead);
  if (mine.length >= MINION_CAP) mine[0].dead = true;
  const drone = kind === 'drone';
  const scale = 1 + (wave - 1) * .06;
  const hp = (drone ? 45 : 110) * scale;
  minions.push({
    id: nextId++, tag: 'm', kind, owner, team: owner.team, x: x ?? owner.x + rand(-26, 26), y: y ?? owner.y + rand(-26, 26),
    r: drone ? 9 : 12, hp, max: hp, dmg: (drone ? 11 : 20) * scale, speed: drone ? 235 : 165,
    life, atk: 0, shootT: rand(.2, .8), dx: 0, dy: 1, walk: 0, flash: 0, inside: true
  });
}
function damageMinion(m, d) {
  if (m.dead) return;
  m.hp -= d; m.flash = .08;
  if (m.hp <= 0) { m.dead = true; burst(m.x, m.y, m.kind === 'drone' ? '#9ad7ff' : '#a9f0c8', 12, 160, 4); }
}
function minionTargets(m) {
  return PVP() ? hostileList(m.owner) : zombies;
}

/* ---------------- class abilities ---------------- */
function clearBuffs(p) { p.buffDmg = 1; p.buffRate = 1; p.buffSpeed = 1; p.freeAmmo = false; }
function useAbility(p) {
  const C = cdef(p);
  if (p.abCd > 0) { floatText(p.x, p.y - 34, `${C.ability} in ${Math.ceil(p.abCd)}s`, '#8f8870'); return; }
  p.abCd = abilityCd(p);
  p.abT = C.dur || 0;
  floatText(p.x, p.y - 40, C.ability + '!', p.head);
  burst(p.x, p.y, p.head, 22, 230, 6);
  if (p.cls === 'soldier') {
    p.buffDmg = 1.15; p.buffRate = .58; p.buffSpeed = 1.25; p.freeAmmo = true;
  } else if (p.cls === 'tank') {
    p.shieldMax = Math.round(120 + 15 * up(p, 'armor') + 6 * wave);
    p.shield = p.shieldMax;
    for (const z of zombies) if (dist(z, p) < 420) { z.tauntBy = p; z.tauntT = C.dur; }
    beams.push({ ring: true, x1: p.x, y1: p.y, r: 420, color: '#9fb3c2', life: .5, max: .5 });
  } else if (p.cls === 'healer') {
    beams.push({ ring: true, x1: p.x, y1: p.y, r: 190, color: '#6fd1c6', life: .5, max: .5 });
  } else if (p.cls === 'summoner') {
    for (let k = 0; k < 4; k++) spawnMinion(p, 'drone', C.dur);
  } else if (p.cls === 'necro') {
    let raised = 0;
    corpses.sort((a, b) => dist(a, p) - dist(b, p));
    for (const c of corpses) {
      if (raised >= 5) break;
      if (dist(c, p) > 460 || c.used) continue;
      c.used = true; raised++;
      spawnMinion(p, 'undead', C.dur, c.x, c.y);
      burst(c.x, c.y, '#a9f0c8', 12, 140, 5);
    }
    corpses = corpses.filter(c => !c.used);
    while (raised < 3) { spawnMinion(p, 'undead', C.dur); raised++; }
  } else if (p.cls === 'mage') {
    const dmg = 150 * cdef(p).dmg * (1 + .08 * up(p, 'power'));
    explode(p.x, p.y, 280, dmg, p, null, 0, '#8aa2ff');
    for (const z of zombies) if (dist(z, p) < 300) z.slow = 3;
    if (PVP()) for (const q of players) if (q.alive && !q.gone && hostile(p, q) && dist(q, p) < 300) q.slow = 2;
    beams.push({ ring: true, x1: p.x, y1: p.y, r: 280, color: '#8aa2ff', life: .45, max: .45 });
  }
}

/* ---------------- hurting people ---------------- */
function onDamageDealt(owner, slot, amount) {
  if (!owner || owner.tag !== 'p' || !owner.alive) return;
  let heal = 0;
  if (slot) heal += amount * .03 * modCount(slot, 'leech');
  heal += amount * .012 * up(owner, 'siphon');
  if (heal > 0) owner.hp = Math.min(maxHp(owner), owner.hp + heal);
}
function damagePlayer(p, d, src, iframe, slot) {
  if (!p || !p.alive || p.gone || p.spawnProt > 0) return;
  if (iframe && p.hurt > 0) return;
  d *= dmgTaken(p);
  if (p.shield > 0) {
    const a = Math.min(p.shield, d);
    p.shield -= a; d -= a;
    burst(p.x, p.y - 6, '#9fb3c2', 3, 90, 4);
  }
  p.hurt = Math.max(p.hurt, iframe || .06);
  if (d <= 0) return;
  p.hp -= d;
  if (p === players[myIndex]) addShake(4);
  burst(p.x, p.y, '#b8322a', 5);
  if (src && src.tag === 'p') onDamageDealt(src, slot, d);
  if (p.hp <= 0) {
    if (PVP()) playerKilled(p, src && src.tag === 'p' ? src : null);
    else isDown(p);
  }
}
function isDown(p) {
  if (p.hp > 0) return;
  p.hp = 0; p.alive = false; p.rev = 0; p.combo = 0; p.shield = 0;
  for (const m of minions) if (m.owner === p) m.life = Math.min(m.life, 3);
  banner(p.name + ' is down. Stand next to them to revive', '#e2735f');
  if (players.every(q => !q.alive || q.gone)) gameOver();
}
const hurt = (p, d, src) => damagePlayer(p, d, src, .3);
const hurtDot = (p, d) => damagePlayer(p, d, null, 0);

/* ---------------- damage, kills, mastery ---------------- */
function damage(z, d, owner, slot, kx, ky, bypass) {
  if (z.dead) return;
  if (z.shield && !bypass) {
    const s = Math.hypot(kx, ky) || 1;
    if ((kx / s) * z.dx + (ky / s) * z.dy < -.35) {
      d *= .2;
      burst(z.x + z.dx * z.r, z.y + z.dy * z.r, '#c9ccd2', 2, 90, 3);
    }
  }
  z.hp -= d; z.flash = .08;
  if (slot) {
    const cryo = modCount(slot, 'cryo');
    if (cryo) z.slow = Math.max(z.slow || 0, 2 * cryo);
  }
  onDamageDealt(owner, slot, d);
  if (!z.boss) {
    const s = Math.hypot(kx, ky) || 1, push = 12 / Math.max(1, z.mass || 2);
    z.x += kx / s * push; z.y += ky / s * push;
  }
  if (Math.random() < .5) burst(z.x, z.y, '#7a1f18', 2, 120, 3);
  if (z.hp <= 0) kill(z, owner, slot);
}

let newZ = [];
function advanceChain(q, id) {
  const m = mastery[id];
  if (!m || m.lv >= 3) return;
  q.chain[id] = (q.chain[id] || 0) + 1;
  q.chainT[id] = CHAIN_WINDOW;
  if (q.chain[id] < masteryNeed(m.lv)) return;
  m.lv++;
  for (const o of players) { o.chain[id] = 0; o.chainT[id] = 0; }
  banner(`${q.name} mastered the ${W_DEFS[id].name}! Team perk ${'I'.repeat(m.lv)}: ${MASTERY_PERKS[m.lv - 1]}`, '#f2d27a', true);
  for (const o of players) {
    if (o.gone) continue;
    burst(o.x, o.y, '#f2d27a', 20, 220, 5);
    recalcSlots(o);
  }
}

function kill(z, owner, slot) {
  if (z.dead) return;
  z.dead = true;
  teamEnergy = Math.min(energyMax(), teamEnergy + (z.boss ? (z.mini ? 10 : 30) : z.elite ? 5 : 1));
  if (owner && owner.tag === 'p') {
    for (const q of players) {
      if (q.gone) continue;
      if (q !== owner && !(SHARE_COMBO && q.alive)) continue;
      q.combo++; q.comboT = 2.2;
    }
    const pts = z.pts * Math.min(owner.combo, 10);
    owner.score += pts;
    owner.kills++;
    owner.cash += Math.round(pts * CASH_RATE * cashMul(owner));
    floatText(z.x, z.y - 24, '+' + pts, owner.head);
    if (slot && slot.base) advanceChain(owner, slot.base);
    if (SHARE_CHAIN) for (const q of players) {
      if (q === owner || !q.alive || q.gone) continue;
      const qs = q.slots[q.cur];
      if (qs && qs.base) advanceChain(q, qs.base);
    }
    // necromancers drag some of what they kill back up
    if (owner.cls === 'necro' && !z.boss && Math.random() < .12)
      spawnMinion(owner, 'undead', 22, z.x, z.y);
  }
  splat(z.x, z.y, z.r, 'rgba(110,22,18,.55)');
  burst(z.x, z.y, z.body, z.boss ? 40 : 10, z.boss ? 300 : 180, z.boss ? 9 : 5);
  if (corpses.length < 60) corpses.push({ x: z.x, y: z.y, life: 14 });
  if (z.bloat) bloatBoom(z);
  if (z.split && zombies.length + newZ.length < spawnCap())
    for (let k = 0; k < 2; k++) newZ.push(makeZombie('crawler', z.x + rand(-12, 12), z.y + rand(-12, 12), true));
  if (boomDepth < 5 && !z.boss) {
    const bm = slot ? modCount(slot, 'boom') : 0;
    if (bm) { boomDepth++; explode(z.x, z.y, 70 * (1 + .35 * bm), 35 * bm, owner, slot); boomDepth--; }
    else if (activeMods.has('volatile')) { boomDepth++; explode(z.x, z.y, 65, 30, owner, slot, 9); boomDepth--; }
  }
  if (z.boss) { bossDeath(z, owner); return; }
  if (z.elite) {
    const m = rollMod();
    dropLoot(z.x, z.y, m);
    if (Math.random() < .6) dropLoot(z.x + rand(-30, 30), z.y + rand(-30, 30), { kind:'weapon', id: rollWeaponId(), rarity:'rare' });
    banner('The elite dropped a ' + MODS[m.id].name + ' mod', MODS[m.id].color);
  }
  const dm = activeMods.has('loot') ? 2 : 1;
  const r = Math.random();
  if (r < .035 * dm) dropLoot(z.x, z.y, { kind:'weapon', id: rollWeaponId(), rarity: Math.random() < .12 ? 'rare' : 'base' });
  else if (r < .09 * dm) { if (!activeMods.has('scarce')) dropPickup(z.x, z.y, 'ammo'); }
  else if (r < .13 * dm) dropPickup(z.x, z.y, 'med');
}

function dropPickup(x, y, type) {
  const [px, py] = freeSpot(x, y, 12);
  pickups.push({ x: px, y: py, type, life: 15 });
}
function dropLoot(x, y, item) {
  const [fx, fy] = freeSpot(x, y, 12);
  const l = { x: fx, y: fy, r: 12, item, bob: rand(0, 6), cool: 0, life: 120 };
  solid(l); loot.push(l);
  return l;
}
function explode(x, y, rad, dmg, owner, slot, hurtPlayers = 0, tint) {
  addShake(Math.min(10, rad / 10));
  const big = rad >= 90;
  burst(x, y, tint || '#ffb347', big ? 22 : 10, rad * 2.4, big ? 7 : 5);
  burst(x, y, '#5a5448', big ? 14 : 5, 120, 9);
  if (hurtPlayers) {
    const ownSide = owner && owner.tag === 'p' && PVP();
    for (const p of players) {
      if (!p.alive || p.gone) continue;
      if (ownSide && p !== owner) continue;          // enemies already took the full blast
      if (Math.hypot(p.x - x, p.y - y) < rad) hurt(p, hurtPlayers);
    }
  }
  g.fillStyle = 'rgba(0,0,0,.3)';
  g.beginPath(); g.arc(x, y, rad * .45, 0, 6.283); g.fill();
  if (mode === 'host' && guests.length && decalQueue.length < 200) decalQueue.push([1, Math.round(x), Math.round(y), rad]);
  for (const e of hostileList(owner)) {
    const d = Math.hypot(e.x - x, e.y - y);
    if (d < rad + e.r) damageAny(e, dmg * (1 - .5 * Math.min(1, d / rad)), owner, slot, e.x - x, e.y - y, true);
  }
  for (const b of barrels) if (b.alive && Math.hypot(b.x - x, b.y - y) < rad) blowBarrel(b, owner, slot);
}
function blowBarrel(b, owner, slot) {
  if (!b.alive) return;
  b.alive = false;
  explode(b.x, b.y, 120, 150, owner, slot, PVP() ? 60 : 0);
}
function bloatBoom(z) {
  addShake(8);
  burst(z.x, z.y, '#b6e04a', 26, 240, 7);
  puddles.push({ x: z.x, y: z.y, r: 50, life: 5 });
  for (const p of players) if (p.alive && !p.gone && dist(p, z) < 95) hurt(p, 28);
  for (const o of zombies) if (o !== z && !o.dead && dist(o, z) < 95) damage(o, 60, null, null, o.x - z.x, o.y - z.y, true);
}

function rollRare() { return { kind:'weapon', id: rollWeaponId(5), rarity:'rare' }; }
function rollLegendary() {
  const taken = new Set([...players.flatMap(p => p.slots.filter(s => s.rarity === 'legendary').map(s => s.id)),
                         ...loot.filter(l => l.item.rarity === 'legendary').map(l => l.item.id)]);
  const free = Object.keys(LEGENDARY).filter(k => !taken.has(k));
  return { kind: 'weapon', id: pick(free.length ? free : Object.keys(LEGENDARY)), rarity: 'legendary' };
}
function rollMod() { return { kind: 'mod', id: pick(Object.keys(MODS)) }; }
function bossDeath(z, owner) {
  addShake(z.mini ? 8 : 16);
  if (z.mini) {
    dropLoot(z.x, z.y, Math.random() < .5 ? rollMod() : rollRare());
    banner(z.name + ' is down', '#ff9f1a');
    return;
  }
  banner(z.name + ' defeated. Grab the loot: whoever touches an item keeps it', '#ff9f1a', true);
  const idx = Math.max(0, wave / BOSS_EVERY - 1);
  const n = teamSize();
  const items = [rollRare()];
  while (items.length < Math.max(2, n)) items.push(Math.random() < .35 + idx * .2 ? rollLegendary() : rollRare());
  if (idx >= 1 && !items.some(i => i.rarity === 'legendary')) items[1] = rollLegendary();
  for (let k = 0; k < Math.max(2, Math.ceil(n / 2) + 1); k++) items.push(rollMod());
  const ringR = 50 + items.length * 7;
  items.forEach((it, k) => {
    const a = k / items.length * 6.283 - 1.571;
    dropLoot(z.x + Math.cos(a) * ringR, z.y + Math.sin(a) * ringR, it);
  });
}

function gameOver() {
  state = 'over';
  if (!PVP() && wave > best) { best = wave; try { localStorage.setItem('blockrot-best', best); } catch (e) {} }
}

/* ---------------- enemy projectiles ---------------- */
const ESHOT = { fire:[6,14,'#ff7a2f'], acid:[7,10,'#b6e04a'], orb:[8,16,'#9ad7ff'],
                ice:[6,11,'#bfe9ff'], bone:[5,19,'#efe7d2'], void:[9,21,'#c77ddb'] };
function eShot(x, y, a, speed, kind) {
  if (eshots.length >= ESHOT_CAP) return;
  const spec = ESHOT[kind] || ESHOT.fire;
  eshots.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: spec[0], dmg: spec[1], kind, life: 2.8 });
}

/* ---------------- team abilities ---------------- */
function throwMedkit(p) {
  if (gameMode === 'dm' || gameMode === 'gg') { floatText(p.x, p.y - 34, 'No medkits in this mode', '#8f8870'); return; }
  if (p.medCd > 0) { floatText(p.x, p.y - 34, `Medkit in ${Math.ceil(p.medCd)}s`, '#8f8870'); return; }
  const allies = players.filter(q => q !== p && !q.gone && (!TEAMS() || q.team === p.team) && dist(q, p) < 900);
  const downed = allies.filter(q => !q.alive).sort((a, b) => dist(a, p) - dist(b, p))[0];
  const hurtAlly = allies.filter(q => q.alive && q.hp < maxHp(q)).sort((a, b) => a.hp / maxHp(a) - b.hp / maxHp(b))[0];
  const target = downed || hurtAlly;
  if (!target) { floatText(p.x, p.y - 34, 'No hurt teammate nearby', '#8f8870'); return; }
  p.medCd = MEDKIT_CD * Math.pow(.88, up(p, 'cool'));
  meds.push({ from: p, to: target, x: p.x, y: p.y, sx: p.x, sy: p.y, t: 0, dur: .55 });
}
function tryStrike(p) {
  if (PVP()) { floatText(p.x, p.y - 34, 'No airstrikes in PVP', '#8f8870'); return; }
  p.strikeT = time;
  if (teamEnergy < energyMax()) { floatText(p.x, p.y - 34, `Airstrike ${Math.floor(teamEnergy / energyMax() * 100)}% charged`, '#8f8870'); return; }
  const alive = players.filter(q => q.alive && !q.gone);
  const pressing = alive.filter(q => time - q.strikeT <= STRIKE_WINDOW);
  if (pressing.length < Math.min(2, alive.length)) {
    floatText(p.x, p.y - 34, 'Waiting for a teammate to press too...', '#f2d27a');
    return;
  }
  teamEnergy = 0;
  for (const q of players) q.strikeT = -9;
  banner(`Airstrike inbound (called by ${pressing.map(q => q.name).join(' + ')})`, '#ff9a3c', true);
  const cx = pressing.reduce((a, q) => a + q.x, 0) / pressing.length;
  const cy = pressing.reduce((a, q) => a + q.y, 0) / pressing.length;
  const vw = 750, vh = 480;
  const inView = zombies.filter(z => Math.abs(z.x - cx) < vw && Math.abs(z.y - cy) < vh);
  inView.sort((a, b) => b.max - a.max);
  for (let k = 0; k < 16; k++) {
    const tg = inView.length ? inView[k % inView.length] : null;
    const x = tg ? tg.x + rand(-40, 40) : cx + rand(-vw, vw) * .8;
    const y = tg ? tg.y + rand(-40, 40) : cy + rand(-vh, vh) * .8;
    strikes.push({ x, y, t: .6 + k * .1, max: .6 + k * .1, owner: pressing[k % pressing.length] });
  }
}

/* ---------------- shop: random offers, infinite levels ---------------- */
function upCost(p, id) {
  const u = UPG[id], lv = up(p, id);
  return Math.round(u.base * Math.pow(u.grow, lv) * (1 + .04 * (wave - 1)));
}
function rollOffers(p, n) {
  const out = [];
  const pool = UPGRADES.map(u => u.id);
  while (out.length < n && out.length < pool.length) {
    const left = pool.filter(id => !out.includes(id));
    out.push(pick(left));
  }
  return out;
}
function shopRows(p) {
  const rows = p.offers.map(id => ({ t: 'up', id }));
  rows.push({ t: 'heal' }, { t: 'ammo' }, { t: 'reroll' }, { t: 'ready' });
  return rows;
}
function rowCost(p, row) {
  if (row.t === 'up') return upCost(p, row.id);
  if (row.t === 'heal') return 300;
  if (row.t === 'ammo') return 450;
  if (row.t === 'reroll') return Math.round(REROLL_BASE * Math.pow(1.6, p.rerolls));
  return 0;
}
function openShop() {
  state = 'shop';
  const upcoming = wave + 1, pool = Object.keys(MODIFIERS);
  nextMods = [];
  if (upcoming % BOSS_EVERY !== 0 && upcoming >= MODIFIERS_FROM) {
    const n = upcoming >= TWO_MODIFIERS_FROM ? 2 : 1;
    while (nextMods.length < n) { const m = pick(pool); if (!nextMods.includes(m)) nextMods.push(m); }
  }
  for (const p of players) {
    if (p.gone) continue;
    p.ready = false; p.msg = ''; p.sel = 0; p.rerolls = 0;
    p.offers = rollOffers(p, OFFER_COUNT);
    if (!p.alive) { p.alive = true; p.hp = Math.round(maxHp(p) / 2); p.hurt = 1; }
  }
  eshots = []; puddles = [];
}
function buyRow(p, row) {
  const say = m => { p.msg = m; p.msgT = 2; };
  if (row.t === 'ready') { p.ready = true; return; }
  const cost = rowCost(p, row);
  if (row.t === 'heal' && p.hp >= maxHp(p)) return say('Already at full health');
  if (p.cash < cost) return say(`Need $${cost - p.cash} more`);
  p.cash -= cost;
  if (row.t === 'heal') { p.hp = maxHp(p); return say('Patched up'); }
  if (row.t === 'ammo') { for (const s of p.slots) s.ammo = s.max; return say('Every weapon refilled'); }
  if (row.t === 'reroll') {
    p.rerolls++;
    p.offers = rollOffers(p, OFFER_COUNT);
    return say('New offers');
  }
  const u = UPG[row.id];
  p.up[row.id] = up(p, row.id) + 1;
  if (row.id === 'armor') p.hp += 22;
  if (row.id === 'kit') p.build = Math.min(buildCap(p), p.build + 2);
  if (row.id === 'ammoCap') recalcSlots(p);
  // Vampire-Survivors style: the slot you bought refills with something new,
  // so you can keep buying forever as long as you can pay the rising price.
  const i = p.offers.indexOf(row.id);
  if (i >= 0) {
    const fresh = UPGRADES.map(x => x.id).filter(id => !p.offers.includes(id) || id === row.id);
    p.offers[i] = pick(fresh.length ? fresh : UPGRADES.map(x => x.id));
  }
  say(`${u.name} ${up(p, row.id)}`);
}
function shopInput(dt) {
  for (const p of players) {
    if (p.gone) continue;
    if (p.msgT > 0) p.msgT -= dt;
    const rows = shopRows(p);
    if (p.ready) { if (inTap(p.i, 'build') || inTap(p.i, 'fire')) p.ready = false; continue; }
    if (inTap(p.i, 'up')) p.sel = (p.sel + rows.length - 1) % rows.length;
    if (inTap(p.i, 'down')) p.sel = (p.sel + 1) % rows.length;
    p.sel = clamp(p.sel, 0, rows.length - 1);
    if (inTap(p.i, 'fire')) buyRow(p, rows[p.sel]);
    else if (inTap(p.i, 'build')) p.ready = true;
  }
  if (players.every(p => p.ready || p.gone)) {
    state = 'play'; intermission = 3;
    banner('Get ready', '#e6dfc8');
  }
}

/* ---------------- camera ---------------- */
function updateCam(dt, snap) {
  const me = players[myIndex];
  if (!me) return;
  const tz = VIEW_ZOOM;
  zoom = snap ? tz : zoom + (tz - zoom) * Math.min(1, dt * 4);
  const vw = W / zoom, vh = (H - AY) / zoom;
  const tx = clamp(me.x, vw / 2, WW - vw / 2), ty = clamp(me.y, vh / 2, WH - vh / 2);
  camX = snap ? tx : camX + (tx - camX) * Math.min(1, dt * 8);
  camY = snap ? ty : camY + (ty - camY) * Math.min(1, dt * 8);
}

/* ---------------- boss brains ---------------- */
function bossBrain(z, t, tdx, tdy, bd, dt) {
  const rage = z.hp < z.max * .4 ? .65 : 1;
  const slow = z.mini ? 1.5 : 1;            // minibosses attack less often
  const rg = rage * slow;
  const a = Math.atan2(tdy, tdx);
  const room = () => zombies.length + newZ.length < spawnCap();
  z.t1 -= dt; z.t2 -= dt; z.t3 -= dt;
  switch (z.key) {
    case 'brood':
      if (z.t1 <= 0) {
        z.t1 = 4.5 * rg;
        if (room()) for (let k = 0; k < 3; k++) newZ.push(makeZombie('crawler', z.x + rand(-50, 50), z.y + rand(-50, 50), true));
        burst(z.x, z.y, '#a08660', 16, 160, 6);
      }
      if (z.t2 <= 0) { z.t2 = 2.2 * rg; for (let k = -1; k <= 1; k++) eShot(z.x, z.y, a + k * .25, 230, 'acid'); }
      break;
    case 'pyre':
      if (z.t1 <= 0) { z.t1 = 3.4 * rg; for (let k = 0; k < 14; k++) eShot(z.x, z.y, k / 14 * 6.283 + time, 200, 'fire'); }
      if (z.t2 <= 0) { z.t2 = 1.2 * rg; for (let k = -1; k <= 1; k++) eShot(z.x, z.y, a + k * .18, 280, 'fire'); }
      if (Math.random() < .5) particles.push({ x: z.x + rand(-z.r, z.r), y: z.y - z.r * 1.4, vx: 0, vy: -60, life: .4, max: .4, size: 7, color: '#ff7a2f' });
      break;
    case 'wraith':
      if (z.blinkT > 0) {
        z.blinkT -= dt; z.frozen = true;
        if (z.blinkT <= 0) {
          burst(z.x, z.y, '#9ad7ff', 20, 200, 6);
          z.x = z.bx; z.y = z.by;
          for (let k = 0; k < 10; k++) eShot(z.x, z.y, k / 10 * 6.283, 210, 'orb');
          burst(z.x, z.y, '#9ad7ff', 20, 200, 6);
          addShake(8);
        }
      } else if (z.t1 <= 0) {
        z.t1 = 5.5 * rg;
        const ang = rand(0, 6.283), bx = t.x + Math.cos(ang) * 170, by = t.y + Math.sin(ang) * 170;
        if (bx > 50 && by > 50 && bx < WW - 50 && by < WH - 50 && !isBlockedAt(bx, by)) { z.bx = bx; z.by = by; z.blinkT = .9; }
      }
      if (z.t2 <= 0) {
        z.t2 = 8 * rg;
        if (room()) for (let k = 0; k < 2; k++) newZ.push(makeZombie('ghoul', z.x + rand(-40, 40), z.y + rand(-40, 40), true));
      }
      break;
    case 'colossus':
      if (z.chargeT > 0) {
        z.chargeT -= dt; z.charging = true;
        z.frozen = z.chargeT > .55;              // winds up, then bulldozes
        if (z.chargeT <= 0) { z.charging = false; z.cdx = 0; }
      } else if (z.t1 <= 0 && bd < 620) {
        z.t1 = 6 * rg; z.chargeT = 1.9; z.cdx = tdx; z.cdy = tdy;
        burst(z.x, z.y, '#8c969e', 14, 130, 6);
      }
      if (z.t2 <= 0) {
        z.t2 = 4.6 * rg;
        addShake(10);
        beams.push({ ring: true, x1: z.x, y1: z.y, r: 230, color: '#8c969e', life: .45, max: .45 });
        for (const p of players) if (p.alive && !p.gone && dist(p, z) < 230) hurt(p, z.dmg);
        for (let k = 0; k < 12; k++) eShot(z.x, z.y, k / 12 * 6.283 + .2, 250, 'bone');
      }
      break;
    case 'tyrant':                                   // full bullet hell
      if (z.t1 <= 0) {
        z.t1 = .16 * rg;
        z.spin = (z.spin || 0) + .38;
        for (let k = 0; k < 3; k++) eShot(z.x, z.y, z.spin + k / 3 * 6.283, 195, 'orb');
      }
      if (z.t2 <= 0) {
        z.t2 = 5 * rg;
        if (room()) for (let k = 0; k < 3; k++) newZ.push(makeZombie('runner', z.x + rand(-50, 50), z.y + rand(-50, 50), true));
      }
      break;
    case 'plague':
      if (z.t1 <= 0) {
        z.t1 = 2.6 * rg;
        for (let k = -2; k <= 2; k++) eShot(z.x, z.y, a + k * .22, 240, 'acid');
      }
      if (z.t2 <= 0) {
        z.t2 = 5.5 * rg;
        for (let k = 0; k < 5; k++) {
          const ang = rand(0, 6.283), rr = rand(60, 220);
          puddles.push({ x: clamp(z.x + Math.cos(ang) * rr, 20, WW - 20), y: clamp(z.y + Math.sin(ang) * rr, 20, WH - 20), r: 46, life: 7 });
        }
        beams.push({ ring: true, x1: z.x, y1: z.y, r: 240, color: '#9fe08a', life: .5, max: .5 });
      }
      if (z.t3 <= 0) {
        z.t3 = 4 * rg;
        let any = false;
        for (const o of zombies) if (o !== z && !o.dead && !o.boss && dist(o, z) < 320 && o.hp < o.max) { o.hp = Math.min(o.max, o.hp + o.max * .3); any = true; }
        if (any) beams.push({ ring: true, x1: z.x, y1: z.y, r: 320, color: '#a9f0c8', life: .4, max: .4 });
      }
      break;
    case 'frost':
      if (z.t1 <= 0) {
        z.t1 = 4.2 * rg;
        beams.push({ ring: true, x1: z.x, y1: z.y, r: 300, color: '#b8e8ff', life: .5, max: .5 });
        for (const p of players) if (p.alive && !p.gone && dist(p, z) < 300) { p.slow = 2.5; hurt(p, z.dmg * .5); }
        for (let k = 0; k < 18; k++) eShot(z.x, z.y, k / 18 * 6.283, 170, 'ice');
      }
      if (z.t2 <= 0) { z.t2 = 1.5 * rg; for (let k = -3; k <= 3; k++) eShot(z.x, z.y, a + k * .13, 290, 'ice'); }
      break;
    case 'gravelord':
      if (z.t1 <= 0) {
        z.t1 = 4 * rg;
        let raised = 0;
        for (const c of corpses) {
          if (raised >= 4 || !room()) break;
          if (dist(c, z) > 700 || c.used) continue;
          c.used = true; raised++;
          newZ.push(makeZombie('walker', c.x, c.y, true));
          burst(c.x, c.y, '#d8d0c0', 10, 130, 5);
        }
        corpses = corpses.filter(c => !c.used);
        if (!raised && room()) for (let k = 0; k < 2; k++) newZ.push(makeZombie('walker', z.x + rand(-60, 60), z.y + rand(-60, 60), true));
      }
      if (z.t2 <= 0) { z.t2 = 1.9 * rg; for (let k = -2; k <= 2; k++) eShot(z.x, z.y, a + k * .16, 330, 'bone'); }
      break;
    case 'devourer':
      if (z.chargeT > 0) { z.chargeT -= dt; z.charging = true; if (z.chargeT <= 0) z.charging = false; }
      else if (z.t1 <= 0 && bd < 520) { z.t1 = 3.4 * rg; z.chargeT = .8; z.cdx = tdx; z.cdy = tdy; }
      if (z.t2 <= 0) {
        z.t2 = 6 * rg;
        beams.push({ ring: true, x1: z.x, y1: z.y, r: 420, color: '#e8734a', life: .5, max: .5 });
        for (const p of players) {
          if (!p.alive || p.gone) continue;
          const d = dist(p, z);
          if (d < 420 && d > 1) { p.x += (z.x - p.x) / d * 150; p.y += (z.y - p.y) / d * 150; solid(p); }
        }
      }
      break;
    case 'warden':
      if (z.t1 <= 0) {
        z.t1 = 7 * rg; z.wardT = 2.4;
        banner(z.name + ' raises its ward', '#c0b0ff');
      }
      if (z.wardT > 0) {
        z.wardT -= dt; z.ward = true; z.frozen = true;
        if (Math.random() < .5) { z.spin = (z.spin || 0) + .5; for (let k = 0; k < 4; k++) eShot(z.x, z.y, z.spin + k / 4 * 6.283, 220, 'void'); }
        if (z.wardT <= 0) z.ward = false;
      }
      if (z.t2 <= 0) { z.t2 = .22 * rg; eShot(z.x, z.y, a + rand(-.12, .12), 340, 'void'); }
      break;
  }
}

/* ---------------- elite bullet hell ---------------- */
function eliteFire(z, t, bd, dt) {
  const P = ELITE_PATTERNS[z.ep];
  if (!P) return;
  z.eT -= dt;
  if (z.eT > 0 || bd > 950) return;
  // more players in the game means elites shoot noticeably faster
  const boost = (1 / (1 + ELITE_RATE_PER_PLAYER * (teamSize() - 1))) * (activeMods.has('elites') ? .72 : 1);
  z.eT = P.every * boost * (z.mini ? 1.4 : 1);
  if (!P.aim) z.eAng += .34;
  const base = P.aim ? Math.atan2(t.y - z.y, t.x - z.x) : z.eAng;
  const n = P.shots;
  for (let k = 0; k < n; k++) {
    const ang = P.aim
      ? base + (n > 1 ? (k - (n - 1) / 2) * (P.arc / (n - 1)) : 0)
      : base + k / n * 6.283;
    eShot(z.x, z.y, ang, P.speed, P.kind);
  }
}

/* ---------------- zombie separation (spatial hash, not n^2) ---------------- */
const SEP_CELL = 72;
const sepMap = new Map();
function separate() {
  sepMap.clear();
  for (const z of zombies) {
    const k = (((z.x / SEP_CELL) | 0) << 12) + ((z.y / SEP_CELL) | 0);
    let a = sepMap.get(k);
    if (!a) sepMap.set(k, a = []);
    a.push(z);
  }
  const push = (a, b, same) => {
    for (let i = 0; i < a.length; i++) {
      const z1 = a[i];
      for (let j = same ? i + 1 : 0; j < b.length; j++) {
        const z2 = b[j];
        const dx = z2.x - z1.x, dy = z2.y - z1.y, m = z1.r + z2.r;
        if (Math.abs(dx) > m || Math.abs(dy) > m) continue;
        const d = Math.hypot(dx, dy);
        if (d >= m || d <= 0) continue;
        const m1 = z1.boss ? 40 : (z1.mass || 2), m2 = z2.boss ? 40 : (z2.mass || 2);
        const wa = m2 / (m1 + m2), o = m - d;
        z1.x -= dx / d * o * wa; z1.y -= dy / d * o * wa;
        z2.x += dx / d * o * (1 - wa); z2.y += dy / d * o * (1 - wa);
      }
    }
  };
  for (const [k, a] of sepMap) {
    push(a, a, true);
    const cx = k >> 12, cy = k & 4095;
    for (const [ox, oy] of [[1, -1], [1, 0], [1, 1], [0, 1]]) {
      const b = sepMap.get(((cx + ox) << 12) + (cy + oy));
      if (b) push(a, b, false);
    }
  }
}

/* ---------------- update ---------------- */
function update(dt) {
  time += dt;
  frameNo++;
  newZ = [];

  fieldT -= dt;
  if (fieldT <= 0) { computeField(); fieldT = .25; }

  for (const p of players) for (const id in p.chainT) {
    if (p.chainT[id] > 0) { p.chainT[id] -= dt; if (p.chainT[id] <= 0) p.chain[id] = 0; }
  }

  // ---- players ----
  for (const p of players) {
    if (p.gone) continue;
    if (p.spawnProt > 0) p.spawnProt -= dt;
    if (p.abCd > 0) p.abCd -= dt;
    if (p.abT > 0) { p.abT -= dt; if (p.abT <= 0) clearBuffs(p); }
    if (p.slow > 0) p.slow -= dt;
    if (p.medCd > 0) p.medCd -= dt;
    if (p.comboT > 0) { p.comboT -= dt; if (p.comboT <= 0) p.combo = 0; }
    if (p.hurt > 0) p.hurt -= dt;

    if (!p.alive) {
      if (PVP()) {
        p.respawn -= dt;
        if (p.respawn <= 0) respawnPlayer(p);
        continue;
      }
      const helpers = players.filter(q => q.alive && !q.gone && q !== p && dist(p, q) < 50);
      const healers = players.filter(q => q.alive && !q.gone && q.cls === 'healer' && q.abT > 0 && dist(p, q) < 190);
      if (helpers.length || healers.length) {
        p.rev += dt * (1 + .5 * Math.max(0, helpers.length - 1) + healers.length);
        const need = 3 - .6 * Math.max(0, ...helpers.concat(healers).map(q => up(q, 'medic')));
        if (p.rev >= need) { p.alive = true; p.hp = 40; p.rev = 0; p.hurt = 1; banner(p.name + ' is back up', '#8fd67a'); }
      } else p.rev = Math.max(0, p.rev - dt);
      continue;
    }

    if (up(p, 'regen')) p.hp = Math.min(maxHp(p), p.hp + .7 * up(p, 'regen') * dt);
    if (p.cls === 'healer') {
      const rad = p.abT > 0 ? 190 : 130, rate = p.abT > 0 ? 16 : 1.4;
      for (const q of players) {
        if (q.gone || !q.alive || (TEAMS() && q.team !== p.team) || (PVP() && !TEAMS() && q !== p)) continue;
        if (dist(q, p) < rad) q.hp = Math.min(maxHp(q), q.hp + rate * dt);
      }
      if (p.abT > 0 && Math.random() < .5)
        particles.push({ x: p.x + rand(-90, 90), y: p.y + rand(-90, 90), vx: 0, vy: -30, life: .5, max: .5, size: 5, color: '#6fd1c6' });
    }

    let mx = (inHeld(p.i, 'right') ? 1 : 0) - (inHeld(p.i, 'left') ? 1 : 0);
    let my = (inHeld(p.i, 'down') ? 1 : 0) - (inHeld(p.i, 'up') ? 1 : 0);
    if (mx || my) {
      const l = Math.hypot(mx, my); mx /= l; my /= l;
      p.dx = mx; p.dy = my; p.walk += dt * 12;
    }
    const spd = pSpeed(p);
    p.x += mx * spd * dt; p.y += my * spd * dt;
    solid(p);

    if (inTap(p.i, 'swap')) switchNext(p);
    for (let k = 0; k < DROP_KEYS.length; k++) if (inTap(p.i, DROP_KEYS[k])) switchTo(p, k);
    if (inTap(p.i, 'drop')) {
      const near = loot.find(l => !l.taken && l.cool <= 0 && l.item.kind === 'weapon' && dist(p, l) < 42);
      if (near) takeLoot(p, near, true);
      else dropWeapon(p);
    }
    p.cd -= dt;
    if (p.burstLeft > 0) {
      p.burstT -= dt;
      if (p.burstT <= 0) {
        const s = p.slots[p.cur];
        p.burstLeft--;
        if (s) { fireOnce(p, s, stats(s, p)); p.burstT = s.def.burstT || .06; }
      }
    } else if (inHeld(p.i, 'fire') && p.cd <= 0) fire(p);
    if (inTap(p.i, 'build')) build(p);
    if (inTap(p.i, 'med')) throwMedkit(p);
    if (inTap(p.i, 'strike')) tryStrike(p);
    if (inTap(p.i, 'ability')) useAbility(p);

    const reach = 26 + 40 * up(p, 'magnet');
    for (const k of pickups) {
      if (k.life > 0 && dist(p, k) < reach) {
        k.life = 0;
        if (k.type === 'ammo') {
          for (const s of p.slots) if (s.ammo !== Infinity) s.ammo = Math.min(s.max, s.ammo + Math.ceil(s.max / 2));
          p.build = Math.min(buildCap(p), p.build + 1);
          floatText(p.x, p.y - 34, 'Ammo + barricade', '#f2d27a');
        } else {
          p.hp = Math.min(maxHp(p), p.hp + 30);
          floatText(p.x, p.y - 34, '+30 health', '#8fd67a');
        }
      }
    }
    for (const l of loot) {
      if (l.taken || l.cool > 0 || dist(p, l) > 28 + 10 * up(p, 'magnet')) continue;
      takeLoot(p, l, false);
    }
    for (const q of puddles) if (dist(p, q) < q.r) hurtDot(p, 14 * dt);
  }
  loot = loot.filter(l => !l.taken);

  // ---- zombies ----
  for (const z of zombies) {
    z.flash -= dt;
    if (z.tauntT > 0) z.tauntT -= dt;
    if (z.burn > 0) {
      z.burn -= dt;
      z.hp -= z.burnDps * dt;
      if (Math.random() < .3) particles.push({ x: z.x + rand(-z.r, z.r), y: z.y - z.r, vx: 0, vy: -40, life: .35, max: .35, size: 5, color: '#ff8a2a' });
      if (z.hp <= 0) kill(z, z.burnOwner, z.burnSlot);
    }
    if (z.dead) continue;

    let t = null, bd = 1e9;
    if (z.tauntT > 0 && z.tauntBy && z.tauntBy.alive && !z.tauntBy.gone) { t = z.tauntBy; bd = dist(z, t); }
    else for (const p of players) {
      if (!p.alive || p.gone) continue;
      const d = dist(z, p);
      if (d < bd) { bd = d; t = p; }
    }
    // minions are a valid snack too
    let mTarget = null, mBd = 1e9;
    for (const m of minions) { if (m.dead) continue; const d = dist(z, m); if (d < mBd) { mBd = d; mTarget = m; } }
    if (!t) continue;
    const tdx = (t.x - z.x) / (bd || 1), tdy = (t.y - z.y) / (bd || 1);
    let [fx, fy] = flowDir(z, t);
    let sp = z.speed;
    z.frozen = false;
    if (z.slow > 0) { z.slow -= dt; sp *= z.boss ? .75 : .5; }

    if (z.ranged && bd < 340) sp *= .35;
    if (z.necro && z.inside && bd < 320) { fx = -tdx; fy = -tdy; sp *= .6; }
    if (!z.inside) {
      z.outT = (z.outT || 0) + dt;
      if (z.outT > 10) { z.x = clamp(z.x, z.r + 40, WW - z.r - 40); z.y = clamp(z.y, z.r + 40, WH - z.r - 40); z.inside = true; }
    }
    if (z.dash) {
      z.dcd -= dt;
      if (z.dashT > 0) { z.dashT -= dt; fx = z.ddx; fy = z.ddy; sp = 430; }
      else if (z.dcd <= 0 && bd < 280) { z.dashT = .4; z.dcd = rand(3, 4.5); z.ddx = tdx; z.ddy = tdy; burst(z.x, z.y, '#9fb3c2', 6, 100); }
    }
    if (z.elite) eliteFire(z, t, bd, dt);
    if (z.boss) {
      bossBrain(z, t, tdx, tdy, bd, dt);
      if (z.charging && !z.frozen) { fx = z.cdx; fy = z.cdy; sp = 470; }
      if (z.frozen) sp = 0;
    }

    const wob = z.boss || z.dashT > 0 ? 0 : Math.sin(time * 2 + z.wob) * .3;
    z.x += (fx - fy * wob) * sp * dt; z.y += (fy + fx * wob) * sp * dt;
    z.dx = tdx; z.dy = tdy; z.walk += dt * Math.abs(sp) * .12;
    if (!z.inside && z.x > z.r && z.x < WW - z.r && z.y > z.r && z.y < WH - z.r) z.inside = true;
    const bar = solid(z);
    z.stuckT = (z.stuckT || 0) + dt;
    if (z.stuckT > 3) {
      if (z.inside && !z.boss && Math.hypot(z.x - (z.lx ?? z.x + 99), z.y - (z.ly ?? 0)) < 25 && bd > 60 && !bar) {
        const a = rand(0, 6.283); z.x += Math.cos(a) * 30; z.y += Math.sin(a) * 30; solid(z);
      }
      z.stuckT = 0; z.lx = z.x; z.ly = z.y;
    }
    if (bar) { bar.hp -= (z.dmg || 10) * 2.5 * dt; if (Math.random() < .1) burst(bar.x + 20, bar.y + 20, '#a07a45', 1, 60); }

    z.atk -= dt;
    if (bd < z.r + t.r + 5) {
      if (z.bloat) { z.hp = 0; kill(z, null, null); continue; }
      if (z.atk <= 0) {
        hurt(t, z.dmg * (z.charging ? 1.6 : 1));
        z.atk = .7;
        if (up(t, 'thorns')) damage(z, 25 * up(t, 'thorns'), t, null, z.x - t.x, z.y - t.y, true);
        if (t.cls === 'tank' && t.abT > 0) { const d = Math.hypot(z.x - t.x, z.y - t.y) || 1; z.x += (z.x - t.x) / d * 40; z.y += (z.y - t.y) / d * 40; }
      }
    } else if (mTarget && mBd < z.r + mTarget.r + 4 && z.atk <= 0) {
      damageMinion(mTarget, z.dmg); z.atk = .8;
    }
    if (z.ranged && z.inside) {
      z.shoot -= dt;
      if (z.shoot <= 0 && bd < 450) {
        z.shoot = rand(2, 3.2) * (activeMods.has('bloodmoon') ? .6 : 1);
        eShot(z.x, z.y - 6, Math.atan2(tdy, tdx), z.ranged === 'acid' ? 230 : 260, z.ranged);
      }
    }
    if (z.necro) {
      z.heal -= dt;
      if (z.heal <= 0) {
        z.heal = 3;
        let any = false;
        for (const o of zombies) if (o !== z && !o.dead && !o.boss && dist(o, z) < 200 && o.hp < o.max) {
          o.hp = Math.min(o.max, o.hp + o.max * .25); any = true;
          burst(o.x, o.y, '#a9f0c8', 4, 60, 4);
        }
        if (any) beams.push({ ring: true, x1: z.x, y1: z.y, r: 200, color: '#a9f0c8', life: .4, max: .4 });
      }
    }
  }
  zombies = zombies.filter(z => !z.dead);
  separate();
  for (const p of players) {
    if (!p.alive || p.gone) continue;
    const pm = pMass(p);
    for (const z of zombies) {
      const dx = p.x - z.x, dy = p.y - z.y, m = p.r + z.r;
      if (Math.abs(dx) > m || Math.abs(dy) > m) continue;
      const d = Math.hypot(dx, dy);
      if (d >= m || d <= 0) continue;
      // heavier players barely budge; a crawler cannot shove a tank any more
      const zm = z.boss ? 60 : (z.mass || 2), o = m - d, share = zm / (zm + pm);
      p.x += dx / d * o * share; p.y += dy / d * o * share;
      if (!z.boss) { z.x -= dx / d * o * (1 - share); z.y -= dy / d * o * (1 - share); }
    }
    solid(p);
  }

  // ---- minions ----
  for (const m of minions) {
    if (m.dead) continue;
    m.flash -= dt;
    if (m.owner.gone) { m.dead = true; continue; }
    m.life -= dt;
    if (m.life <= 0) { m.dead = true; burst(m.x, m.y, m.kind === 'drone' ? '#9ad7ff' : '#a9f0c8', 8, 120, 4); continue; }
    let tg = null, bd = 1e9;
    for (const e of minionTargets(m)) {
      if (e.dead || e === m) continue;
      const d = dist(m, e);
      if (d < bd) { bd = d; tg = e; }
    }
    const own = m.owner;
    const leash = dist(m, own);
    let tx = own.x, ty = own.y, engage = false;
    if (tg && (bd < 460 || leash < 420)) { tx = tg.x; ty = tg.y; engage = true; }
    let dx = tx - m.x, dy = ty - m.y;
    let d = Math.hypot(dx, dy) || 1;
    if (m.kind === 'drone' && engage && d < 170) { dx = -dx; dy = -dy; }      // drones keep their distance
    else if (!engage && d < 60) { dx = dy = 0; d = 1; }
    m.x += dx / d * m.speed * dt; m.y += dy / d * m.speed * dt;
    if (dx || dy) { m.dx = dx / d; m.dy = dy / d; m.walk += dt * 10; }
    if (leash > 900) { m.x = own.x + rand(-40, 40); m.y = own.y + rand(-40, 40); }
    solid(m);
    m.atk -= dt; m.shootT -= dt;
    if (m.kind === 'drone') {
      if (tg && bd < 460 && m.shootT <= 0) {
        m.shootT = .5;
        const a = Math.atan2(tg.y - m.y, tg.x - m.x) + rand(-.06, .06);
        bullets.push({ kind: 'bullet', x: m.x, y: m.y, vx: Math.cos(a) * 760, vy: Math.sin(a) * 760,
          dmg: m.dmg, owner: own, slot: MINION_SLOT, life: .8, pierce: 0, hit: new Set(),
          size: 3, color: '#9ad7ff', crit: 0, bounces: 0, ricochet: 0 });
      }
    } else if (tg && bd < m.r + tg.r + 6 && m.atk <= 0) {
      m.atk = .8;
      damageAny(tg, m.dmg, own, MINION_SLOT, tg.x - m.x, tg.y - m.y, true);
      burst(tg.x, tg.y, '#a9f0c8', 3, 90, 3);
    }
  }
  minions = minions.filter(m => !m.dead);

  // ---- player projectiles ----
  for (const b of bullets) {
    if (b.kind === 'homing') {
      let tg = null, td = 450;
      for (const e of hostileList(b.owner)) { const d = dist(e, b); if (d < td) { td = d; tg = e; } }
      if (tg) {
        const cur = Math.atan2(b.vy, b.vx), want = Math.atan2(tg.y - b.y, tg.x - b.x);
        let diff = want - cur; while (diff > Math.PI) diff -= 6.283; while (diff < -Math.PI) diff += 6.283;
        const na = cur + clamp(diff, -6 * dt, 6 * dt), sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.kind === 'flame') { b.size += dt * 34; b.vx *= .97; b.vy *= .97; }
    if ((b.kind === 'rocket' || b.kind === 'homing') && Math.random() < .7)
      particles.push({ x: b.x, y: b.y, vx: rand(-20, 20), vy: rand(-20, 20), life: .35, max: .35, size: 5, color: '#8a8478' });
    if (b.kind === 'plasma' && Math.random() < .8)
      particles.push({ x: b.x, y: b.y, vx: rand(-30, 30), vy: rand(-30, 30), life: .3, max: .3, size: 4, color: b.color });

    const end = () => { b.dead = true; if (b.blast) explode(b.x, b.y, b.blast, b.blastDmg, b.owner, b.slot, PVP() ? Math.round(b.blastDmg * .6) : 0); };
    if (isBlockedAt(b.x, b.y)) {
      if (b.ricochet && b.bounces < b.ricochet * 2) {
        const px = b.x - b.vx * dt, py = b.y - b.vy * dt;
        const hx = isBlockedAt(b.x, py), hy = isBlockedAt(px, b.y);
        if (hx) b.vx = -b.vx;
        if (hy) b.vy = -b.vy;
        if (!hx && !hy) { b.vx = -b.vx; b.vy = -b.vy; }
        b.x = px; b.y = py; b.bounces++; b.life += .25; b.hit.clear();
        burst(b.x, b.y, '#e6dfc8', 2, 80, 2);
        continue;
      }
      if (b.kind === 'bullet') burst(b.x, b.y, '#d8d0b0', 3, 90, 2);
      end(); continue;
    }
    for (const br of barrels) if (br.alive && dist(b, br) < br.r + b.size) { blowBarrel(br, b.owner, b.slot); if (b.kind !== 'plasma') b.dead = true; break; }
    if (b.dead) continue;
    for (const e of hostileList(b.owner)) {
      if (e.dead || b.hit.has(e) || dist(b, e) > e.r + b.size) continue;
      b.hit.add(e);
      const dmg = b.dmg * critRoll(b.crit || 0);
      if (b.kind === 'rocket' || b.kind === 'homing') { damageAny(e, dmg, b.owner, b.slot, b.vx, b.vy); end(); break; }
      damageAny(e, dmg, b.owner, b.slot, b.vx, b.vy, b.kind !== 'bullet');
      if (b.burn && e.tag !== 'p') { e.burn = 1.6; e.burnDps = Math.max(e.burnDps || 0, b.burn); e.burnOwner = b.owner; e.burnSlot = b.slot; }
      if (b.hit.size > b.pierce) { b.dead = true; break; }
    }
    if (!b.dead && b.life <= 0) { if (b.kind === 'flame') b.dead = true; else end(); }
  }
  bullets = bullets.filter(b => !b.dead);

  // ---- enemy projectiles ----
  for (const f of eshots) {
    f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt;
    const col = (ESHOT[f.kind] || ESHOT.fire)[2];
    if (Math.random() < .45) particles.push({ x: f.x, y: f.y, vx: rand(-15, 15), vy: rand(-15, 15), life: .3, max: .3, size: 5, color: col });
    const stop = () => { f.dead = true; if (f.kind === 'acid') puddles.push({ x: f.x, y: f.y, r: 32, life: 4 }); };
    if (f.life <= 0 || f.x < 0 || f.x > WW || f.y < 0 || f.y > WH || isBlockedAt(f.x, f.y)) { stop(); continue; }
    for (const b of barricades) if (inRect(f, { x: b.x, y: b.y, w: CELL, h: CELL })) { b.hp -= 20; stop(); break; }
    if (f.dead) continue;
    let hitAny = false;
    for (const m of minions) if (!m.dead && dist(f, m) < m.r + f.r) { damageMinion(m, f.dmg); hitAny = true; break; }
    if (hitAny) { stop(); continue; }
    for (const p of players) {
      if (!p.alive || p.gone || dist(f, p) > p.r + f.r) continue;
      damagePlayer(p, f.dmg, null, .12);
      if (f.kind === 'ice') p.slow = Math.max(p.slow, 1.6);
      burst(f.x, f.y, col, 8);
      stop(); break;
    }
  }
  eshots = eshots.filter(f => !f.dead);

  zombies = zombies.filter(z => !z.dead).concat(newZ);
  barricades = barricades.filter(b => {
    if (b.hp > 0) return true;
    burst(b.x + 20, b.y + 20, '#8a6a3a', 14, 150, 5);
    return false;
  });
  pickups = pickups.filter(k => (k.life -= dt) > 0);
  puddles = puddles.filter(q => (q.life -= dt) > 0);
  for (const c of corpses) c.life -= dt;
  corpses = corpses.filter(c => c.life > 0);
  for (const l of loot) { if (l.cool > 0) l.cool -= dt; if (l.life !== undefined) l.life -= dt; }
  loot = loot.filter(l => l.life === undefined || l.life > 0);

  // ---- airstrike + medkits ----
  for (const st of strikes) {
    st.t -= dt;
    if (st.t <= 0) { explode(st.x, st.y, 110, 170, st.owner, null); st.done = true; }
  }
  strikes = strikes.filter(st => !st.done);
  for (const m of meds) {
    m.t += dt;
    const k = Math.min(1, m.t / m.dur);
    m.x = m.sx + (m.to.x - m.sx) * k; m.y = m.sy + (m.to.y - m.sy) * k - Math.sin(k * Math.PI) * 60;
    if (k >= 1) {
      m.done = true;
      if (m.to.gone) continue;
      const heal = 35 + 10 * up(m.from, 'medic');
      if (!m.to.alive) {
        m.to.alive = true; m.to.hp = heal; m.to.rev = 0; m.to.hurt = 1;
        banner(`${m.from.name} revived ${m.to.name} with a medkit`, '#8fd67a');
      } else {
        m.to.hp = Math.min(maxHp(m.to), m.to.hp + heal);
        floatText(m.to.x, m.to.y - 34, '+' + heal + ' health', '#8fd67a');
      }
      burst(m.to.x, m.to.y, '#8fd67a', 14, 140, 5);
    }
  }
  meds = meds.filter(m => !m.done);

  // ---- match flow ----
  if (state === 'play') {
    if (PVP()) {
      if (gameMode !== 'gg') {
        pvpDropT -= dt;
        if (pvpDropT <= 0) { dropArenaWeapon(); pvpDropT = PVP_DROP_EVERY; }
      }
      checkPvpEnd();
    } else if (clearT > 0) {
      clearT -= dt;
      if (clearT <= 0) openShop();
    } else if (intermission > 0) {
      intermission -= dt;
      if (intermission <= 0) nextWave();
    } else {
      if (bossPending) { bossDelay -= dt; if (bossDelay <= 0) { bossPending = false; spawnBoss(); } }
      if (miniQueue > 0) {
        miniT -= dt;
        if (miniT <= 0 && zombies.length < spawnCap()) { spawnMini(); miniQueue--; miniT = 13; }
      }
      if (toSpawn > 0) {
        spawnT -= dt;
        if (spawnT <= 0 && zombies.length < spawnCap()) {
          spawnZombie(); toSpawn--;
          spawnT = Math.max(.2, 1 - wave * .05) * rand(.5, 1.3) / Math.sqrt(crowd());
        }
      } else if (!bossPending && miniQueue <= 0 && zombies.length === 0) {
        clearT = wave % BOSS_EVERY === 0 ? 6 : 2.5;
        activeMods.clear();
        banner('Wave ' + wave + ' cleared. Shop opens shortly', '#8fd67a');
      }
    }
  }

  updateCam(dt, false);
  updateFx(dt);
}

function takeLoot(p, l, force) {
  if (l.taken) return;
  const it = l.item;
  if (it.kind === 'mod') {
    const sl = p.slots[p.cur];
    if (!sl) return;
    const M = MODS[it.id];
    if (!addMod(sl, it.id)) {
      if (force) floatText(p.x, p.y - 34, `${M.name} is maxed on ${sl.name}`, '#8f8870');
      return;
    }
    l.taken = true;
    sl.max = maxAmmo(sl, p);
    const n = sl.mods[it.id];
    banner(`${p.name} fitted ${M.name}${n > 1 ? ' x' + n : ''} to ${sl.name}`, M.color);
    burst(l.x, l.y, M.color, 24, 200, 5);
    return;
  }
  if (gameMode === 'gg') return;
  const same = p.slots.find(s => s.id === it.id && s.rarity === it.rarity);
  if (same) {
    if (same.ammo >= same.max) return;
    same.ammo = same.max; l.taken = true;
    floatText(p.x, p.y - 34, same.name + ' refilled', RARITY_COLOR[same.rarity]);
    return;
  }
  const made = () => makeSlot(it.id, it.rarity, { ammo: it.ammo, mods: it.mods, owner: p });
  if (p.slots.length < SLOT_CAP) {
    const s = made();
    p.slots.push(s); p.cur = p.slots.length - 1; l.taken = true;
    banner(`${p.name} picked up ${s.name}`, RARITY_COLOR[s.rarity]);
    burst(l.x, l.y, RARITY_COLOR[it.rarity], 20, 200, 5);
    return;
  }
  if (!force) return;                       // full hands: press the drop key to swap
  const cur = p.slots[p.cur];
  const s = made();
  p.slots[p.cur] = s;
  l.taken = true;
  const [dx2, dy2] = freeSpot(l.x, l.y, 12);
  const dl = { x: dx2, y: dy2, r: 12, item: slotArrOf(cur), bob: rand(0, 6), cool: .8, life: 90 };
  solid(dl); loot.push(dl);
  banner(`${p.name} swapped ${cur.name} for ${s.name}`, RARITY_COLOR[s.rarity]);
  burst(l.x, l.y, RARITY_COLOR[it.rarity], 20, 200, 5);
}

function updateFx(dt) {
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .9; q.vy *= .9; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  const pcap = guests.length > 4 ? 900 : 1500;
  if (particles.length > pcap) particles.splice(0, particles.length - pcap);
  for (const t of texts) { t.y -= 30 * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  for (const b of beams) b.life -= dt;
  beams = beams.filter(b => b.life > 0);
  for (const b of bolts) b.life -= dt;
  bolts = bolts.filter(b => b.life > 0);
  for (const f of feed) f.life -= dt;
  feed = feed.filter(f => f.life > 0);
  if (banners.length) { banners[0].life -= dt * (banners.length > 2 ? 2 : 1); if (banners[0].life <= 0) banners.shift(); }
  shake = Math.max(0, shake - dt * 44);
}

/* ---------------- drawing ---------------- */
const FONT = '"Trebuchet MS", sans-serif';
const DISPLAY = 'Impact, "Arial Black", sans-serif';

function drawBlock(x, y, s, body, head, dx, dy, walk, flash, arms, eye) {
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(x - s * .9, y + s * .65, s * 1.8, s * .45);
  const bob = Math.sin(walk) * s * .18;
  ctx.fillStyle = '#1d1c16';
  ctx.fillRect(x - s * .6, y + s * .25 + Math.max(0, bob), s * .5, s * .55);
  ctx.fillRect(x + s * .1, y + s * .25 + Math.max(0, -bob), s * .5, s * .55);
  if (arms) {
    ctx.fillStyle = flash ? '#fff' : head;
    const ax = dx * s * .9, ay = dy * s * .9;
    ctx.fillRect(x - s * .8 + ax, y - s * .4 + ay, s * .35, s * .35);
    ctx.fillRect(x + s * .45 + ax, y - s * .4 + ay, s * .35, s * .35);
  }
  ctx.lineWidth = 2; ctx.strokeStyle = '#000';
  ctx.fillStyle = flash ? '#fff' : body;
  ctx.fillRect(x - s * .75, y - s * .7, s * 1.5, s * 1.05);
  ctx.strokeRect(x - s * .75, y - s * .7, s * 1.5, s * 1.05);
  ctx.fillStyle = flash ? '#fff' : head;
  ctx.fillRect(x - s * .62, y - s * 1.65, s * 1.24, s * 1.0);
  ctx.strokeRect(x - s * .62, y - s * 1.65, s * 1.24, s * 1.0);
  if (dy > -.6) {
    ctx.fillStyle = eye;
    const ex = x + dx * s * .28, ey = y - s * 1.3 + Math.max(0, dy) * s * .12;
    ctx.fillRect(ex - s * .38, ey, s * .22, s * .22);
    ctx.fillRect(ex + s * .16, ey, s * .22, s * .22);
  }
}

function drawPlayer(p) {
  if (!p.slots.length) return;
  const me = players[myIndex];
  if (!p.alive) {
    if (PVP()) {
      ctx.globalAlpha = .45;
      ctx.fillStyle = '#6b665a'; ctx.fillRect(p.x - 16, p.y - 8, 32, 14);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#8f8870'; ctx.font = `bold 12px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(p.name + ' respawning ' + Math.ceil(p.respawn), p.x, p.y - 24);
      return;
    }
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(p.x - 17, p.y - 2, 34, 12);
    ctx.fillStyle = '#6b665a'; ctx.fillRect(p.x - 16, p.y - 8, 32, 14);
    ctx.fillStyle = p.head; ctx.fillRect(p.x + 6, p.y - 10, 13, 13);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(p.x - 16, p.y - 8, 32, 14);
    ctx.strokeStyle = 'rgba(143,214,122,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y - 2, 50, 0, 6.283); ctx.stroke();
    if (p.rev > 0) {
      ctx.strokeStyle = '#8fd67a'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(p.x, p.y - 2, 28, -1.571, -1.571 + 6.283 * p.rev / 3); ctx.stroke();
    }
    ctx.fillStyle = p.head; ctx.font = `bold 13px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText(p.name, p.x, p.y - 24);
    return;
  }
  if (p.cls === 'healer' && p.abT > 0) {
    ctx.fillStyle = `rgba(111,209,198,${.10 + .04 * Math.sin(time * 5)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 190, 0, 6.283); ctx.fill();
  }
  if (p.spawnProt > 0) {
    ctx.strokeStyle = `rgba(230,223,200,${.25 + .25 * Math.sin(time * 14)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y - 4, p.r + 12, 0, 6.283); ctx.stroke();
  }
  const s = p.slots[p.cur], st = stats(s, p);
  const blink = p.hurt > 0 && Math.floor(time * 20) % 2 === 0;
  const thick = { rocket: 7, plasma: 8, homing: 7, laser: 4, tesla: 6, flame: 6, melee: 5 }[s.def.kind]
                || (s.def.cat === 'Shotgun' ? 5 : s.def.cat === 'Sniper' ? 3 : 4);
  const gun = () => {
    for (const off of st.dual ? [-9, 9] : [0]) {
      const ox = -p.dy * off, oy = p.dx * off;
      const len = s.def.kind === 'melee' ? 16 : s.def.cat === 'Sniper' ? 30 : 24;
      ctx.strokeStyle = '#111'; ctx.lineWidth = thick;
      ctx.beginPath(); ctx.moveTo(p.x + ox, p.y - 4 + oy); ctx.lineTo(p.x + ox + p.dx * len, p.y - 4 + oy + p.dy * len); ctx.stroke();
      if (s.rarity !== 'base' || s.def.kind !== 'bullet') {
        ctx.strokeStyle = s.rarity === 'base' ? s.def.color : RARITY_COLOR[s.rarity]; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x + ox + p.dx * 10, p.y - 4 + oy + p.dy * 10); ctx.lineTo(p.x + ox + p.dx * (len - 2), p.y - 4 + oy + p.dy * (len - 2)); ctx.stroke();
      }
    }
  };
  if (p.dy < 0) gun();
  drawBlock(p.x, p.y, p.r, p.body, p.head, p.dx, p.dy, p.walk, blink, false, '#000');
  if (p.dy >= 0) gun();
  if (p.shield > 0) {
    const k = p.shield / Math.max(1, p.shieldMax);
    ctx.strokeStyle = `rgba(159,179,194,${.45 + .3 * k})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y - 6, p.r + 9, 0, 6.283); ctx.stroke();
  }
  // class badge
  ctx.fillStyle = 'rgba(18,17,12,.75)'; ctx.fillRect(p.x - 7, p.y - p.r * 1.95 - 24, 14, 14);
  ctx.fillStyle = p.head; ctx.font = `bold 11px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillText(cdef(p).icon, p.x, p.y - p.r * 1.95 - 13);
  ctx.fillStyle = p.head; ctx.font = `bold 13px ${FONT}`;
  const tag = p === me ? ' (you)' : (TEAMS() && me && p.team === me.team ? ' +' : '');
  ctx.fillText(p.name + tag, p.x, p.y - p.r * 1.95);
  if (PVP() && me && p !== me) {
    ctx.fillStyle = '#000'; ctx.fillRect(p.x - 18, p.y - p.r * 1.95 + 4, 36, 4);
    ctx.fillStyle = hostile(me, p) ? '#d0402f' : '#6bbf4a';
    ctx.fillRect(p.x - 18, p.y - p.r * 1.95 + 4, 36 * clamp(p.hp / maxHp(p), 0, 1), 4);
  }
}

function drawMinion(m) {
  const drone = m.kind === 'drone';
  const col = drone ? ['#2f6f88', '#9ad7ff'] : ['#33513f', '#a9f0c8'];
  if (drone) {
    const bob = Math.sin(time * 8 + m.id) * 3;
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(m.x, m.y + 10, 9, 4, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = m.flash > 0 ? '#fff' : col[0];
    ctx.fillRect(m.x - 8, m.y - 8 + bob, 16, 12);
    ctx.fillStyle = m.flash > 0 ? '#fff' : col[1];
    ctx.fillRect(m.x - 4, m.y - 5 + bob, 8, 6);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.strokeRect(m.x - 8, m.y - 8 + bob, 16, 12);
  } else {
    drawBlock(m.x, m.y, m.r, col[0], col[1], m.dx, m.dy, m.walk, m.flash > 0, true, '#d8ffe8');
  }
  ctx.fillStyle = '#000'; ctx.fillRect(m.x - 10, m.y - m.r * 1.6, 20, 3);
  ctx.fillStyle = col[1]; ctx.fillRect(m.x - 10, m.y - m.r * 1.6, 20 * clamp(m.hp / m.max, 0, 1), 3);
}

function drawZombie(z) {
  if (z.elite) {
    ctx.fillStyle = `rgba(242,210,122,${.18 + .1 * Math.sin(time * 6)})`;
    ctx.beginPath(); ctx.arc(z.x, z.y - z.r * .4, z.r * 2.1, 0, 6.283); ctx.fill();
  }
  if (z.blinkT > 0) {
    ctx.strokeStyle = `rgba(154,215,255,${.4 + .4 * Math.sin(time * 30)})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(z.bx, z.by, z.r + 10, 0, 6.283); ctx.stroke();
    ctx.globalAlpha = .5;
  }
  if (z.boss) {
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(z.x, z.y + z.r * .8, z.r * 1.3, z.r * .5, 0, 0, 6.283); ctx.fill();
  }
  if (z.charging) {
    ctx.strokeStyle = 'rgba(255,120,60,.7)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(z.x, z.y); ctx.lineTo(z.x + (z.cdx || 0) * 90, z.y + (z.cdy || 0) * 90); ctx.stroke();
  }
  drawBlock(z.x, z.y, z.r, z.body, z.head, z.dx, z.dy, z.walk, z.flash > 0, true,
            z.necro ? '#e8fff2' : z.boss ? '#fff26b' : z.elite ? '#ffd24a' : '#ff3b2a');
  ctx.globalAlpha = 1;
  if (z.ward) {
    ctx.strokeStyle = `rgba(192,176,255,${.5 + .3 * Math.sin(time * 12)})`; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(z.x, z.y - z.r * .3, z.r + 14, 0, 6.283); ctx.stroke();
  }
  if (z.shield) {
    const a = Math.atan2(z.dy, z.dx);
    ctx.strokeStyle = '#c9ccd2'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(z.x, z.y - z.r * .3, z.r + 6, a - .9, a + .9); ctx.stroke();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(z.x, z.y - z.r * .3, z.r + 9, a - .9, a + .9); ctx.stroke();
  }
  if (z.bloat) {
    ctx.fillStyle = 'rgba(182,224,74,.5)';
    ctx.beginPath(); ctx.arc(z.x, z.y - z.r * .2, z.r * .55 + Math.sin(time * 6 + z.wob) * 2, 0, 6.283); ctx.fill();
  }
  if (z.slow > 0) { ctx.fillStyle = 'rgba(143,216,255,.3)'; ctx.fillRect(z.x - z.r, z.y - z.r * 1.7, z.r * 2, z.r * 2.5); }
  if (z.burn > 0) { ctx.fillStyle = 'rgba(255,120,40,.25)'; ctx.fillRect(z.x - z.r, z.y - z.r * 1.7, z.r * 2, z.r * 2.5); }
  if (z.elite) {
    ctx.fillStyle = '#f2d27a'; ctx.font = `bold 11px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText('ELITE ' + (ELITE_PATTERNS[z.ep] ? ELITE_PATTERNS[z.ep].name : ''), z.x, z.y - z.r * 2.4);
  }
  if (z.mini) {
    ctx.fillStyle = '#e2735f'; ctx.font = `bold 11px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText(z.name, z.x, z.y - z.r * 2.4);
  }
  if ((!z.boss || z.mini) && z.hp < z.max) {
    ctx.fillStyle = '#000'; ctx.fillRect(z.x - z.r, z.y - z.r * 2.1, z.r * 2, 4);
    ctx.fillStyle = z.mini ? '#e2735f' : '#d0402f'; ctx.fillRect(z.x - z.r, z.y - z.r * 2.1, z.r * 2 * Math.max(0, z.hp / z.max), 4);
  }
}

function drawLoot(l) {
  const isMod = l.item.kind === 'mod';
  const col = isMod ? MODS[l.item.id].color : RARITY_COLOR[l.item.rarity];
  const bob = Math.sin(time * 3 + l.bob) * 3;
  const grad = ctx.createLinearGradient(0, l.y - 160, 0, l.y);
  grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, col + '88');
  ctx.fillStyle = grad; ctx.fillRect(l.x - 10, l.y - 160, 20, 160);
  ctx.save(); ctx.translate(l.x, l.y - 6 + bob); ctx.rotate(time * 1.5);
  ctx.fillStyle = col; ctx.fillRect(-10, -10, 20, 20);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(-10, -10, 20, 20);
  ctx.restore();
  let name, tag;
  if (isMod) { name = MODS[l.item.id].name + ' mod'; tag = MODS[l.item.id].desc; }
  else {
    const def = ALL_W(l.item.id) || W_DEFS.m1911;
    name = (l.item.rarity === 'rare' ? 'Prime ' : '') + def.name;
    const mods = l.item.mods ? Object.keys(l.item.mods).filter(k => l.item.mods[k] > 0) : [];
    tag = (l.item.rarity === 'legendary' ? 'Legendary ' : l.item.rarity === 'rare' ? 'Rare ' : '') + (def.cat || '')
      + (mods.length ? '  +' + mods.map(k => MODS[k].name + (l.item.mods[k] > 1 ? ' x' + l.item.mods[k] : '')).join(' +') : '');
  }
  ctx.font = `bold 14px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillStyle = '#000'; ctx.fillText(name, l.x + 1, l.y - 29);
  ctx.fillStyle = col; ctx.fillText(name, l.x, l.y - 30);
  ctx.font = `11px ${FONT}`; ctx.fillStyle = '#e6dfc8';
  ctx.fillText(tag, l.x, l.y - 44);
  const me = players[myIndex];
  if (me && me.alive && dist(me, l) < 46) {
    ctx.fillStyle = '#f2d27a'; ctx.font = `bold 12px ${FONT}`;
    if (isMod) ctx.fillText('Walk over it to fit it to your held weapon', l.x, l.y - 58);
    else if (me.slots.length >= SLOT_CAP) ctx.fillText('Hands full: press X to swap your held weapon', l.x, l.y - 58);
  }
}

function drawWorld() {
  if (shake > 0) {
    shakeX = (shakeX + rand(-shake, shake)) * .5;
    shakeY = (shakeY + rand(-shake, shake)) * .5;
  } else { shakeX *= .82; shakeY *= .82; }
  const sx = shakeX, sy = shakeY;
  ctx.setTransform(zoom, 0, 0, zoom, W / 2 - camX * zoom + sx, AY + (H - AY) / 2 - camY * zoom + sy);
  const vx0 = camX - W / 2 / zoom - 60, vx1 = camX + W / 2 / zoom + 60;
  const vy0 = camY - (H - AY) / 2 / zoom - 60, vy1 = camY + (H - AY) / 2 / zoom + 60;
  const vis = e => e.x > vx0 && e.x < vx1 && e.y > vy0 && e.y < vy1;

  ctx.drawImage(gnd, 0, 0);
  for (const q of puddles) {
    ctx.globalAlpha = Math.min(1, q.life) * .55;
    ctx.fillStyle = '#8fc43a';
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const c of corpses) {
    ctx.globalAlpha = Math.min(1, c.life / 4) * .5;
    ctx.fillStyle = '#4a2a22'; ctx.fillRect(c.x - 7, c.y - 4, 14, 8);
    ctx.globalAlpha = 1;
  }
  for (const o of OBST) {
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(o.x + 6, o.y + 8, o.w, o.h);
    ctx.fillStyle = '#6e6c5c'; ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = '#8d8a76'; ctx.fillRect(o.x, o.y, o.w, 8);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(o.x, o.y, o.w, o.h);
  }
  for (const b of barricades) {
    const k = b.hp / b.max;
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(b.x + 5, b.y + 6, CELL, CELL);
    ctx.fillStyle = k > .5 ? '#8a6636' : k > .25 ? '#6e4f2a' : '#523a20';
    ctx.fillRect(b.x, b.y, CELL, CELL);
    ctx.strokeStyle = '#3a2812'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(b.x + 4, b.y + 4); ctx.lineTo(b.x + CELL - 4, b.y + CELL - 4);
    ctx.moveTo(b.x + CELL - 4, b.y + 4); ctx.lineTo(b.x + 4, b.y + CELL - 4); ctx.stroke();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, CELL, CELL);
  }
  for (const b of barrels) {
    if (!b.alive) continue;
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(b.x - 10, b.y + 6, 26, 8);
    ctx.fillStyle = '#a3291f'; ctx.fillRect(b.x - 12, b.y - 14, 24, 24);
    ctx.fillStyle = '#c9a227'; ctx.fillRect(b.x - 12, b.y - 4, 24, 5);
    ctx.fillStyle = '#c8473a'; ctx.fillRect(b.x - 12, b.y - 14, 24, 5);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(b.x - 12, b.y - 14, 24, 24);
  }
  for (const k of pickups) {
    if (k.life < 3 && Math.floor(time * 8) % 2) continue;
    const bobY = Math.sin(time * 4 + k.x) * 2;
    ctx.fillStyle = k.type === 'ammo' ? '#c9a227' : '#e6dfc8';
    ctx.fillRect(k.x - 10, k.y - 10 + bobY, 20, 20);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(k.x - 10, k.y - 10 + bobY, 20, 20);
    ctx.fillStyle = k.type === 'ammo' ? '#1d1c16' : '#c8322a';
    if (k.type === 'ammo') for (const ox of [-6, -1, 4]) ctx.fillRect(k.x + ox, k.y - 6 + bobY, 3, 12);
    else { ctx.fillRect(k.x - 7, k.y - 2 + bobY, 14, 4); ctx.fillRect(k.x - 2, k.y - 7 + bobY, 4, 14); }
  }
  for (const l of loot) if (vis(l)) drawLoot(l);
  for (const st of strikes) {
    const k = 1 - st.t / st.max;
    ctx.strokeStyle = `rgba(255,80,50,${.4 + .5 * k})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(st.x, st.y, 110 * (1 - k * .6), 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(st.x - 12, st.y); ctx.lineTo(st.x + 12, st.y);
    ctx.moveTo(st.x, st.y - 12); ctx.lineTo(st.x, st.y + 12); ctx.stroke();
  }

  const actors = [];
  for (const p of players) if (!p.gone) actors.push({ y: p.alive ? p.y : p.y - 100, d: () => drawPlayer(p) });
  for (const z of zombies) if (vis(z) || z.boss) actors.push({ y: z.y, d: () => drawZombie(z) });
  for (const m of minions) if (vis(m)) actors.push({ y: m.y, d: () => drawMinion(m) });
  actors.sort((a, b) => a.y - b.y).forEach(a => a.d());

  ctx.lineCap = 'round';
  for (const b of bullets) {
    if (!vis(b)) continue;
    if (b.kind === 'flame') {
      ctx.globalAlpha = Math.max(0, b.life / .42) * .8;
      ctx.fillStyle = b.life > .25 ? '#ffe28a' : b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (b.kind === 'plasma') {
      ctx.fillStyle = b.color + '55'; ctx.beginPath(); ctx.arc(b.x, b.y, b.size * 1.8, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.size * .7, 0, 6.283); ctx.fill();
    } else if (b.kind === 'rocket' || b.kind === 'homing') {
      ctx.fillStyle = b.color; ctx.fillRect(b.x - 4, b.y - 4, 8, 8);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(b.x - 4, b.y - 4, 8, 8);
    } else {
      ctx.strokeStyle = b.slot && b.slot.rarity === 'rare' ? '#9fcbff' : b.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .015, b.y - b.vy * .015); ctx.stroke();
    }
  }
  for (const b of beams) {
    ctx.globalAlpha = b.life / b.max;
    if (b.swing) {
      ctx.strokeStyle = b.color; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(b.x1, b.y1, b.r * .85, b.a - b.arc, b.a + b.arc); ctx.stroke();
    } else if (b.ring) {
      ctx.strokeStyle = b.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x1, b.y1, b.r * (1 - b.life / b.max * .5), 0, 6.283); ctx.stroke();
    } else {
      ctx.strokeStyle = b.color; ctx.lineWidth = b.w * 2.2;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1, b.w * .6);
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    }
  }
  for (const b of bolts) {
    ctx.globalAlpha = b.life / b.max;
    for (const [col, w] of [[b.color, 5], ['#fff', 1.5]]) {
      ctx.strokeStyle = col; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(...b.pts[0]);
      for (const pt of b.pts) ctx.lineTo(...pt);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1; ctx.lineCap = 'butt';
  for (const f of eshots) {
    if (!vis(f)) continue;
    const col = (ESHOT[f.kind] || ESHOT.fire)[2];
    ctx.fillStyle = col + '55'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 2, 0, 6.283); ctx.fill();
    ctx.fillStyle = f.kind === 'orb' ? '#e8f6ff' : f.kind === 'acid' ? '#dff58a' : f.kind === 'ice' ? '#eaffff' : f.kind === 'void' ? '#f0d8ff' : '#ffd36a';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
  }
  for (const q of particles) {
    if (!vis(q)) continue;
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = `bold 15px ${FONT}`;
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2);
    ctx.fillStyle = '#000'; ctx.fillText(t.t, t.x + 1, t.y + 1);
    ctx.fillStyle = t.color; ctx.fillText(t.t, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  for (const m of meds) {
    ctx.fillStyle = '#e6dfc8'; ctx.fillRect(m.x - 9, m.y - 9, 18, 18);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(m.x - 9, m.y - 9, 18, 18);
    ctx.fillStyle = '#c8322a'; ctx.fillRect(m.x - 6, m.y - 2, 12, 4); ctx.fillRect(m.x - 2, m.y - 6, 4, 12);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (activeMods.has('fog') && state !== 'title') drawFog();
}

const fogC = document.createElement('canvas'); fogC.width = W; fogC.height = H;
const fg = fogC.getContext('2d');
function drawFog() {
  fg.globalCompositeOperation = 'source-over';
  fg.clearRect(0, 0, W, H);
  fg.fillStyle = 'rgba(8,8,12,.93)'; fg.fillRect(0, 0, W, H);
  fg.globalCompositeOperation = 'destination-out';
  for (const p of players) {
    if (p.gone) continue;
    const sx = W / 2 + (p.x - camX) * zoom, sy = AY + (H - AY) / 2 + (p.y - camY) * zoom, r = 300 * zoom;
    const gr = fg.createRadialGradient(sx, sy, r * .35, sx, sy, r);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    fg.fillStyle = gr;
    fg.beginPath(); fg.arc(sx, sy, r, 0, 6.283); fg.fill();
  }
  fg.globalCompositeOperation = 'source-over';
  ctx.drawImage(fogC, 0, 0);
}

function pips(x, y, lv, align) {
  const total = 3, w = 10, gap = 3, width = total * (w + gap) - gap;
  const x0 = align === 'right' ? x - width : x;
  for (let k = 0; k < total; k++) {
    ctx.fillStyle = k < lv ? '#f2d27a' : '#3a372c';
    ctx.fillRect(x0 + k * (w + gap), y - 9, w, 10);
  }
  return width;
}

function drawPlayerBlock(p) {
  const x0 = 14;
  ctx.textAlign = 'left';
  ctx.font = `bold 16px ${FONT}`; ctx.fillStyle = p.head;
  ctx.fillText(p.name, x0, 20);
  const nmW = Math.max(28, ctx.measureText(p.name).width + 8);
  const bx = x0 + nmW;
  ctx.fillStyle = '#2e2c24'; ctx.fillRect(bx, 8, 150, 13);
  const fw = 150 * clamp(p.hp / maxHp(p), 0, 1);
  ctx.fillStyle = p.hp > maxHp(p) * .35 ? '#6bbf4a' : '#d0402f';
  ctx.fillRect(bx, 8, fw, 13);
  if (p.shield > 0) {
    ctx.fillStyle = '#9fb3c2';
    ctx.fillRect(bx, 8, 150 * clamp(p.shield / Math.max(1, p.shieldMax), 0, 1), 5);
  }
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(bx, 8, 150, 13);
